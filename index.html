const CODEX_TABS = [
  ['chapter', 'Chapter'], ['marks', 'Marks'], ['stats', 'Stats'], ['skills', 'Skills'], ['inventory', 'Inventory'],
  ['ties', 'Ties'], ['arc', 'Arc'], ['knowledge', 'Knowledge']
];

function renderSystemSection(){
  const container = document.getElementById('systemSection');
  const char = getActiveCharacter();
  if(!char){ container.innerHTML = ''; return; }
  const snap = getActiveSnapshot(char);
  const portraitSrc = snap.systemPortrait || snap.portrait || SILHOUETTE_SVG;
  const sPos = snap.systemPortraitPosition || { x: 50, y: 50 };
  const sortedTitles = [...snap.titles].sort((a, b) => (b.rankTier || 0) - (a.rankTier || 0));
  const recordIndex = String(state.characters.findIndex(c => c.id === char.id) + 1).padStart(3, '0');
  const statusLabel = markSummary(snap).label;
  const divineStatuses = ['Fallen', 'Outer', 'Split'];
  const chg = changesFor(char, snap);

  container.innerHTML = `
    <div class="section-label">SYSTEM — ${escapeHtml(char.name || 'Unnamed')}</div>
    ${renderCharacterRecord(char, snap, portraitSrc, sPos, recordIndex, statusLabel)}

    <div class="codex">
      <div class="codex-tabs" role="tablist" aria-label="System sheet pages">
        <div class="menu-slant">
          ${CODEX_TABS.map(([k, l]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${sysTab === k}" class="${sysTab === k ? 'on' : ''}${chg.section[k] ? ' chg' : ''}"${chg.section[k] ? ' title="Changed since the last chapter"' : ''}>${l}</button>`).join('')}
        </div>
        ${isLocked(snap) ? `<span class="locked-note">CANON · LOCKED — reopen in the Chapter Brief to edit</span>` : `<button class="slant-btn primary" id="editSystemBtn" type="button">Edit whole sheet</button>`}
      </div>
      <div class="codex-page" id="codexPage" role="tabpanel"></div>
    </div>
  `;

  const editSysBtn = document.getElementById('editSystemBtn');
  if(editSysBtn) editSysBtn.addEventListener('click', () => openSystemForm(char, snap));
  wireCharacterRecord(char, snap, sortedTitles);
  container.querySelectorAll('.codex-tabs [data-tab]').forEach(b => b.addEventListener('click', () => {
    if(sysTab === b.dataset.tab) return;
    sysTab = b.dataset.tab;
    container.querySelectorAll('.codex-tabs [data-tab]').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-selected', x === b); });
    renderCodexPage(char, snap, true);
  }));
  renderCodexPage(char, snap, false);
}

function recDetailHtml(cmd, char, snap, sortedTitles){
  const divineStatuses = ['Fallen', 'Outer', 'Split'];
  const row = (k, v, empty) => `<div class="rec-row"><span>${k}</span><b class="${v ? '' : 'empty'}">${v ? escapeHtml(v) : (empty || 'Unrecorded')}</b></div>`;
  const head = (t, jp) => `<div class="rec-detail-head"><span>${t}</span><small lang="ja">${jp}</small></div>`;
  const it = REC_ITEMS.find(i => i.k === cmd);
  switch(cmd){
    case 'identity': return head('IDENTITY', it.jp) + row('Name', char.name) + row('Archetype', archetypeLabel(snap)) + row('Glyph', glyphFor(char)) + row('Chapter', snap.chapterRange, 'No chapter set') + row('Starts at', chapterLabel(snap.startChapter), '⚠ Not set') + row('Presence', PRESENCE_LABEL[snap.presence]);
    case 'titles': return head('TITLES', it.jp) + (sortedTitles.length ? `<div class="titles-row">${sortedTitles.map((t, idx) => renderTitleChip(t, idx)).join('')}</div>` : `<p class="rec-empty">No titles yet.</p>`);
    case 'status': return head('STATUS', it.jp) + row('Marks', markSummary(snap).text, 'None') + row('Marked / bound items', String(markedItems(snap).length)) + row('God / primordial', char.primordial ? 'Yes' : '', 'No') + `<div class="rec-marks">${divineStatuses.map(ds => `<span class="${char.divineStatus === ds ? 'on' : ''}">[${char.divineStatus === ds ? '●' : '○'} ${ds.toUpperCase()}]</span>`).join('')}</div>`;
    case 'authority': return head('AUTHORITY', it.jp) + row('Concept', char.authority) + row('Skills', String((snap.skills || []).length));
    case 'faction': return head('FACTION', it.jp) + row('Faction', char.faction, 'Unassigned');
    case 'state': return head('STATE', it.jp) + row('Emotional state', snap.emotionalState);
    case 'portrait': return head('PORTRAIT', it.jp) + `<p class="rec-empty">${snap.systemPortrait || snap.portrait ? 'Uses your uploaded image.' : 'Uses the generated figure.'}</p><button type="button" class="slant-btn" id="recPortraitBtn">Change or reposition</button>`;
    case 'edit': return head('EDIT', it.jp) + `<p class="rec-empty">Name, archetype, faction, divine status, titles and emotional state.</p><button type="button" class="slant-btn primary" id="recEditBtn">Edit identity</button>`;
  }
  return '';
}
function wireCharacterRecord(char, snap, sortedTitles){
  const rec = document.getElementById('charRecord'); if(!rec) return;
  const fig = document.getElementById('recFigure'), detail = document.getElementById('recDetail');
  const lines = document.getElementById('recLines');
  const anim = HAS_GSAP && !REDUCED_MOTION;
  function drawLine(){
    const r = rec.getBoundingClientRect(), fr = fig.getBoundingClientRect();
    const btn = rec.querySelector(`.rec-cmd[data-cmd="${recCmd}"]`);
    lines.setAttribute('viewBox', `0 0 ${r.width} ${r.height}`);
    if(!recOpen || !btn){ lines.innerHTML = ''; return; }
    const br = btn.getBoundingClientRect();
    const fx = fr.left - r.left + fr.width * 0.5, fy = fr.top - r.top + fr.height * 0.34;
    const bx = br.left - r.left + br.width / 2, by = br.top - r.top + br.height / 2;
    lines.innerHTML = `<line x1="${fx}" y1="${fy}" x2="${bx}" y2="${by}" class="main"/><line x1="${fx}" y1="${fy}" x2="${fx - (bx - fx) * 0.9}" y2="${fy - (by - fy) * 0.9}" class="ghost"/><circle cx="${fx}" cy="${fy}" r="4"/>`;
    if(anim){ const L = Math.hypot(bx - fx, by - fy); gsap.fromTo(lines.querySelector('.main'), { strokeDasharray: L, strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.45, ease: 'power2.out' }); }
  }
  function showCmd(k){
    recCmd = k;
    rec.querySelectorAll('.rec-cmd').forEach(b => b.classList.toggle('on', b.dataset.cmd === k));
    detail.innerHTML = recDetailHtml(k, char, snap, sortedTitles);
    if(k === 'titles' && sortedTitles.some(t => t.rankTier > 0)) wireTitleChipTooltips(sortedTitles);
    const pb = document.getElementById('recPortraitBtn'); if(pb) pb.addEventListener('click', () => openAvatarImageModal(char, snap));
    const eb = document.getElementById('recEditBtn'); if(eb) eb.addEventListener('click', () => openIdentityForm(char, snap));
    if(anim) gsap.fromTo(detail.children, { x: -14, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, stagger: 0.04 });
    drawLine();
  }
  function setOpen(open){
    recOpen = open;
    rec.classList.toggle('open', open);
    fig.setAttribute('aria-expanded', open);
    fig.setAttribute('aria-label', `${open ? 'Close' : 'Open'} the record of ${char.name || 'this character'}`);
    const cmds = rec.querySelectorAll('.rec-cmd, .rec-cmd-title');
    if(open) showCmd(recCmd); else { lines.innerHTML = ''; }
    if(anim){
      gsap.fromTo(fig, { y: 0 }, { y: -14, duration: 0.18, yoyo: true, repeat: 1, ease: 'power2.out' });
      if(open){
        gsap.fromTo(cmds, { opacity: 0, scale: 0.6, rotation: () => gsap.utils.random(-8, 8) }, { opacity: 1, scale: 1, rotation: 0, duration: 0.45, ease: 'back.out(2.2)', stagger: { each: 0.04, from: 'random' } });
        gsap.fromTo('.rec-name-block', { opacity: 1 }, { opacity: 0, x: -20, duration: 0.25 });
      } else {
        gsap.to(cmds, { opacity: 0, scale: 0.7, duration: 0.2, stagger: 0.02 });
        gsap.fromTo('.rec-name-block', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.35, delay: 0.1 });
      }
    }
  }
  fig.addEventListener('click', () => setOpen(!recOpen));
  rec.querySelectorAll('.rec-cmd').forEach(b => {
    b.addEventListener('click', () => showCmd(b.dataset.cmd));
    b.addEventListener('mouseenter', () => { if(anim) gsap.fromTo(b, { x: 0 }, { x: 4, duration: 0.15, yoyo: true, repeat: 1 }); });
  });
  rec.addEventListener('keydown', (e) => { if(e.key === 'Escape' && recOpen){ setOpen(false); fig.focus(); } });
  window.__recDraw = drawLine;
  if(!window.__recResizeBound){ window.__recResizeBound = true; window.addEventListener('resize', () => window.__recDraw && window.__recDraw()); }
  if(recOpen) showCmd(recCmd);
}

        <p>&gt; PRESENCE: ${snap.presence === 'alive' ? 'Alive' : `<span class="presence-${snap.presence}">${escapeHtml(PRESENCE_LABEL[snap.presence].toUpperCase())}</span>`}</p>
        <p>&gt; WHERE: ${where ? escapeHtml(where) : '<span class="dim">not set</span>'}</p>
        <p>&gt; WANTS: ${snap.objective ? escapeHtml(snap.objective) : '<span class="dim">not set</span>'}</p>
        <p class="sep">— CONDITION —</p>
        ${snap.condition.length ? snap.condition.map(x => `<p>&gt; ${escapeHtml(x)}${isNew('condition', x)}</p>`).join('') : `<p class="dim">&gt; nothing noted</p>`}
        <p class="sep">— NOTES —</p>
        ${snap.notes ? `<p class="pre">${escapeHtml(snap.notes)}</p>` : `<p class="dim">&gt; no notes for this chapter</p>`}
      </div>`;
  } else if(sysTab === 'marks'){
    const ms = markSummary(snap), items = markedItems(snap);
    html = codexLeft(n, 'Marks', ms.text || 'Unmarked',
      `${items.length} marked or bound item${items.length === 1 ? '' : 's'} carried · costs are text only`,
      'marksEditBtn', 'Edit marks', ch) +
      `<div class="codex-right">
        <div class="mark-lines">${snap.marks.length ? markLinesHtml(snap.marks, m => chg.isNew('marks', m)) : `<p class="sys-empty">No marks this chapter.</p>`}</div>
        ${items.length ? `<p class="mark-sep">— CARRIED —</p>${items.map(it => `<div class="mark-item">
          <b>${escapeHtml(it.name || 'Untitled item')}</b>${it.boundTo ? ` <span class="bound-tag">BOUND TO ${escapeHtml(it.boundTo.toUpperCase())}</span>` : ''}
          ${markLinesHtml(it.marks)}</div>`).join('')}` : ''}
      </div>`;
  } else if(sysTab === 'stats'){
    const r = 44, c = 2 * Math.PI * r;
    const ranked = (snap.titles || []).slice().sort((a, b) => (b.rankTier || 0) - (a.rankTier || 0))[0];
    html = codexLeft(n, 'Stats', char.name || 'Unnamed',
      `${escapeHtml([archetypeLabel(snap), markSummary(snap).text, char.authority ? 'Concept: ' + char.authority : ''].filter(Boolean).join(' · '))}${ranked ? `<br><span class="crt">&gt; Rank: ${escapeHtml(ranked.name)}${ranked.rankTier ? ' (' + escapeHtml(tierLabel(ranked.rankTier)) + ')' : ''}</span>` : ''}`,
      'mwOpenStats', 'Edit stats', ch) +
      `<div class="codex-right"><div class="gauges">${STAT_LABELS.map(label => {
        const v = Math.max(0, Math.min(100, Number((snap.stats || {})[label]) || 0));
        const hot = label === 'Corruption';
        return `<div class="gauge"><svg viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--amber-dim)" stroke-width="6" stroke-dasharray="3 3"/>
          <circle class="g-arc" cx="60" cy="60" r="${r}" fill="none" stroke="${hot ? 'var(--ember)' : 'var(--amber)'}" stroke-width="6" stroke-dasharray="${(c * v / 100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 60 60)"/>
          <text x="60" y="66" text-anchor="middle" class="g-val">${v}</text>
          <text x="60" y="84" text-anchor="middle" class="g-lv">LV${levelInfo(v).lvl}</text>
        </svg><span>${escapeHtml(label.toUpperCase())}</span></div>`;
      }).join('')}</div></div>`;
  } else if(sysTab === 'skills'){
    html = codexLeft(n, 'Skills', char.authority || 'Authorities',
      snap.skills.length ? `${snap.skills.length} skill${snap.skills.length === 1 ? '' : 's'} · use ← → to move along a branch, ↑ ↓ for siblings` : 'No skills recorded yet.',
      'mwOpenSkills', 'Edit skills', ch) +
      `<div class="codex-right">${snap.skills.length ? `<div class="atree" id="atree" tabindex="0" aria-label="Authority tree. Arrow keys move between skills."></div><div class="atree-detail" id="atreeDetail" aria-live="polite"></div>` : `<div class="sys-empty">Add skills with “Edit skills”. Give a skill a fifth column naming the skill it branches from to grow the tree.</div>`}</div>`;
  } else if(sysTab === 'inventory'){
    const items = snap.inventory || [];
    const slots = Math.max(8, Math.ceil((items.length + 1) / 4) * 4);
    const sel = items.find(i => i.id === invFocus[char.id]) || items[0];
    html = codexLeft(n, 'Inventory', 'Carried', `${items.length} item${items.length === 1 ? '' : 's'} · this chapter version`, 'mwOpenInventory', 'Edit inventory', ch) +
      `<div class="codex-right"><div class="inv-grid">${Array.from({ length: slots }, (_, i) => {
        const it = items[i];
        if(!it) return `<div class="inv-slot empty" aria-hidden="true"></div>`;
        return `<button type="button" class="inv-slot${sel && sel.id === it.id ? ' on' : ''}" data-inv="${escapeAttr(it.id)}">
          ${it.icon ? `<img src="${it.icon}" alt="">` : (it.image ? `<img src="${it.image}" alt="">` : `<b>◈</b>`)}
          <span>${escapeHtml(it.name || 'Untitled')}</span>${(it.marks || []).length || it.boundTo ? `<span class="slot-marks">${(it.marks || []).map(m => `<i class="mk ${escapeAttr(m.kind)}" title="${escapeAttr(MARK_KIND_LABEL[m.kind] || '')}">${MARK_KIND_SHORT[m.kind] || ''}</i>`).join('')}${it.boundTo ? '<i class="mk bound" title="Bound">⛓</i>' : ''}</span>` : ''}${chg.isNew('inventory', it) ? NEW_TAG : ''}</button>`;
      }).join('')}</div>
      ${sel ? `<div class="inv-detail">${sel.image ? `<img src="${sel.image}" alt="">` : ''}<div><h4>${escapeHtml(sel.name || 'Untitled item')}</h4>${sel.boundTo ? `<span class="bound-tag">BOUND TO ${escapeHtml(sel.boundTo.toUpperCase())}</span>` : ''}<p>${sel.desc ? escapeHtml(sel.desc) : '<span class="dim">No description.</span>'}</p>${(sel.marks || []).length ? `<div class="mark-lines">${markLinesHtml(sel.marks)}</div>` : ''}</div></div>` : ''}</div>`;
  } else if(sysTab === 'ties'){
    const inferred = inferredRelationships(char);
    const rels = snap.relationships || [];
    const row = (target, name, rel, note, tag) => {
      const img = target
        ? (target.snapshots && getActiveSnapshot(target).portrait ? `<img src="${getActiveSnapshot(target).portrait}" alt="">` : `<img src="${SILHOUETTE_SVG}" data-gen-char="${escapeAttr(target.id)}" alt="">`)
        : `<img src="${SILHOUETTE_SVG}" alt="" class="unknown">`;
      return `<div class="tie">${img}<div><div class="tie-name">${target ? `<button type="button" class="rel-link" data-char-id="${escapeAttr(target.id)}">${escapeHtml(name)}</button>` : escapeHtml(name)}${tag === 'new' ? NEW_TAG : (tag ? `<span class="rel-inferred-mark">${tag}</span>` : '')}</div><div class="tie-rel">${escapeHtml(rel || '')}${note ? ' · ' + escapeHtml(note) : ''}</div></div></div>`;
    };
    html = codexLeft(n, 'Ties', 'Bonds', `${rels.length} recorded this chapter${inferred.length ? ` · ${inferred.length} inferred from other files` : ''}`, 'mwOpenRelationships', 'Edit ties', ch) +
      `<div class="codex-right">${rels.length || inferred.length
        ? rels.map(r => row(findCharacterById(r.charId), relationshipDisplayName(r), r.relation, r.note, chg.isNew('relationships', r) ? 'new' : '')).join('') +
          inferred.map(r => row(findCharacterById(r.charId), r.name, r.relation ? 'Lists you as: ' + r.relation : 'Lists you as a relationship', r.note, 'inferred')).join('')
        : `<div class="sys-empty">No relationships recorded yet.</div>`}</div>`;
  } else if(sysTab === 'arc'){
    const steps = archetypeTimeline(char);
    html = codexLeft(n, 'Arc', archetypeLabel(snap),
      `${isDivineChar(char) ? 'Divine: one archetype for every chapter.' : 'Each chapter has its own archetype.'}<br><span class="crt">&gt; ${escapeHtml(steps.map(st => st.name).join(' → '))}</span>`,
      'mwOpenArc', 'Edit arc', ch) +
      `<div class="codex-right">
        <ol class="arc-steps" aria-label="Archetype timeline">${steps.map((st, i) => `${i ? '<li class="arc-arrow" aria-hidden="true">→</li>' : ''}<li class="arc-step${st.ids.includes(snap.id) ? ' on' : ''}${st.name === 'UNASSIGNED' ? ' unset' : ''}"><b>${escapeHtml(st.name)}</b><small>${escapeHtml(st.range)}</small>${i && st.from.archetypeReason ? `<em class="arc-reason">${escapeHtml(st.from.archetypeReason)}</em>` : ''}</li>`).join('')}</ol>
        <div class="crt-log" style="margin-top:16px;"><p>&gt; HEADING TOWARD: ${snap.headingToward ? escapeHtml(snap.headingToward) : '<span class="dim">not set</span>'}</p></div>
      </div>`;
  } else if(sysTab === 'knowledge'){
    const kn = snap.knowledge || [], se = snap.secrets || [];
    html = codexLeft(n, 'Knowledge', 'Known', `${kn.length} known · ${se.length} secret${se.length === 1 ? '' : 's'}`, 'mwOpenKnowledge', 'Edit knowledge', ch) +
      `<div class="codex-right crt-log">
        ${kn.length ? kn.map(k => `<p>&gt; ${escapeHtml(k)}${chg.isNew('knowledge', k) ? ' ' + NEW_TAG : ''}</p>`).join('') : `<p class="dim">&gt; nothing known yet</p>`}
        <p class="sep">— SECRETS —</p>
        ${se.length ? se.map(sc => `<p class="${sc.characterKnows ? '' : 'dim'}">&gt; ${escapeHtml(sc.text)}${chg.isNew('secrets', sc) ? ' ' + NEW_TAG : ''}<br><small>character knows: ${sc.characterKnows ? 'yes' : 'no'} · known by: ${escapeHtml(sc.knownBy || '—')}</small></p>`).join('') : `<p class="dim">&gt; no secrets recorded</p>`}
      </div>`;
  }
  page.innerHTML = html;

  const on = (id, fn) => { const el = document.getElementById(id); if(el) el.addEventListener('click', fn); };
  on('mwOpenStats', () => openStatsOnlyForm(char, snap));
  on('mwOpenSkills', () => openSkillsOnlyForm(char, snap));
  on('mwOpenInventory', () => openInventoryOnlyForm(char, snap));
  on('mwOpenRelationships', () => openRelationshipsOnlyForm(char, snap));
  on('mwOpenArc', () => openArcOnlyForm(char, snap));
  on('mwOpenKnowledge', () => openKnowledgeOnlyForm(char, snap));
  on('chapterEditBtn', () => openChapterStateForm(char, snap));
  on('marksEditBtn', () => openMarksForm(char, snap));
  page.querySelectorAll('.rel-link').forEach(btn => btn.addEventListener('click', () => {
    if(findCharacterById(btn.dataset.charId)){ switchActiveCharacter(btn.dataset.charId); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  }));
  page.querySelectorAll('[data-inv]').forEach(b => b.addEventListener('click', () => { invFocus[char.id] = b.dataset.inv; renderCodexPage(char, snap, false); }));
  hydrateGenPortraits(page);
  if(sysTab === 'skills' && snap.skills.length) renderAuthorityTree(char, snap, animate);

  if(HAS_GSAP && !REDUCED_MOTION && animate){
    gsap.fromTo(page.children, { x: 30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, stagger: 0.08, ease: 'power3.out' });
  }
  if(HAS_GSAP && !REDUCED_MOTION && sysTab === 'stats'){
    gsap.fromTo(page.querySelectorAll('.g-arc'), { strokeDashoffset: 300 }, { strokeDashoffset: 0, duration: 1, ease: 'power2.out', stagger: 0.06 });
  }
}

// ---- Authority tree: a navigable constellation, one node in focus at a time ----
// Skills can name a parent skill (5th column in the skills editor); anything
// without a parent branches from the character's Concept / Authority.
function buildSkillTree(char, snap){
  const nodes = { root: { key: 'root', name: char.authority || 'Concept', level: 100, root: true, children: [], parent: null } };
  snap.skills.forEach((sk, i) => { nodes['s' + i] = { key: 's' + i, name: sk.name || 'Unnamed skill', level: sk.level || 0, desc: sk.desc || '', corrupted: !!sk.corrupted, parentName: sk.parent || '', children: [], parent: null }; });
  const byName = {};
  Object.values(nodes).forEach(nd => { if(!nd.root) byName[nd.name.toLowerCase()] = nd; });
  Object.values(nodes).forEach(nd => {
    if(nd.root) return;
    let par = nd.parentName ? byName[nd.parentName.toLowerCase()] : null;
    // guard against loops (a skill can't descend from itself)
    let walk = par; while(walk){ if(walk === nd){ par = null; break; } walk = walk.parentName ? byName[walk.parentName.toLowerCase()] : null; }
    nd.parent = par ? par.key : 'root';
    nodes[nd.parent].children.push(nd.key);
  });
  return nodes;
}
let atreeLoop = null;
function renderAuthorityTree(char, snap, animate){
  const host = document.getElementById('atree'), detail = document.getElementById('atreeDetail');
  if(!host) return;
  const nodes = buildSkillTree(char, snap);
  let focus = nodes[skillFocus[char.id]] ? skillFocus[char.id] : (nodes.root.children[0] || 'root');
  const corrColor = char.corruptionColor || DEFAULT_CORRUPTION_COLOR;
  const W = 640, H = 330, CX = 320, CY = 165;

  function layout(fk){
    const f = nodes[fk], pos = {};
    pos[fk] = { x: CX, y: CY, r: 34, role: 'focus' };
    if(f.parent){ pos[f.parent] = { x: 96, y: CY, r: 20, role: 'parent' };
      // only the neighbours that the up / down keys go to, so labels never pile up
      const all = nodes[f.parent].children, at = all.indexOf(fk);
      if(all.length > 1){
        const prev = all[(at - 1 + all.length) % all.length], next = all[(at + 1) % all.length];
        pos[prev] = { x: 210, y: CY - 112, r: 13, role: 'sibling' };
        if(next !== prev) pos[next] = { x: 210, y: CY + 104, r: 13, role: 'sibling' };
      }
    }
    const kids = f.children.slice(0, 5);
    kids.forEach((k, i) => { const spread = kids.length === 1 ? 0 : (i / (kids.length - 1) - 0.5) * 220; pos[k] = { x: 520, y: CY + spread, r: 18, role: 'child' }; });
    return pos;
  }
  function draw(){
    const f = nodes[focus], pos = layout(focus);
    const color = nd => nd.corrupted ? corrColor : 'var(--amber)';
    let links = '', marks = '';
    Object.entries(pos).forEach(([k, p]) => {
      if(k === focus) return;
      const nd = nodes[k], from = p.role === 'child' ? pos[focus] : (p.role === 'parent' ? pos[focus] : pos[f.parent]);
      if(from) links += `<path class="atree-link ${p.role}" d="M${from.x} ${from.y} C${(from.x + p.x) / 2} ${from.y} ${(from.x + p.x) / 2} ${p.y} ${p.x} ${p.y}" stroke="${color(nd)}"/>`;
    });
    Object.entries(pos).forEach(([k, p]) => {
      const nd = nodes[k], circ = 2 * Math.PI * (p.r + 6), done = circ * Math.min(100, nd.level) / 100;
      const label = nd.name.length > 22 ? nd.name.slice(0, 21) + '…' : nd.name;
      marks += `<g transform="translate(${p.x} ${p.y})"><g class="atree-node ${p.role}${nd.root ? ' root' : ''}${nd.corrupted ? ' corrupt' : ''}" data-key="${k}">
        ${p.role === 'focus' ? `<circle class="atree-halo" r="${p.r + 22}"/><g class="atree-orbit">${[0, 1, 2].map(i => `<circle r="2.4" cx="${(p.r + 14) * Math.cos(i * 2.094)}" cy="${(p.r + 14) * Math.sin(i * 2.094)}"/>`).join('')}</g>` : ''}
        <circle class="atree-track" r="${p.r + 6}"/>
        ${nd.root ? '' : `<circle class="atree-prog" r="${p.r + 6}" stroke="${color(nd)}" stroke-dasharray="${done.toFixed(1)} ${circ.toFixed(1)}" transform="rotate(-90)"/>`}
        <circle class="atree-core" r="${p.r}" ${nd.root ? '' : `stroke="${color(nd)}"`}/>
        ${p.role === 'focus' ? `<text class="atree-lv" y="6" text-anchor="middle">${nd.root ? '◆' : 'LV' + levelInfo(nd.level).lvl}</text>` : ''}
        <text class="atree-label" y="${p.r + (p.role === 'focus' ? 30 : 22)}" text-anchor="middle">${escapeHtml(label.toUpperCase())}</text>
      </g></g>`;
    });
    const stars = Array.from({ length: 46 }, (_, i) => `<circle cx="${(i * 137) % W}" cy="${(i * 71) % H}" r="${i % 9 === 0 ? 1.3 : 0.6}" opacity="${0.12 + (i % 5) * 0.07}"/>`).join('');
    const crumbs = []; let w = f; while(w){ crumbs.unshift(w); w = w.parent ? nodes[w.parent] : null; }
    host.innerHTML = `
      <svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><g class="atree-stars">${stars}</g>${links}${marks}</svg>
      <div class="atree-crumbs">${crumbs.map(c => `<button type="button" data-key="${c.key}" class="${c.key === focus ? 'on' : ''}">${escapeHtml(c.name.toUpperCase())}</button>`).join('<span>›</span>')}</div>
      <div class="atree-nav">
        <button type="button" data-go="parent" ${f.parent ? '' : 'disabled'} aria-label="Back to parent">← BACK</button>
        <button type="button" data-go="prev" aria-label="Previous sibling">↑</button>
        <button type="button" data-go="next" aria-label="Next sibling">↓</button>
        <button type="button" data-go="child" ${f.children.length ? '' : 'disabled'} aria-label="Into first branch">BRANCH →</button>
      </div>`;
    // description, S1 console style
    const lvl = levelInfo(f.level);
    detail.innerHTML = f.root
      ? `<div class="sig-bar"><span>CONCEPT · ${escapeHtml(f.name.toUpperCase())}</span><span class="dim">${f.children.length} BRANCH${f.children.length === 1 ? '' : 'ES'}</span></div><p class="crt">&gt; every skill grows from here. pick a branch →</p>`
      : `<div class="sig-bar"><span>${escapeHtml(f.name.toUpperCase())}</span><span class="dim">${f.corrupted ? 'CORRUPTED · ' : ''}LV${lvl.lvl} · ${Math.round(f.level)}/100</span></div>
         <i class="seg${f.corrupted ? ' hot' : ''}" style="width:${Math.min(100, f.level)}%"></i>
         <p>${f.desc ? escapeHtml(f.desc) : '<span class="dim">No description yet.</span>'}</p>
         <p class="crt dim">&gt; branches from ${escapeHtml(nodes[f.parent].name)}${f.children.length ? ` · leads to ${f.children.map(k => escapeHtml(nodes[k].name)).join(', ')}` : ''}</p>`;
    host.querySelectorAll('.atree-node:not(.focus), .atree-crumbs button').forEach(el => el.addEventListener('click', () => go(el.dataset.key)));
    host.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => step(b.dataset.go)));
    animateTree();
  }
  function step(dir){
    const f = nodes[focus];
    if(dir === 'parent' && f.parent) go(f.parent, 'left');
    else if(dir === 'child' && f.children.length) go(f.children[0], 'right');
    else if((dir === 'prev' || dir === 'next') && f.parent){
      const sib = nodes[f.parent].children, i = sib.indexOf(focus);
      go(sib[(i + (dir === 'next' ? 1 : -1) + sib.length) % sib.length], dir === 'next' ? 'down' : 'up');
    }
  }
  function go(key, from){
    if(!nodes[key] || key === focus) return;
    const prev = nodes[focus];
    from = from || (nodes[key].parent === focus ? 'right' : (prev.parent === key ? 'left' : 'down'));
    focus = key; skillFocus[char.id] = key; lastFrom = from; draw();
  }
  let lastFrom = animate ? 'fade' : null;
  function animateTree(){
    if(atreeLoop){ atreeLoop.forEach(t => t.kill()); atreeLoop = null; }
    if(!HAS_GSAP || REDUCED_MOTION) return;
    const svg = host.querySelector('svg');
    const dx = { right: 120, left: -120 }[lastFrom] || 0, dy = { down: 60, up: -60 }[lastFrom] || 0;
    if(lastFrom){
      gsap.fromTo(svg.querySelectorAll('.atree-node'), { opacity: 0, x: (i, el) => (el.classList.contains('focus') ? dx : dx * 0.5), y: dy }, { opacity: 1, x: 0, y: 0, duration: 0.55, ease: 'power3.out', stagger: 0.03 });
      gsap.fromTo(svg.querySelectorAll('.atree-link'), { strokeDashoffset: 260 }, { strokeDashoffset: 0, duration: 0.8, ease: 'power2.out' });
      gsap.fromTo(svg.querySelector('.focus .atree-prog'), { strokeDashoffset: 260 }, { strokeDashoffset: 0, duration: 1, ease: 'power2.out' });
      gsap.fromTo(detail.children, { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.4, stagger: 0.05 });
    }
    atreeLoop = [
      gsap.to(svg.querySelector('.atree-orbit'), { rotation: 360, svgOrigin: '0 0', duration: 6, ease: 'none', repeat: -1 }),
      gsap.fromTo(svg.querySelector('.atree-halo'), { attr: { 'stroke-opacity': 0.5 }, scale: 0.92, svgOrigin: '0 0' }, { attr: { 'stroke-opacity': 0 }, scale: 1.25, duration: 2.2, ease: 'sine.out', repeat: -1 }),
      gsap.to(svg.querySelector('.atree-stars'), { x: -14, duration: 14, ease: 'sine.inOut', repeat: -1, yoyo: true }),
      gsap.to(svg.querySelectorAll('.atree-link'), { strokeDashoffset: -40, duration: 2.4, ease: 'none', repeat: -1 })
    ];
  }
  host.addEventListener('keydown', (e) => {
    const map = { ArrowLeft: 'parent', ArrowRight: 'child', ArrowUp: 'prev', ArrowDown: 'next' };
    if(map[e.key]){ e.preventDefault(); step(map[e.key]); }
  });
  draw();
}

// ============================================================
// CHAPTER BRIEF — read-only one-page summary of the character entering the
// active chapter, built from the chapter state. Replaces the Generation
// ledger (kept as legacyGenerationStates). Each chapter is a draft until
// locked as canon; locked chapters cannot be edited.
// ============================================================
function isLocked(snap){ return !!(snap && snap.locked); }
// Call at the top of every editor; returns true (and explains) when locked.
function blockIfLocked(snap){
  if(!isLocked(snap)) return false;
  showToast('This chapter is locked as canon. Reopen it in the Chapter Brief to edit.');
  return true;
}
function locationPath(ref){
  if(!ref || !ref.countryId) return '';
  const wdb = getWorldDatabase();
  if(!wdb) return '(place set — open the Atlas once to load names)';
  const era = wdb.eras.find(e => e.id === ref.eraId);
  const cont = wdb.continents.find(c => c.id === ref.continentId && c.era === ref.eraId);
  const country = wdb.countries.find(c => c.id === ref.countryId && c.era === ref.eraId);
  const city = ref.cityId ? wdb.cities.find(c => c.id === ref.cityId && c.era === ref.eraId) : null;
  const site = ref.specialSiteId ? wdb.specialSites.find(x => x.id === ref.specialSiteId) : null;
  return [era, cont, country, city, site].filter(Boolean).map(x => x.name).join(' / ');
}
// Builds the brief once; both the screen and the clipboard text use it.
// Each row: { label, text (plain), items?: [{ text, tag? }] }.
function buildBrief(char, snap){
  const prev = previousSnapshot(char, snap);
  const chg = changesFor(char, snap);
  const markText = m => `${m.kind}: ${m.name || 'unnamed'}${m.effect ? ' — ' + m.effect : ''}${m.cost ? ' (cost: ' + m.cost + ')' : ''}${m.ends ? ' (ends: ' + m.ends + ')' : ''}`;
  const relText = r => `${relationshipDisplayName(r) || 'Unnamed'}${r.relation ? ' — ' + r.relation : ''}${r.note ? ', ' + r.note : ''}`;
  const rels = (snap.relationships || []).map(r => ({ text: relText(r), tag: chg.isNew('relationships', r) ? 'new' : '' }));
  if(prev){
    const nowNames = new Set((snap.relationships || []).map(r => (relationshipDisplayName(r) || '').toLowerCase()));
    (prev.relationships || []).filter(r => !nowNames.has((relationshipDisplayName(r) || '').toLowerCase()))

function genSourceFor(char, snap){

function hydrateGenPortraits(root){

const GLYPHS = [
  [/primordial|origin/i, '原初'], [/\bgod|deity|divine/i, '神'], [/demon|devil|fiend/i, '魔'],
  [/angel|seraph/i, '天使'], [/void|nothing|null/i, '虚無'], [/story|author|fate/i, '物語'],

function glyphFor(char){

// Real moon age today (days since new moon), for the readout.
function lunarAgeToday(){
  const synodic = 29.530588853, ref = Date.UTC(2000, 0, 6, 18, 14);
  const days = (Date.now() - ref) / 86400000;
  return Math.floor(((days % synodic) + synodic) % synodic);

// Latest committed location for the active chapter, resolved to a name + coordinates.
// The active chapter's location, resolved to a name + coordinates.
function heroLocation(char){
  const snap = getActiveSnapshot(char);
  const ref = snap.location && snap.location.countryId ? snap.location : null, text = '';
  if(!ref) return null;
  const wdb = getWorldDatabase();
  if(!wdb) return { label: text, era: ref.eraId };
  const site = ref.specialSiteId ? wdb.specialSites.find(x => x.id === ref.specialSiteId && x.era === ref.eraId) : null;
  const city = ref.cityId ? wdb.cities.find(x => x.id === ref.cityId && x.era === ref.eraId) : null;
  const country = wdb.countries.find(x => x.id === ref.countryId && x.era === ref.eraId);
  const pick = [site, city, country].find(x => x && typeof x.lat === 'number');
  const era = wdb.eras.find(e => e.id === ref.eraId);

// Rotating sphere of digits behind the portrait (Void Archive). One loop at a time.
let heroSphere = null;
function startHeroSphere(cv, seedStr){
  if(heroSphere) heroSphere.stop();
  const ctx = cv.getContext('2d'), pts = [], N = 460;
  let h = 0; for(const ch of seedStr) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  for(let i = 0; i < N; i++){ const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), th = i * 2.39996; pts.push([Math.cos(th) * r, y, Math.sin(th) * r, (i * 7 + h) % 10]); }
  let a = 0, raf = 0, alive = true;
  function frame(){
    const w = cv.clientWidth, hh = cv.clientHeight; if(!w || !hh) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    if(cv.width !== Math.round(w * dpr)){ cv.width = Math.round(w * dpr); cv.height = Math.round(hh * dpr); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, hh);
    const R = Math.min(w, hh) * 0.38, cx = w * 0.5, cy = hh * 0.44;
    ctx.font = '10px "VT323", "Space Mono", monospace'; ctx.textAlign = 'center';
    for(const [x, y, z, d] of pts){
      const xr = x * Math.cos(a) - z * Math.sin(a), zr = x * Math.sin(a) + z * Math.cos(a);
      const yr = y * Math.cos(0.35) - zr * Math.sin(0.35), z2 = y * Math.sin(0.35) + zr * Math.cos(0.35);
      const sdepth = (z2 + 1.6) / 2.6;
      ctx.fillStyle = `rgba(255,178,56,${(0.05 + sdepth * 0.55).toFixed(2)})`;
      ctx.fillText(d, cx + xr * R, cy + yr * R);
    }
  }
  function loop(){ if(!alive) return; if(!document.hidden){ a += 0.0032; frame(); } raf = requestAnimationFrame(loop); }
  frame(); if(!REDUCED_MOTION) raf = requestAnimationFrame(loop);
  const onResize = () => frame(); window.addEventListener('resize', onResize);
  heroSphere = { stop(){ alive = false; cancelAnimationFrame(raf); window.removeEventListener('resize', onResize); } };
}
function splitChars(el){

// per-character, per-side paging offsets (not persisted — resets on reload)
const GALLERY_WINDOW = 3;
let pageState = {};
// transient, not persisted — which corruption-view mode is showing per character this session
let skillViewOverride = {};

function renderGalleries(char){
  const leftList = [];
  const rightList = [];
  char.snapshots.forEach((snap, idx) => (idx % 2 === 0 ? leftList : rightList).push(snap));

  if(!pageState[char.id]) pageState[char.id] = { left: 0, right: 0 };

  renderSideGallery('left', char, leftList);
  renderSideGallery('right', char, rightList);
}

function renderSideGallery(side, char, list){
  const maxStart = Math.max(0, list.length - GALLERY_WINDOW);
  let start = pageState[char.id][side];
  if(start > maxStart) start = maxStart;
  pageState[char.id][side] = start;

  const visible = list.slice(start, start + GALLERY_WINDOW);
  const col = document.getElementById(side === 'left' ? 'galleryLeft' : 'galleryRight');
  col.innerHTML = '';

  visible.forEach(snap => {
    const thumb = document.createElement('div');
    thumb.className = 'gallery-thumb' + (snap.id === char.activeSnapshotId ? ' active' : '');
    thumb.innerHTML = `
      ${snap.portrait ? `<img src="${snap.portrait}" alt="">` : `<img src="${SILHOUETTE_SVG}" style="opacity:.35" alt="">`}
      ${snap.chapterRange ? `<div class="snap-label">${escapeHtml(snap.chapterRange)}</div>` : ''}
      ${char.snapshots.length > 1 ? `<div class="snap-delete" title="Remove this version">&times;</div>` : ''}
    `;
    thumb.addEventListener('click', (e) => {
      if(e.target.classList.contains('snap-delete')){
        confirmDeleteSnapshot(char.id, snap.id);
      }else{
        switchSnapshot(char.id, snap.id);
      }
    });
    col.appendChild(thumb);
  });

  const upBtn = document.getElementById(side === 'left' ? 'leftUp' : 'rightUp');
  const downBtn = document.getElementById(side === 'left' ? 'leftDown' : 'rightDown');
  upBtn.classList.toggle('hidden', start <= 0);
  downBtn.classList.toggle('hidden', start + GALLERY_WINDOW >= list.length);
  upBtn.onclick = () => {
    pageState[char.id][side] = Math.max(0, start - 1);
    renderSideGallery(side, char, list);
  };
  downBtn.onclick = () => {
    pageState[char.id][side] = Math.min(maxStart, start + 1);
    renderSideGallery(side, char, list);
  };
}

function renderRail(){
  rail.innerHTML = '';
  const rc = document.getElementById('railCount'); if(rc) rc.textContent = String(state.characters.length).padStart(2, '0') + ' ON FILE';
  state.characters.forEach(c => {

let pendingPortraitSeed = '';

function wireCharacterExtras(existingChar){
  pendingPortraitSeed = existingSnapFor(existingChar).portraitSeed || '';
  const prev = document.getElementById('genPrev');
  const refresh = () => {
    if(!window.EpitaphPortrait || !prev || !prev.isConnected) return; // form closed before the debounce fired

          : s)

  const last = Math.max(...starts);
  const next = chapterList().find(c => c.number > last);
  return next ? next.number : last + 1;

// Deep copy of a chapter's state for the next chapter, with fresh ids on list
// items (marks and inventory) so the two chapters never share an object.
function carryForwardState(prev){
  const copy = v => JSON.parse(JSON.stringify(v === undefined ? null : v));
  const freshMarks = list => (list || []).map(m => ({ ...normalizeMark(m), id: newId('mark') }));
  return {
    copiedFrom: prev.id,
    locked: false,
    presence: prev.presence || 'alive',
    archetypeReason: '', // a reason belongs to the chapter where the archetype changed
    stats: { ...(prev.stats || {}) },
    inventory: (prev.inventory || []).map(i => ({ ...copy(i), id: newId('inv'), marks: freshMarks(i.marks) })),
    skills: copy(prev.skills || []),
    titles: copy(prev.titles || []),
    emotionalState: prev.emotionalState || '',
    archetype: prev.archetype || '',
    location: prev.location ? { ...prev.location } : null,
    objective: prev.objective || '',
    relationships: (prev.relationships || []).map(normalizeRelationship),
    knowledge: (prev.knowledge || []).slice(),
    secrets: (prev.secrets || []).map(normalizeSecret),
    condition: (prev.condition || []).slice(),
    marks: freshMarks(prev.marks),
    notes: prev.notes || '',
    headingToward: prev.headingToward || '',
    portraitFigure: prev.portraitFigure || '',
    portraitStyle: prev.portraitStyle || '',
    portraitSeed: prev.portraitSeed || ''
  };
}

// ---- Marks editor (shared by character marks and item marks) ----
// A path names the list being edited: 'char' (pendingMarks) or 'item:<idx>'
// (pendingInventoryItems[idx].marks). Inputs carry the path, so one sync
// reads every list on screen before any re-render.
const MARK_KIND_LABEL = { blessing: 'Blessing', curse: 'Curse', binding: 'Binding' };
const MARK_KIND_SHORT = { blessing: 'BLS', curse: 'CRS', binding: 'BND' };
let pendingMarks = [];
function markList(path){
  if(path === 'char') return pendingMarks;
  const it = pendingInventoryItems[parseInt(path.split(':')[1])];
  if(!it) return [];
  if(!Array.isArray(it.marks)) it.marks = [];
  return it.marks;
}
function syncMarksFromDOM(){
  document.querySelectorAll('[data-mark-path]').forEach(el => {
    const m = markList(el.dataset.markPath)[parseInt(el.dataset.markIdx)];
    if(m) m[el.dataset.f] = el.value;
  });
}
function rerenderMarks(path){ if(path === 'char') renderMarksEditor(); else renderInventoryEditor(); }
function addMark(path){
  syncInventoryFromDOM();
  markList(path).push(normalizeMark({ kind: path === 'char' ? 'blessing' : 'curse' }));
  if(path !== 'char'){ const it = pendingInventoryItems[parseInt(path.split(':')[1])]; if(it) invMarksOpen.add(it.id); }
  rerenderMarks(path);
}
function removeMark(path, idx){
  syncInventoryFromDOM();
  markList(path).splice(idx, 1);
  rerenderMarks(path);
}
function markRowsHtml(path, list){
  const a = (i, f) => `data-mark-path="${path}" data-mark-idx="${i}" data-f="${f}"`;
  return list.map((m, i) => `
    <div class="mark-edit kind-${escapeAttr(m.kind)}">
      <div class="mark-edit-top">
        <select ${a(i, 'kind')} aria-label="Kind">${MARK_KINDS.map(k => `<option value="${k}"${m.kind === k ? ' selected' : ''}>${MARK_KIND_LABEL[k]}</option>`).join('')}</select>
        <input type="text" ${a(i, 'name')} value="${escapeAttr(m.name)}" placeholder="Name" aria-label="Name">
      </div>
      <input type="text" ${a(i, 'source')} value="${escapeAttr(m.source)}" placeholder="Source — who or what placed it" aria-label="Source">
      <textarea ${a(i, 'effect')} placeholder="Effect — what it does" aria-label="Effect">${escapeHtml(m.effect)}</textarea>
      <input type="text" ${a(i, 'cost')} value="${escapeAttr(m.cost)}" placeholder="Cost — what it takes (text only)" aria-label="Cost">
      <input type="text" ${a(i, 'ends')} value="${escapeAttr(m.ends)}" placeholder="Ends — how it ends" aria-label="Ends">
      <button type="button" class="btn ghost mark-remove" onclick="removeMark('${path}', ${i})">Remove mark</button>
    </div>`).join('') + `<button type="button" class="btn ghost mark-add" onclick="addMark('${path}')">+ Add mark</button>`;
}
// keeps marks that have any text
function cleanMarks(list){
  return (list || []).map(normalizeMark).filter(m => [m.name, m.source, m.effect, m.cost, m.ends].some(x => String(x).trim()))
    .map(m => ({ ...m, name: m.name.trim(), source: m.source.trim(), effect: m.effect.trim(), cost: m.cost.trim(), ends: m.ends.trim() }));

function triggerInvImageInput(idx, field){
  syncInventoryFromDOM();
  invUploadTarget = { idx, field };
  document.getElementById('invFileInput').click();
}

function handleInventoryFileInput(e){
  const file = e.target.files[0];
  if(!file || !invUploadTarget) return;
  const { idx, field } = invUploadTarget;
  const reader = new FileReader();
  reader.onerror = () => showToast('Could not read that image file — try a different photo.');
  reader.onload = (ev) => {
    const img = new Image();
    img.onerror = () => showToast('That image could not be opened — try a JPEG or PNG instead.');
    img.onload = () => {
      try{
        const maxDim = field === 'icon' ? 200 : 700;
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        if(pendingInventoryItems[idx]){
          pendingInventoryItems[idx][field] = encodeCanvasImage(canvas, 0.85);
        }
        e.target.value = '';
        renderInventoryEditor();
      }catch(err){
        showToast('Could not process that image — try a smaller photo.');
      }
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function reviewSystemSave(charId, snapId){
  const char = state.characters.find(c => c.id === charId);
  const snap = char.snapshots.find(s => s.id === snapId);
  if(!char || !snap) return;

  const stats = {};
  document.querySelectorAll('.statInput').forEach(inp => {
    const v = parseFloat(inp.value);
    stats[inp.dataset.label] = isNaN(v) ? 0 : Math.max(0, Math.min(100, v));
  });
  syncInventoryFromDOM();
  const inventory = pendingInventoryItems
    .filter(it => it.name.trim() || it.desc.trim() || it.icon || it.image || cleanMarks(it.marks).length || (it.boundTo || '').trim())
    .map(it => ({ ...it, name: it.name.trim(), desc: it.desc.trim(), icon: it.icon || '', image: it.image || '', marks: cleanMarks(it.marks), boundTo: (it.boundTo || '').trim() }));
  const skills = document.getElementById('sysSkills').value.split('\n').map(s => s.trim()).filter(Boolean).map(line => {
    const parts = line.split('|').map(p => p.trim());
    const lvl = parseFloat(parts[1]);
    const corrupted = /^(yes|true|1)$/i.test(parts[2] || '');
    return { name: parts[0] || '', level: isNaN(lvl) ? 0 : Math.max(0, Math.min(100, lvl)), corrupted, desc: parts[3] || '', parent: parts[4] || '' };
  });
  const titles = document.getElementById('sysTitles').value.split('\n').map(s => s.trim()).filter(Boolean).map(line => {
    const parts = line.split('|').map(p => p.trim());
    const tier = parseInt(parts[1]);
    return { name: parts[0] || '', rankTier: isNaN(tier) ? 0 : Math.max(0, Math.min(7, tier)), blurb: parts[2] || '' };
  });
  const relationships = parseRelationshipLines(document.getElementById('sysRelationships').value, char.id);
  const emotionalState = document.getElementById('sysEmotional').value.trim();
  const { archetype, ...chapterState } = readChapterStateFields('sys');
  const primordial = document.getElementById('sysPrimordial').checked;
  const knowledgeAndSecrets = readKnowledgeFields('sys');
  const divineStatus = document.getElementById('sysDivineStatus').value;
  const authority = document.getElementById('sysAuthority').value.trim();

  modalContent.innerHTML = `
    <div class="confirm-box">
      <div class="display">Save this system sheet?</div>
      <p>Updates this chapter version of ${escapeHtml(char.name || 'this character')}. Other chapters are not changed, except a god's archetype, which is shared by every chapter. Divine status, God / primordial and authority apply to the whole character.</p>
      <div class="confirm-actions">
        <button class="btn ghost" id="backToSysEdit">Keep editing</button>
        <button class="btn primary" id="confirmSysSave">Save</button>
      </div>
    </div>
  `;

  document.getElementById('confirmSysSave').addEventListener('click', async () => {
    snap.stats = stats;
    snap.inventory = inventory;
    snap.skills = skills;
    snap.titles = titles;
    snap.emotionalState = emotionalState;
    snap.relationships = relationships;
    snap.knowledge = knowledgeAndSecrets.knowledge;
    snap.secrets = knowledgeAndSecrets.secrets;
    Object.assign(snap, chapterState);
    char.divineStatus = divineStatus;
    char.primordial = primordial;
    char.authority = authority;
    setArchetype(char, snap, archetype);
    await persistState();
    renderAll();
    closeModal();
  });
  document.getElementById('backToSysEdit').addEventListener('click', () => openSystemForm(char, snap));
}

// ---- Drag-to-reposition: shared by the poster portrait and avatar modals ----
function wireAdjustDrag(previewEl, imgEl, getPos, setPos){
  let dragging = false, startX = 0, startY = 0, startPos = { x: 50, y: 50 };

  function down(e){
    dragging = true;
    previewEl.classList.add('dragging');
    const pt = e.touches ? e.touches[0] : e;
    startX = pt.clientX; startY = pt.clientY;
    startPos = { ...getPos() };
    e.preventDefault();
  }
  function move(e){
    if(!dragging) return;
    const pt = e.touches ? e.touches[0] : e;
    const rect = previewEl.getBoundingClientRect();
    const dx = pt.clientX - startX;
    const dy = pt.clientY - startY;
    const newX = Math.max(0, Math.min(100, startPos.x - (dx / rect.width) * 100));
    const newY = Math.max(0, Math.min(100, startPos.y - (dy / rect.height) * 100));
    setPos({ x: newX, y: newY });
    imgEl.style.objectPosition = `${newX}% ${newY}%`;
  }
  function up(){
    dragging = false;
    previewEl.classList.remove('dragging');
  }

  previewEl.addEventListener('mousedown', down);
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
  previewEl.addEventListener('touchstart', down, { passive: false });
  window.addEventListener('touchmove', move, { passive: false });
  window.addEventListener('touchend', up);

  return () => {
    window.removeEventListener('mousemove', move);
    window.removeEventListener('mouseup', up);
    window.removeEventListener('touchmove', move);
    window.removeEventListener('touchend', up);
  };
}

      im.onload = () => {

          const maxDim = 900;
          let { width, height } = im;
          if(width > maxDim || height > maxDim){
            const scale = maxDim / Math.max(width, height);
            width = Math.round(width * scale);
            height = Math.round(height * scale);
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(im, 0, 0, width, height);

  document.getElementById('useMainPortraitBtn').addEventListener('click', () => {
    newSystemPortrait = null;
    img.src = snap.portrait || SILHOUETTE_SVG;

    cleanup();
    await persistState();
    renderAll();

  });

function handleFileInput(e){

  reader.onload = (ev) => {
    const img = new Image();
    img.onerror = () => showToast('That image could not be opened — try a JPEG or PNG instead.');
    img.onload = () => {
      try{
        // downscale to keep storage light
        const maxDim = 900;
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        pendingPortrait = encodeCanvasImage(canvas, 0.88);

        const dz = document.getElementById('dropzone');
        dz.innerHTML = `<img id="dzPreview" src="${pendingPortrait}"><span>Click to replace image</span>`;
      }catch(err){
        showToast('Could not process that image — try a smaller photo.');
      }
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ---- Backup: export / import the whole Dossier state ----
// Export writes everything under the 'epitaph-character-profiles' key as-is.
// Import replaces it after a warning; older backups are migrated to the
// current shape on the way in (the file itself is never modified).
document.getElementById('exportBtn').addEventListener('click', () => {
  try{
    const d = new Date();
    const stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `epitaph-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    const n = state.characters.length;
    showToast(`Exported ${n} character${n === 1 ? '' : 's'}.`);
  }catch(e){
    console.error('Export failed', e);
    showToast('Could not export your data. Please try again.', { duration: 5500 });
  }
});

document.getElementById('importFileInput').addEventListener('change', (e) => {
  const input = e.target;
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onerror = () => showToast('Could not read that file. Pick an Epitaph backup (.json).', { duration: 5500 });
  reader.onload = (ev) => {
    let incoming;
    try{
      incoming = JSON.parse(ev.target.result);
    }catch(err){
      showToast('That file is not valid JSON. Pick an Epitaph backup (.json).', { duration: 5500 });
      return;
    }
    if(!incoming || typeof incoming !== 'object' || !Array.isArray(incoming.characters)){
      showToast('That file is not an Epitaph backup: it has no characters list.', { duration: 5500 });
      return;
    }
    const count = incoming.characters.length;
    const current = state.characters.length;
    modalContent.innerHTML = `
      <div class="confirm-box">
        <div class="display">Replace everything with this backup?</div>
        <p>${escapeHtml(file.name)} holds ${count} character${count === 1 ? '' : 's'}. Importing replaces all ${current} character${current === 1 ? '' : 's'} currently saved in this browser, including all their chapters. This can't be undone, so export first if you want to keep what's here.</p>
        <div class="confirm-actions">
          <button class="btn ghost" id="cancelImport">Cancel</button>
          <button class="btn primary" id="confirmImport" style="background:var(--ember);border-color:var(--ember);">Replace and import</button>
        </div>
      </div>
    `;
    openModal();
    document.getElementById('cancelImport').addEventListener('click', closeModal);
    document.getElementById('confirmImport').addEventListener('click', async () => {
      try{
        const characters = incoming.characters.filter(c => c && typeof c === 'object').map(migrateCharacter);
        const activeId = characters.some(c => c.id === incoming.activeId) ? incoming.activeId : (characters[0] ? characters[0].id : null);
        state = migrateState({ ...incoming, characters, activeId });
        await persistState();
        renderAll();
        closeModal();
        showToast(`Imported ${characters.length} character${characters.length === 1 ? '' : 's'}.`);
      }catch(err){
        console.error('Import failed', err);
        closeModal();
        showToast('Import failed. Your existing data was not changed.', { duration: 5500 });
      }
    });
  };
  reader.readAsText(file);
});

  const params = new URLSearchParams(window.location.search);
  const linkedCharId = params.get('char');
  if(linkedCharId && state.characters.find(c => c.id === linkedCharId)){
    state.activeId = linkedCharId;
  } else if(!state.activeId && state.characters.length){
    state.activeId = state.characters[0].id;
  }
  renderAll();
})();

// ============================================================
// STORYBOOK — type "open" anywhere on the page to trigger it
// ============================================================
let openBuffer = '';
document.addEventListener('keydown', (e) => {
  const tag = document.activeElement.tagName;
  if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if(document.getElementById('bookStage').classList.contains('active')) return;
  if(document.getElementById('loadingPopup').classList.contains('visible')) return;
  if(e.key.length === 1){
    openBuffer = (openBuffer + e.key).slice(-10).toLowerCase();
    if(openBuffer.endsWith('open')){
      openBuffer = '';
      startStoryBookSequence();
    }
  }
});

function startStoryBookSequence(){
  const popup = document.getElementById('loadingPopup');
  const fill = document.getElementById('loadingBarFill');
  const pct = document.getElementById('loadingPct');
  fill.style.width = '0%';
  pct.textContent = '0%';
  popup.classList.add('visible');

  let p = 0;
  const iv = setInterval(() => {
    p += Math.random() * 18 + 7;
    if(p >= 100){
      p = 100;
      clearInterval(iv);
      fill.style.width = '100%';
      pct.textContent = '100%';
      setTimeout(() => {
        popup.classList.remove('visible');
        openTheBook();
      }, 400);
      return;
    }
    fill.style.width = p + '%';
    pct.textContent = Math.floor(p) + '%';
  }, 220);
}

function openTheBook(){
  document.getElementById('bookBackdrop').classList.add('active');
  const stage = document.getElementById('bookStage');
  stage.classList.add('active');
  const book = document.getElementById('theBook');
  requestAnimationFrame(() => {
    book.classList.add('dropped');
    setTimeout(() => {
      book.classList.add('open');
      initTerminal();
    }, 900);
  });
}

function closeTheBook(){
  const book = document.getElementById('theBook');
  book.classList.remove('open');
  setTimeout(() => {
    book.classList.remove('dropped');
    setTimeout(() => {
      document.getElementById('bookBackdrop').classList.remove('active');
      document.getElementById('bookStage').classList.remove('active');
    }, 700);
  }, 500);
}

document.getElementById('bookCloseBtn').addEventListener('click', closeTheBook);
document.getElementById('loadingCloseX').addEventListener('click', () => {
  document.getElementById('loadingPopup').classList.remove('visible');
});

function initTerminal(){
  const input = document.getElementById('terminalInput');
  const log = document.getElementById('terminalLog');
  if(!input.dataset.wired){
    input.dataset.wired = 'true';
    log.innerHTML = '<div>Storybook terminal ready. Type "help" for commands.</div>';
    input.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if(e.key === 'Enter'){
        const cmd = input.value.trim();
        if(cmd){
          log.innerHTML += `<div class="term-cmd">&gt; ${escapeHtml(cmd)}</div>`;
          log.innerHTML += `<div>${runStorybookCommand(cmd)}</div>`;
          log.scrollTop = log.scrollHeight;
        }
        input.value = '';
      }
    });
  }
  setTimeout(() => input.focus(), 50);
}

function runStorybookCommand(cmd){
  const lower = cmd.toLowerCase();
  if(lower === 'help') return 'Available commands: help, clear, open lib (opl). More can be added on request.';
  if(lower === 'clear'){
    setTimeout(() => { document.getElementById('terminalLog').innerHTML = ''; }, 0);
    return '';
  }
  if(lower === 'open lib' || lower === 'opl'){
    renderLibraryPage();
    return 'Opening the library...';
  }
  return `Unrecognized command: "${escapeHtml(cmd)}" — tell Claude what this should do.`;
}

// ---- Library page: shows the active chapter's brief as text on the book's left page.
const LEFT_PAGE_DEFAULT_HTML = `
        <h3>Storybook</h3>
        <ul class="book-links">
          <li><a href="epitaph-character-dossier.html">Character Dossier</a></li>
          <li><a href="atlas.html">World Map</a></li>
          <li><a href="epitaph-hub.html">Hub</a></li>
        </ul>
        <p class="book-hint">Placeholder links for now — tell Claude where these should actually point.</p>
      `;

function restoreLeftPage(){
  document.querySelector('.book-page.left-page').innerHTML = LEFT_PAGE_DEFAULT_HTML;
}

function renderLibraryPage(){
  const leftPage = document.querySelector('.book-page.left-page');
  const char = getActiveCharacter();
  if(!char){
    leftPage.innerHTML = `<div class="lib-page-header">No active character.</div><span class="lib-back" id="libBackBtn">← back</span>`;
    document.getElementById('libBackBtn').addEventListener('click', restoreLeftPage);
    return;
  }
  const snap = getActiveSnapshot(char);
  const b = buildBrief(char, snap);
  leftPage.innerHTML = `
    <div class="lib-page-header"><strong>${escapeHtml(char.name || 'Unnamed')}</strong> | ${escapeHtml(snap.chapterRange || 'Untitled chapter')}</div>
    ${b.rows.map(r => `
      <div class="lib-field">
        <div class="lib-field-label">${escapeHtml(r.label)}</div>
        ${r.items ? (r.items.length ? r.items.map(x => `<div class="lib-entry"><span>${escapeHtml(x.text)}</span></div>`).join('') : `<div class="lib-empty">Nothing recorded.</div>`) : `<div class="lib-entry"><span>${escapeHtml(r.text)}</span></div>`}
      </div>
    `).join('')}
    <span class="lib-back" id="libBackBtn">← back to storybook</span>
  `;
  document.getElementById('libBackBtn').addEventListener('click', restoreLeftPage);
}

</script>
