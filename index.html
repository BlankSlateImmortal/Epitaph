// ---- Inventory item editor (icon + name + description + photo, per item) ----
let pendingInventoryItems = [];
let invUploadTarget = null; // { idx, field: 'icon' | 'image' }

function syncInventoryFromDOM(){
  document.querySelectorAll('.inv-edit-row').forEach((row, idx) => {
    if(!pendingInventoryItems[idx]) return;
    const nameInput = row.querySelector('.inv-name-input');
    const descInput = row.querySelector('.inv-desc-input');
    pendingInventoryItems[idx].name = nameInput ? nameInput.value : pendingInventoryItems[idx].name;
    pendingInventoryItems[idx].desc = descInput ? descInput.value : pendingInventoryItems[idx].desc;
  });
}

function renderInventoryEditor(){
  const wrap = document.getElementById('inventoryEditorWrap');
  if(!wrap) return;
  wrap.innerHTML = `
    ${pendingInventoryItems.map((item, idx) => `
      <div class="inv-edit-row" data-idx="${idx}">
        <div class="inv-img-drop" onclick="triggerInvImageInput(${idx}, 'icon')" title="Icon image">
          ${item.icon ? `<img src="${item.icon}">` : `<span>Icon</span>`}
        </div>
        <div class="inv-edit-fields">
          <input type="text" class="inv-name-input" placeholder="Item name" value="${escapeAttr(item.name)}">
          <textarea class="inv-desc-input" placeholder="Description">${escapeHtml(item.desc || '')}</textarea>
        </div>
        <div class="inv-img-drop large" onclick="triggerInvImageInput(${idx}, 'image')" title="Photo">
          ${item.image ? `<img src="${item.image}">` : `<span>Photo</span>`}
        </div>
        <button type="button" class="inv-remove-btn" onclick="removeInventoryItem(${idx})">×</button>
      </div>
    `).join('')}
    <button type="button" class="btn ghost inv-add-btn" id="addInvItemBtn">+ Add item</button>
  `;
  document.getElementById('addInvItemBtn').addEventListener('click', addInventoryItem);
}

function addInventoryItem(){
  syncInventoryFromDOM();
  pendingInventoryItems.push({ id: 'inv_' + Math.random().toString(36).slice(2), name: '', desc: '', icon: '', image: '' });
  renderInventoryEditor();
}

function removeInventoryItem(idx){
  syncInventoryFromDOM();
  pendingInventoryItems.splice(idx, 1);
  renderInventoryEditor();
}

function triggerInvImageInput(idx, field){
  syncInventoryFromDOM();
  invUploadTarget = { idx, field };
  document.getElementById('invFileInput').click();
}

function handleInventoryFileInput(e){
  const file = e.target.files[0];
  if(!file || !invUploadTarget) return;
  const { idx, field } = invUploadTarget;
  const reader = new FileReader();
  reader.onerror = () => showToast('Could not read that image file — try a different photo.');
  reader.onload = (ev) => {
    const img = new Image();
    img.onerror = () => showToast('That image could not be opened — try a JPEG or PNG instead.');
    img.onload = () => {
      try{
        const maxDim = field === 'icon' ? 200 : 700;
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        if(pendingInventoryItems[idx]){
          pendingInventoryItems[idx][field] = canvas.toDataURL('image/jpeg', 0.85);
        }
        e.target.value = '';
        renderInventoryEditor();
      }catch(err){
        showToast('Could not process that image — try a smaller photo.');
      }
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function reviewSystemSave(charId, snapId){
  const char = state.characters.find(c => c.id === charId);
  const snap = char.snapshots.find(s => s.id === snapId);
  if(!char || !snap) return;

  const stats = {};
  document.querySelectorAll('.statInput').forEach(inp => {
    const v = parseFloat(inp.value);
    stats[inp.dataset.label] = isNaN(v) ? 0 : Math.max(0, Math.min(100, v));
  });
  syncInventoryFromDOM();
  const inventory = pendingInventoryItems
    .filter(it => it.name.trim() || it.desc.trim() || it.icon || it.image)
    .map(it => ({ id: it.id, name: it.name.trim(), desc: it.desc.trim(), icon: it.icon || '', image: it.image || '' }));
  const skills = document.getElementById('sysSkills').value.split('\n').map(s => s.trim()).filter(Boolean).map(line => {
    const parts = line.split('|').map(p => p.trim());
    const lvl = parseFloat(parts[1]);
    const corrupted = /^(yes|true|1)$/i.test(parts[2] || '');
    return { name: parts[0] || '', level: isNaN(lvl) ? 0 : Math.max(0, Math.min(100, lvl)), corrupted, desc: parts[3] || '' };
  });
  const titles = document.getElementById('sysTitles').value.split('\n').map(s => s.trim()).filter(Boolean).map(line => {
    const parts = line.split('|').map(p => p.trim());
    const tier = parseInt(parts[1]);
    return { name: parts[0] || '', rankTier: isNaN(tier) ? 0 : Math.max(0, Math.min(7, tier)), blurb: parts[2] || '' };
  });
  const relationships = document.getElementById('sysRelationships').value.split('\n').map(s => s.trim()).filter(Boolean).map(line => {
    const parts = line.split('|').map(p => p.trim());
    return { name: parts[0] || '', relation: parts[1] || '', note: parts[2] || '' };
  });
  const mythos = document.getElementById('sysMythos').value;
  const emotionalState = document.getElementById('sysEmotional').value.trim();
  const storyArc = readArcFields('sys');
  const knowledgeAndSecrets = readKnowledgeFields('sys');
  const divineStatus = document.getElementById('sysDivineStatus').value;
  const authority = document.getElementById('sysAuthority').value.trim();

  modalContent.innerHTML = `
    <div class="confirm-box">
      <div class="display">Save this system sheet?</div>
      <p>Updates stats, inventory, skills, and titles for this chapter version, plus mythos, relationships, story arc, and knowledge &amp; secrets for ${escapeHtml(char.name || 'this character')} overall.</p>
      <div class="confirm-actions">
        <button class="btn ghost" id="backToSysEdit">Keep editing</button>
        <button class="btn primary" id="confirmSysSave">Save</button>
      </div>
    </div>
  `;

  document.getElementById('confirmSysSave').addEventListener('click', async () => {
    snap.stats = stats;
    snap.inventory = inventory;
    snap.skills = skills;
    snap.titles = titles;
    snap.emotionalState = emotionalState;
    char.mythos = mythos;
    char.relationships = relationships;
    char.storyArc = storyArc;
    char.knowledge = knowledgeAndSecrets.knowledge;
    char.secrets = knowledgeAndSecrets.secrets;
    char.divineStatus = divineStatus;
    char.authority = authority;
    await persistState();
    renderAll();
    closeModal();
  });
  document.getElementById('backToSysEdit').addEventListener('click', () => openSystemForm(char, snap));
}

// ---- Drag-to-reposition: shared by the poster portrait and avatar modals ----
function wireAdjustDrag(previewEl, imgEl, getPos, setPos){
  let dragging = false, startX = 0, startY = 0, startPos = { x: 50, y: 50 };

  function down(e){
    dragging = true;
    previewEl.classList.add('dragging');
    const pt = e.touches ? e.touches[0] : e;
    startX = pt.clientX; startY = pt.clientY;
    startPos = { ...getPos() };
    e.preventDefault();
  }
  function move(e){
    if(!dragging) return;
    const pt = e.touches ? e.touches[0] : e;
    const rect = previewEl.getBoundingClientRect();
    const dx = pt.clientX - startX;
    const dy = pt.clientY - startY;
    const newX = Math.max(0, Math.min(100, startPos.x - (dx / rect.width) * 100));
    const newY = Math.max(0, Math.min(100, startPos.y - (dy / rect.height) * 100));
    setPos({ x: newX, y: newY });
    imgEl.style.objectPosition = `${newX}% ${newY}%`;
  }
  function up(){
    dragging = false;
    previewEl.classList.remove('dragging');
  }

  previewEl.addEventListener('mousedown', down);
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
  previewEl.addEventListener('touchstart', down, { passive: false });
  window.addEventListener('touchmove', move, { passive: false });
  window.addEventListener('touchend', up);

  return () => {
    window.removeEventListener('mousemove', move);
    window.removeEventListener('mouseup', up);
    window.removeEventListener('touchmove', move);
    window.removeEventListener('touchend', up);
  };
}

// ---- Avatar (system section): optional separate image + its own position ----
function openAvatarImageModal(char, snap){
  let pos = { ...(snap.systemPortraitPosition || { x: 50, y: 50 }) };
  let newSystemPortrait = snap.systemPortrait || null; // null = "use main portrait"
  const startSrc = snap.systemPortrait || snap.portrait || SILHOUETTE_SVG;

  modalContent.innerHTML = `
    <h2>System picture</h2>
    <p class="sub">Optional — upload a different image for this section, or leave it using the main portrait. Drag to adjust framing.</p>
    <div class="field">
      <label class="dropzone" id="avatarDropzone" for="avatarFileInput"><span>Click to upload a different image</span></label>
      <input type="file" id="avatarFileInput" accept="image/*" class="visually-hidden-input">
    </div>
    <div class="adjust-preview rect" id="adjustPreview">
      <img id="adjustImg" src="${startSrc}" style="object-position:${pos.x}% ${pos.y}%;">
    </div>
    <p class="adjust-hint">Click and drag inside the frame</p>
    <div class="modal-actions">
      <button class="btn ghost" id="useMainPortraitBtn">Use main portrait instead</button>
      <button class="btn primary" id="saveAvatarImgBtn">Save</button>
    </div>
    <div class="modal-actions" style="border-top:none; margin-top:8px; padding-top:0; justify-content:flex-end;">
      <button class="btn ghost" id="cancelAvatarImgBtn">Cancel</button>
    </div>
  `;

  const preview = document.getElementById('adjustPreview');
  const img = document.getElementById('adjustImg');
  const cleanup = wireAdjustDrag(preview, img, () => pos, (p) => { pos = p; });

  document.getElementById('avatarFileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onerror = () => showToast('Could not read that image file — try a different photo.');
    reader.onload = (ev) => {
      const im = new Image();
      im.onerror = () => showToast('That image could not be opened — try a JPEG or PNG instead.');
      im.onload = () => {
        try{
          const maxDim = 900;
          let { width, height } = im;
          if(width > maxDim || height > maxDim){
            const scale = maxDim / Math.max(width, height);
            width = Math.round(width * scale);
            height = Math.round(height * scale);
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(im, 0, 0, width, height);
          newSystemPortrait = canvas.toDataURL('image/jpeg', 0.88);
          img.src = newSystemPortrait;
        }catch(err){
          showToast('Could not process that image — try a smaller photo.');
        }
      };
      im.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('useMainPortraitBtn').addEventListener('click', () => {
    newSystemPortrait = null;
    img.src = snap.portrait || SILHOUETTE_SVG;
  });

  document.getElementById('saveAvatarImgBtn').addEventListener('click', async () => {
    snap.systemPortrait = newSystemPortrait || '';
    snap.systemPortraitPosition = pos;
    cleanup();
    await persistState();
    renderAll();
    closeModal();
  });
  document.getElementById('cancelAvatarImgBtn').addEventListener('click', () => { cleanup(); closeModal(); });
  openModal();
}

function handleFileInput(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onerror = () => showToast('Could not read that image file — try a different photo.');
  reader.onload = (ev) => {
    const img = new Image();
    img.onerror = () => showToast('That image could not be opened — try a JPEG or PNG instead.');
    img.onload = () => {
      try{
        // downscale to keep storage light
        const maxDim = 900;
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        pendingPortrait = canvas.toDataURL('image/jpeg', 0.88);

        const dz = document.getElementById('dropzone');
        dz.innerHTML = `<img id="dzPreview" src="${pendingPortrait}"><span>Click to replace image</span>`;
      }catch(err){
        showToast('Could not process that image — try a smaller photo.');
      }
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ============================================================
// STORYBOOK — type "open" anywhere on the page to trigger it
// ============================================================
let openBuffer = '';
document.addEventListener('keydown', (e) => {
  const tag = document.activeElement.tagName;
  if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if(document.getElementById('bookStage').classList.contains('active')) return;
  if(document.getElementById('loadingPopup').classList.contains('visible')) return;
  if(e.key.length === 1){
    openBuffer = (openBuffer + e.key).slice(-10).toLowerCase();
    if(openBuffer.endsWith('open')){
      openBuffer = '';
      startStoryBookSequence();
    }
  }
});

function startStoryBookSequence(){
  const popup = document.getElementById('loadingPopup');
  const fill = document.getElementById('loadingBarFill');
  const pct = document.getElementById('loadingPct');
  fill.style.width = '0%';
  pct.textContent = '0%';
  popup.classList.add('visible');

  let p = 0;
  const iv = setInterval(() => {
    p += Math.random() * 18 + 7;
    if(p >= 100){
      p = 100;
      clearInterval(iv);
      fill.style.width = '100%';
      pct.textContent = '100%';
      setTimeout(() => {
        popup.classList.remove('visible');
        openTheBook();
      }, 400);
      return;
    }
    fill.style.width = p + '%';
    pct.textContent = Math.floor(p) + '%';
  }, 220);
}

function openTheBook(){
  document.getElementById('bookBackdrop').classList.add('active');
  const stage = document.getElementById('bookStage');
  stage.classList.add('active');
  const book = document.getElementById('theBook');
  requestAnimationFrame(() => {
    book.classList.add('dropped');
    setTimeout(() => {
      book.classList.add('open');
      initTerminal();
    }, 900);
  });
}

function closeTheBook(){
  const book = document.getElementById('theBook');
  book.classList.remove('open');
  setTimeout(() => {
    book.classList.remove('dropped');
    setTimeout(() => {
      document.getElementById('bookBackdrop').classList.remove('active');
      document.getElementById('bookStage').classList.remove('active');
    }, 700);
  }, 500);
}

document.getElementById('bookCloseBtn').addEventListener('click', closeTheBook);
document.getElementById('loadingCloseX').addEventListener('click', () => {
  document.getElementById('loadingPopup').classList.remove('visible');
});

function initTerminal(){
  const input = document.getElementById('terminalInput');
  const log = document.getElementById('terminalLog');
  if(!input.dataset.wired){
    input.dataset.wired = 'true';
    log.innerHTML = '<div>Storybook terminal ready. Type "help" for commands.</div>';
    input.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if(e.key === 'Enter'){
        const cmd = input.value.trim();
        if(cmd){
          log.innerHTML += `<div class="term-cmd">&gt; ${escapeHtml(cmd)}</div>`;
          log.innerHTML += `<div>${runStorybookCommand(cmd)}</div>`;
          log.scrollTop = log.scrollHeight;
        }
        input.value = '';
      }
    });
  }
  setTimeout(() => input.focus(), 50);
}

function runStorybookCommand(cmd){
  const lower = cmd.toLowerCase();
  if(lower === 'help') return 'Available commands: help, clear, open lib (opl). More can be added on request.';
  if(lower === 'clear'){
    setTimeout(() => { document.getElementById('terminalLog').innerHTML = ''; }, 0);
    return '';
  }
  if(lower === 'open lib' || lower === 'opl'){
    renderLibraryPage();
    return 'Opening the library...';
  }
  return `Unrecognized command: "${escapeHtml(cmd)}" — tell Claude what this should do.`;
}

// ---- Library page: shows the active character's Generation timeline data
// (from generationStates) as text on the book's left page. Each entry can be
// deleted directly from here, regardless of whether its chapter is committed.
const LEFT_PAGE_DEFAULT_HTML = `
        <h3>Storybook</h3>
        <ul class="book-links">
          <li><a href="index.html">Character Dossier</a></li>
          <li><a href="atlas.html">World Map</a></li>
          <li><a href="epitaph-hub.html">Hub</a></li>
        </ul>
        <p class="book-hint">Placeholder links for now — tell Claude where these should actually point.</p>
      `;

function restoreLeftPage(){
  document.querySelector('.book-page.left-page').innerHTML = LEFT_PAGE_DEFAULT_HTML;
}

function renderLibraryPage(){
  const leftPage = document.querySelector('.book-page.left-page');
  const char = getActiveCharacter();
  if(!char){
    leftPage.innerHTML = `<div class="lib-page-header">No active character.</div><span class="lib-back" id="libBackBtn">← back</span>`;
    document.getElementById('libBackBtn').addEventListener('click', restoreLeftPage);
    return;
  }
  const snap = getActiveSnapshot(char);
  const gs = findGenState(char.id, snap.id);
  const timeline = gs ? gs.timeline : emptyTimeline();

  leftPage.innerHTML = `
    <div class="lib-page-header"><strong>${escapeHtml(char.name || 'Unnamed')}</strong> | ${escapeHtml(snap.chapterRange || 'Untitled chapter')}</div>
    ${TIMELINE_FIELDS.map(f => `
      <div class="lib-field">
        <div class="lib-field-label">${escapeHtml(f.label)}</div>
        ${(timeline[f.key] && timeline[f.key].length) ? timeline[f.key].map(e => `
          <div class="lib-entry">
            <span>${escapeHtml(e.text)}${e.status !== 'committed' ? `<span class="lib-entry-meta">(${escapeHtml(e.status)})</span>` : ''}</span>
            <button class="lib-del" data-field="${f.key}" data-id="${e.id}" title="Delete">×</button>
          </div>
        `).join('') : `<div class="lib-empty">Nothing recorded.</div>`}
      </div>
    `).join('')}
    <span class="lib-back" id="libBackBtn">← back to storybook</span>
  `;

  leftPage.querySelectorAll('.lib-del').forEach(btn => {
    btn.addEventListener('click', async () => {
      const { field, id } = btn.dataset;
      if(gs){
        gs.timeline[field] = gs.timeline[field].filter(e => e.id !== id);
        await persistState();
      }
      renderLibraryPage();
      renderGenerationSection();
    });
  });
  document.getElementById('libBackBtn').addEventListener('click', restoreLeftPage);
}
