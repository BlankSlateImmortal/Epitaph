            <div class="expand-hint">CLICK TO EXPAND</div>
          </div>
          <div class="tb-portrait-label">${isDivine ? 'STATUE' : 'PORTRAIT'}</div>
          ${renderCornerMarks()}
          <button class="reposition-btn avatar-edit-btn" id="editAvatarImageBtn" title="Change or reposition this picture">⤡</button>
        </div>
        <div class="tb-identity">
          <div class="tb-name display">${escapeHtml(char.name || 'Unnamed')}</div>
          ${sortedTitles.length ? `<div class="titles-row">${sortedTitles.map((t, idx) => renderTitleChip(t, char.mythos, idx)).join('')}</div>` : ''}
          <div class="tb-strip inline">
            ${isDivine ? `<div class="tb-field"><span class="tb-field-label">AUTHORITY</span><span class="tb-field-value${char.authority ? '' : ' empty'}">${char.authority ? escapeHtml(char.authority) : 'Unrecorded'}</span></div>` : ''}
            <div class="tb-field"><span class="tb-field-label">EMOTIONAL STATE</span><span class="tb-field-value${snap.emotionalState ? '' : ' empty'}">${snap.emotionalState ? escapeHtml(snap.emotionalState) : 'Unrecorded'}</span></div>
            <div class="tb-field"><span class="tb-field-label">FACTION</span><span class="tb-field-value${char.faction ? '' : ' empty'}">${char.faction ? escapeHtml(char.faction) : 'Unassigned'}</span></div>
          </div>
          ${isDivine ? `<div class="tb-divine-marks">${divineStatuses.map(ds => `<span class="tb-divine-mark${char.divineStatus === ds ? ' active' : ''}">[${char.divineStatus === ds ? '●' : '○'} ${ds.toUpperCase()}]</span>`).join('')}</div>` : ''}
          <button class="slant-btn" id="mwOpenIdentity" type="button">Edit identity</button>
        </div>
      </div>
    </div>

    <div class="codex">
      <div class="codex-tabs" role="tablist" aria-label="System sheet pages">
        <div class="menu-slant">
          ${CODEX_TABS.map(([k, l]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${sysTab === k}" class="${sysTab === k ? 'on' : ''}">${l}</button>`).join('')}
        </div>
        <button class="slant-btn primary" id="editSystemBtn" type="button">Edit whole sheet</button>
      </div>
      <div class="codex-page" id="codexPage" role="tabpanel"></div>
    </div>
  `;

  document.getElementById('avatarWrap').addEventListener('click', () => document.getElementById('avatarWrap').classList.toggle('expanded'));
  document.getElementById('editAvatarImageBtn').addEventListener('click', (e) => { e.stopPropagation(); openAvatarImageModal(char, snap); });
  document.getElementById('editSystemBtn').addEventListener('click', () => openSystemForm(char, snap));
  document.getElementById('mwOpenIdentity').addEventListener('click', () => openIdentityForm(char, snap));
  container.querySelectorAll('.codex-tabs [data-tab]').forEach(b => b.addEventListener('click', () => {
    if(sysTab === b.dataset.tab) return;
    sysTab = b.dataset.tab;
    container.querySelectorAll('.codex-tabs [data-tab]').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-selected', x === b); });
    renderCodexPage(char, snap, true);
  }));
  if(sortedTitles.some(t => t.rankTier > 0)) wireTitleChipTooltips(sortedTitles, char.mythos);
  renderCodexPage(char, snap, false);
}

function codexLeft(n, eyebrow, big, meta, editId, editLabel){
  return `<div class="codex-left">
    <span class="codex-eyebrow">Page ${String(n).padStart(2, '0')} · ${escapeHtml(eyebrow)}</span>
    <p class="codex-big">${escapeHtml(big)}</p>
    ${meta ? `<p class="codex-meta">${meta}</p>` : ''}
    ${editId ? `<button class="slant-btn" type="button" id="${editId}">${escapeHtml(editLabel || 'Edit')}</button>` : ''}
  </div>`;
}

function renderCodexPage(char, snap, animate){
  const page = document.getElementById('codexPage');
  if(!page) return;
  const n = CODEX_TABS.findIndex(t => t[0] === sysTab) + 1;
  let html = '';
  if(sysTab === 'stats'){
    const r = 44, c = 2 * Math.PI * r;
    const ranked = (snap.titles || []).slice().sort((a, b) => (b.rankTier || 0) - (a.rankTier || 0))[0];
    html = codexLeft(n, 'Stats', char.name || 'Unnamed',
      `${escapeHtml([char.storyline, char.mythos, char.authority ? 'Concept: ' + char.authority : ''].filter(Boolean).join(' · ') || 'No identity recorded')}${ranked ? `<br><span class="crt">&gt; Rank: ${escapeHtml(ranked.name)}${ranked.rankTier ? ' (' + escapeHtml(rankLabel(char.mythos, ranked.rankTier)) + ')' : ''}</span>` : ''}`,
      'mwOpenStats', 'Edit stats') +
      `<div class="codex-right"><div class="gauges">${STAT_LABELS.map(label => {
        const v = Math.max(0, Math.min(100, Number((snap.stats || {})[label]) || 0));
        const hot = label === 'Corruption';
        return `<div class="gauge"><svg viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--amber-dim)" stroke-width="6" stroke-dasharray="3 3"/>
          <circle class="g-arc" cx="60" cy="60" r="${r}" fill="none" stroke="${hot ? 'var(--ember)' : 'var(--amber)'}" stroke-width="6" stroke-dasharray="${(c * v / 100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 60 60)"/>
          <text x="60" y="66" text-anchor="middle" class="g-val">${v}</text>
          <text x="60" y="84" text-anchor="middle" class="g-lv">LV${levelInfo(v).lvl}</text>
        </svg><span>${escapeHtml(label.toUpperCase())}</span></div>`;
      }).join('')}</div></div>`;
  } else if(sysTab === 'skills'){
    html = codexLeft(n, 'Skills', char.authority || 'Authorities',
      snap.skills.length ? `${snap.skills.length} skill${snap.skills.length === 1 ? '' : 's'} · use ← → to move along a branch, ↑ ↓ for siblings` : 'No skills recorded yet.',
      'mwOpenSkills', 'Edit skills') +
      `<div class="codex-right">${snap.skills.length ? `<div class="atree" id="atree" tabindex="0" aria-label="Authority tree. Arrow keys move between skills."></div><div class="atree-detail" id="atreeDetail" aria-live="polite"></div>` : `<div class="sys-empty">Add skills with “Edit skills”. Give a skill a fifth column naming the skill it branches from to grow the tree.</div>`}</div>`;
  } else if(sysTab === 'inventory'){
    const items = snap.inventory || [];
    const slots = Math.max(8, Math.ceil((items.length + 1) / 4) * 4);
    const sel = items.find(i => i.id === invFocus[char.id]) || items[0];
    html = codexLeft(n, 'Inventory', 'Carried', `${items.length} item${items.length === 1 ? '' : 's'} · this chapter version`, 'mwOpenInventory', 'Edit inventory') +
      `<div class="codex-right"><div class="inv-grid">${Array.from({ length: slots }, (_, i) => {
        const it = items[i];
        if(!it) return `<div class="inv-slot empty" aria-hidden="true"></div>`;
        return `<button type="button" class="inv-slot${sel && sel.id === it.id ? ' on' : ''}" data-inv="${escapeAttr(it.id)}">
          ${it.icon ? `<img src="${it.icon}" alt="">` : (it.image ? `<img src="${it.image}" alt="">` : `<b>◈</b>`)}
          <span>${escapeHtml(it.name || 'Untitled')}</span></button>`;
      }).join('')}</div>
      ${sel ? `<div class="inv-detail">${sel.image ? `<img src="${sel.image}" alt="">` : ''}<div><h4>${escapeHtml(sel.name || 'Untitled item')}</h4><p>${sel.desc ? escapeHtml(sel.desc) : '<span class="dim">No description.</span>'}</p></div></div>` : ''}</div>`;
  } else if(sysTab === 'ties'){
    const inferred = inferredRelationships(char);
    const row = (target, name, rel, note, tag) => {
      const img = target
        ? (target.snapshots && getActiveSnapshot(target).portrait ? `<img src="${getActiveSnapshot(target).portrait}" alt="">` : `<img src="${SILHOUETTE_SVG}" data-gen-char="${escapeAttr(target.id)}" alt="">`)
        : `<img src="${SILHOUETTE_SVG}" alt="" class="unknown">`;
      return `<div class="tie">${img}<div><div class="tie-name">${target ? `<button type="button" class="rel-link" data-char-id="${escapeAttr(target.id)}">${escapeHtml(name)}</button>` : escapeHtml(name)}${tag ? `<span class="rel-inferred-mark">${tag}</span>` : ''}</div><div class="tie-rel">${escapeHtml(rel || '')}${note ? ' · ' + escapeHtml(note) : ''}</div></div></div>`;
    };
    html = codexLeft(n, 'Ties', 'Bonds', `${char.relationships.length} recorded${inferred.length ? ` · ${inferred.length} inferred from other files` : ''}`, 'mwOpenRelationships', 'Edit ties') +
      `<div class="codex-right">${char.relationships.length || inferred.length
        ? char.relationships.map(r => row(findCharacterById(r.charId), relationshipDisplayName(r), r.relation, r.note)).join('') +
          inferred.map(r => row(findCharacterById(r.charId), r.name, r.relation ? 'Lists you as: ' + r.relation : 'Lists you as a relationship', r.note, 'inferred')).join('')
        : `<div class="sys-empty">No relationships recorded yet.</div>`}</div>`;
  } else if(sysTab === 'arc'){
    const sa = char.storyArc;
    const lines = [];
    if(sa.currentObjective) lines.push(['OBJECTIVE', sa.currentObjective]);
    if(sa.currentArc) lines.push(['ARC', sa.currentArc, 'dim']);
    if(sa.currentDevelopment) lines.push(['DEVELOPMENT', sa.currentDevelopment]);
    sa.majorTurningPoints.forEach((t, i) => lines.push(['TURNING POINT ' + String(i + 1).padStart(2, '0'), t, 'dim']));
    sa.completedDevelopments.forEach(t => lines.push(['DONE', t, 'done']));
    if(sa.direction) lines.push(['DIRECTION', sa.direction]);
    html = codexLeft(n, 'Arc', snap.chapterRange || 'Story arc', 'Where this character is heading.', 'mwOpenArc', 'Edit arc') +
      `<div class="codex-right crt-log">${lines.length ? lines.map(([k, v, c]) => `<p class="${c || ''}">&gt; ${k}: ${escapeHtml(v)}</p>`).join('') : `<p class="dim">&gt; nothing drafted yet</p>`}</div>`;
  } else if(sysTab === 'knowledge'){
    html = codexLeft(n, 'Knowledge', 'Known', `${char.knowledge.length} known · ${char.secrets.length} secret${char.secrets.length === 1 ? '' : 's'}`, 'mwOpenKnowledge', 'Edit knowledge') +
      `<div class="codex-right crt-log">
        ${char.knowledge.length ? char.knowledge.map(k => `<p>&gt; ${escapeHtml(k)}</p>`).join('') : `<p class="dim">&gt; nothing known yet</p>`}
        <p class="sep">— SECRETS —</p>
        ${char.secrets.length ? char.secrets.map(sc => `<p class="${sc.characterKnows ? '' : 'dim'}">&gt; ${escapeHtml(sc.text)}<br><small>character knows: ${sc.characterKnows ? 'yes' : 'no'} · known by: ${escapeHtml(sc.knownBy || '—')}</small></p>`).join('') : `<p class="dim">&gt; no secrets recorded</p>`}
      </div>`;
  }
  page.innerHTML = html;

  const on = (id, fn) => { const el = document.getElementById(id); if(el) el.addEventListener('click', fn); };
  on('mwOpenStats', () => openStatsOnlyForm(char, snap));
  on('mwOpenSkills', () => openSkillsOnlyForm(char, snap));
  on('mwOpenInventory', () => openInventoryOnlyForm(char, snap));
  on('mwOpenRelationships', () => openRelationshipsOnlyForm(char));
  on('mwOpenArc', () => openArcOnlyForm(char));
  on('mwOpenKnowledge', () => openKnowledgeOnlyForm(char));
  page.querySelectorAll('.rel-link').forEach(btn => btn.addEventListener('click', () => {
    if(findCharacterById(btn.dataset.charId)){ switchActiveCharacter(btn.dataset.charId); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  }));
  page.querySelectorAll('[data-inv]').forEach(b => b.addEventListener('click', () => { invFocus[char.id] = b.dataset.inv; renderCodexPage(char, snap, false); }));
  hydrateGenPortraits(page);
  if(sysTab === 'skills' && snap.skills.length) renderAuthorityTree(char, snap, animate);

  if(HAS_GSAP && !REDUCED_MOTION && animate){
    gsap.fromTo(page.children, { x: 30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, stagger: 0.08, ease: 'power3.out' });
  }
  if(HAS_GSAP && !REDUCED_MOTION && sysTab === 'stats'){
    gsap.fromTo(page.querySelectorAll('.g-arc'), { strokeDashoffset: 300 }, { strokeDashoffset: 0, duration: 1, ease: 'power2.out', stagger: 0.06 });
  }
}

// ---- Authority tree: a navigable constellation, one node in focus at a time ----
// Skills can name a parent skill (5th column in the skills editor); anything
// without a parent branches from the character's Concept / Authority.
function buildSkillTree(char, snap){
  const nodes = { root: { key: 'root', name: char.authority || 'Concept', level: 100, root: true, children: [], parent: null } };
  snap.skills.forEach((sk, i) => { nodes['s' + i] = { key: 's' + i, name: sk.name || 'Unnamed skill', level: sk.level || 0, desc: sk.desc || '', corrupted: !!sk.corrupted, parentName: sk.parent || '', children: [], parent: null }; });
  const byName = {};
  Object.values(nodes).forEach(nd => { if(!nd.root) byName[nd.name.toLowerCase()] = nd; });
  Object.values(nodes).forEach(nd => {
    if(nd.root) return;
    let par = nd.parentName ? byName[nd.parentName.toLowerCase()] : null;
    // guard against loops (a skill can't descend from itself)
    let walk = par; while(walk){ if(walk === nd){ par = null; break; } walk = walk.parentName ? byName[walk.parentName.toLowerCase()] : null; }
    nd.parent = par ? par.key : 'root';
    nodes[nd.parent].children.push(nd.key);
  });
  return nodes;
}
let atreeLoop = null;
function renderAuthorityTree(char, snap, animate){
  const host = document.getElementById('atree'), detail = document.getElementById('atreeDetail');
  if(!host) return;
  const nodes = buildSkillTree(char, snap);
  let focus = nodes[skillFocus[char.id]] ? skillFocus[char.id] : (nodes.root.children[0] || 'root');
  const corrColor = char.corruptionColor || DEFAULT_CORRUPTION_COLOR;
  const W = 640, H = 330, CX = 320, CY = 165;

  function layout(fk){
    const f = nodes[fk], pos = {};
    pos[fk] = { x: CX, y: CY, r: 34, role: 'focus' };
    if(f.parent){ pos[f.parent] = { x: 96, y: CY, r: 20, role: 'parent' };
      // only the neighbours that the up / down keys go to, so labels never pile up
      const all = nodes[f.parent].children, at = all.indexOf(fk);
      if(all.length > 1){
        const prev = all[(at - 1 + all.length) % all.length], next = all[(at + 1) % all.length];
        pos[prev] = { x: 210, y: CY - 112, r: 13, role: 'sibling' };
        if(next !== prev) pos[next] = { x: 210, y: CY + 104, r: 13, role: 'sibling' };
      }
    }
    const kids = f.children.slice(0, 5);
    kids.forEach((k, i) => { const spread = kids.length === 1 ? 0 : (i / (kids.length - 1) - 0.5) * 220; pos[k] = { x: 520, y: CY + spread, r: 18, role: 'child' }; });
    return pos;
  }
  function draw(){
    const f = nodes[focus], pos = layout(focus);
    const color = nd => nd.corrupted ? corrColor : 'var(--amber)';
    let links = '', marks = '';
    Object.entries(pos).forEach(([k, p]) => {
      if(k === focus) return;
      const nd = nodes[k], from = p.role === 'child' ? pos[focus] : (p.role === 'parent' ? pos[focus] : pos[f.parent]);
      if(from) links += `<path class="atree-link ${p.role}" d="M${from.x} ${from.y} C${(from.x + p.x) / 2} ${from.y} ${(from.x + p.x) / 2} ${p.y} ${p.x} ${p.y}" stroke="${color(nd)}"/>`;
    });
    Object.entries(pos).forEach(([k, p]) => {
      const nd = nodes[k], circ = 2 * Math.PI * (p.r + 6), done = circ * Math.min(100, nd.level) / 100;
      const label = nd.name.length > 22 ? nd.name.slice(0, 21) + '…' : nd.name;
      marks += `<g transform="translate(${p.x} ${p.y})"><g class="atree-node ${p.role}${nd.root ? ' root' : ''}${nd.corrupted ? ' corrupt' : ''}" data-key="${k}">
        ${p.role === 'focus' ? `<circle class="atree-halo" r="${p.r + 22}"/><g class="atree-orbit">${[0, 1, 2].map(i => `<circle r="2.4" cx="${(p.r + 14) * Math.cos(i * 2.094)}" cy="${(p.r + 14) * Math.sin(i * 2.094)}"/>`).join('')}</g>` : ''}
        <circle class="atree-track" r="${p.r + 6}"/>
        ${nd.root ? '' : `<circle class="atree-prog" r="${p.r + 6}" stroke="${color(nd)}" stroke-dasharray="${done.toFixed(1)} ${circ.toFixed(1)}" transform="rotate(-90)"/>`}
        <circle class="atree-core" r="${p.r}" ${nd.root ? '' : `stroke="${color(nd)}"`}/>
        ${p.role === 'focus' ? `<text class="atree-lv" y="6" text-anchor="middle">${nd.root ? '◆' : 'LV' + levelInfo(nd.level).lvl}</text>` : ''}
        <text class="atree-label" y="${p.r + (p.role === 'focus' ? 30 : 22)}" text-anchor="middle">${escapeHtml(label.toUpperCase())}</text>
      </g></g>`;
    });
    const stars = Array.from({ length: 46 }, (_, i) => `<circle cx="${(i * 137) % W}" cy="${(i * 71) % H}" r="${i % 9 === 0 ? 1.3 : 0.6}" opacity="${0.12 + (i % 5) * 0.07}"/>`).join('');
    const crumbs = []; let w = f; while(w){ crumbs.unshift(w); w = w.parent ? nodes[w.parent] : null; }
    host.innerHTML = `
      <svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><g class="atree-stars">${stars}</g>${links}${marks}</svg>
      <div class="atree-crumbs">${crumbs.map(c => `<button type="button" data-key="${c.key}" class="${c.key === focus ? 'on' : ''}">${escapeHtml(c.name.toUpperCase())}</button>`).join('<span>›</span>')}</div>
      <div class="atree-nav">
        <button type="button" data-go="parent" ${f.parent ? '' : 'disabled'} aria-label="Back to parent">← BACK</button>
        <button type="button" data-go="prev" aria-label="Previous sibling">↑</button>
        <button type="button" data-go="next" aria-label="Next sibling">↓</button>
        <button type="button" data-go="child" ${f.children.length ? '' : 'disabled'} aria-label="Into first branch">BRANCH →</button>
      </div>`;
    // description, S1 console style
    const lvl = levelInfo(f.level);
    detail.innerHTML = f.root
      ? `<div class="sig-bar"><span>CONCEPT · ${escapeHtml(f.name.toUpperCase())}</span><span class="dim">${f.children.length} BRANCH${f.children.length === 1 ? '' : 'ES'}</span></div><p class="crt">&gt; every skill grows from here. pick a branch →</p>`
      : `<div class="sig-bar"><span>${escapeHtml(f.name.toUpperCase())}</span><span class="dim">${f.corrupted ? 'CORRUPTED · ' : ''}LV${lvl.lvl} · ${Math.round(f.level)}/100</span></div>
         <i class="seg${f.corrupted ? ' hot' : ''}" style="width:${Math.min(100, f.level)}%"></i>
         <p>${f.desc ? escapeHtml(f.desc) : '<span class="dim">No description yet.</span>'}</p>
         <p class="crt dim">&gt; branches from ${escapeHtml(nodes[f.parent].name)}${f.children.length ? ` · leads to ${f.children.map(k => escapeHtml(nodes[k].name)).join(', ')}` : ''}</p>`;
    host.querySelectorAll('.atree-node:not(.focus), .atree-crumbs button').forEach(el => el.addEventListener('click', () => go(el.dataset.key)));
    host.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => step(b.dataset.go)));
    animateTree();
  }
  function step(dir){
    const f = nodes[focus];
    if(dir === 'parent' && f.parent) go(f.parent, 'left');
    else if(dir === 'child' && f.children.length) go(f.children[0], 'right');
    else if((dir === 'prev' || dir === 'next') && f.parent){
      const sib = nodes[f.parent].children, i = sib.indexOf(focus);
      go(sib[(i + (dir === 'next' ? 1 : -1) + sib.length) % sib.length], dir === 'next' ? 'down' : 'up');
    }
  }
  function go(key, from){
    if(!nodes[key] || key === focus) return;
    const prev = nodes[focus];
    from = from || (nodes[key].parent === focus ? 'right' : (prev.parent === key ? 'left' : 'down'));
    focus = key; skillFocus[char.id] = key; lastFrom = from; draw();
  }
  let lastFrom = animate ? 'fade' : null;
  function animateTree(){
    if(atreeLoop){ atreeLoop.forEach(t => t.kill()); atreeLoop = null; }
    if(!HAS_GSAP || REDUCED_MOTION) return;
    const svg = host.querySelector('svg');
    const dx = { right: 120, left: -120 }[lastFrom] || 0, dy = { down: 60, up: -60 }[lastFrom] || 0;
    if(lastFrom){
      gsap.fromTo(svg.querySelectorAll('.atree-node'), { opacity: 0, x: (i, el) => (el.classList.contains('focus') ? dx : dx * 0.5), y: dy }, { opacity: 1, x: 0, y: 0, duration: 0.55, ease: 'power3.out', stagger: 0.03 });
      gsap.fromTo(svg.querySelectorAll('.atree-link'), { strokeDashoffset: 260 }, { strokeDashoffset: 0, duration: 0.8, ease: 'power2.out' });
      gsap.fromTo(svg.querySelector('.focus .atree-prog'), { strokeDashoffset: 260 }, { strokeDashoffset: 0, duration: 1, ease: 'power2.out' });
      gsap.fromTo(detail.children, { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.4, stagger: 0.05 });
    }
    atreeLoop = [
      gsap.to(svg.querySelector('.atree-orbit'), { rotation: 360, svgOrigin: '0 0', duration: 6, ease: 'none', repeat: -1 }),
      gsap.fromTo(svg.querySelector('.atree-halo'), { attr: { 'stroke-opacity': 0.5 }, scale: 0.92, svgOrigin: '0 0' }, { attr: { 'stroke-opacity': 0 }, scale: 1.25, duration: 2.2, ease: 'sine.out', repeat: -1 }),
      gsap.to(svg.querySelector('.atree-stars'), { x: -14, duration: 14, ease: 'sine.inOut', repeat: -1, yoyo: true }),
      gsap.to(svg.querySelectorAll('.atree-link'), { strokeDashoffset: -40, duration: 2.4, ease: 'none', repeat: -1 })
    ];
  }
  host.addEventListener('keydown', (e) => {
    const map = { ArrowLeft: 'parent', ArrowRight: 'child', ArrowUp: 'prev', ArrowDown: 'next' };
    if(map[e.key]){ e.preventDefault(); step(map[e.key]); }
  });
  draw();
}

// ============================================================
// GENERATION SECTION
// A separate, structured layer on top of the Dossier: distinguishes
// STATIC character info (pulled read-only from the Dossier) from
// TIMELINE-DEPENDENT info (owned here, one record per chapter snapshot).
// Every timeline entry is tagged with its provenance (author / ai-generated /
// ai-suggested) and a status (pending / committed / rejected) so nothing
// the AI proposes becomes canon without confirmation, and rejected proposals
// never carry into later chapters. Stored in the same state blob under
// `generationStates`, so any future page reading STORAGE_KEY can retrieve
// e.g. Character -> CurrentObjective for a given chapter without parsing prose.
// ============================================================
const TIMELINE_FIELDS = [
  { key: 'currentLocation', label: 'Current Location', external: 'Primarily tracked by the future World Map.' },
  { key: 'currentRelationships', label: 'Current Relationships' },
  { key: 'currentKnowledge', label: 'Current Knowledge' },
  { key: 'injuries', label: 'Injuries' },
  { key: 'possessions', label: 'Possessions' },
  { key: 'currentObjectives', label: 'Current Objectives' },
  { key: 'currentAffiliations', label: 'Current Affiliations' },
  { key: 'recentEvents', label: 'Recent Events', external: 'Primarily tracked by the future Chapter Generator.' },
  { key: 'characterDevelopment', label: 'Character Development' },
  { key: 'knownSecrets', label: 'Known Secrets' },
  { key: 'politicalSocialStatus', label: 'Political / Social Status', external: 'Primarily tracked by the future World Map.' }
];
const SOURCE_LABEL = { author: 'AUTHOR', 'ai-generated': 'AI-GENERATED', 'ai-suggested': 'AI-SUGGESTED' };

function emptyTimeline(){
  const t = {};
  TIMELINE_FIELDS.forEach(f => { t[f.key] = []; });
  return t;
}
function findGenState(charId, snapshotId){
  return state.generationStates.find(s => s.characterId === charId && s.snapshotId === snapshotId);
}
function makeEntry(text, source){
  return { id: 'ge_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7), text, source, status: source === 'author' ? 'committed' : 'pending', createdAt: Date.now() };
}
// Finds/creates the generation state for the character's currently active snapshot,
// autofilling timeline fields from the nearest prior chapter's COMMITTED entries only.
function ensureGenState(char, snap){
  let gs = findGenState(char.id, snap.id);
  if(gs) return gs;
  const idx = char.snapshots.findIndex(s => s.id === snap.id);
  let priorCommitted = null;
  for(let i = idx - 1; i >= 0; i--){
    const cand = findGenState(char.id, char.snapshots[i].id);
    if(cand && cand.status === 'committed'){ priorCommitted = cand; break; }
  }
  const timeline = emptyTimeline();
  if(priorCommitted){
    TIMELINE_FIELDS.forEach(f => {
      timeline[f.key] = priorCommitted.timeline[f.key]
        .filter(e => e.status === 'committed')
        .map(e => ({ ...e, id: 'ge_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7) }));
    });
  }
  gs = { id: 'gs_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7), characterId: char.id, snapshotId: snap.id, status: 'draft', timeline, createdAt: Date.now(), committedAt: null };
  state.generationStates.push(gs);
  return gs;
}

// Generation view state: which field is open in the terminal, which line is selected.

function renderGenerationSection(){
  const char = getActiveCharacter();

  if(!char){ container.innerHTML = ''; return; }

  TIMELINE_FIELDS.forEach(f => { if(!Array.isArray(gs.timeline[f.key])) gs.timeline[f.key] = []; });

  const staticRows = [
    ['Name', char.name],
    ['Identity', [char.storyline, char.mythos].filter(Boolean).join(' · ')],
    ['Faction', char.faction],
    ['Titles', (snap.titles || []).map(t => t.name).join(', ')],
    ['Skills', (snap.skills || []).map(s => s.name).join(', ')],
    ['Background', [snap.blurb, snap.backstory].filter(Boolean).join(' — ')],
    ['Core ties', (char.relationships || []).map(r => relationshipDisplayName(r) + (r.relation ? ` (${r.relation})` : '')).join(', ')]
  ];
  const isStatic = genField === '__static';
  const field = TIMELINE_FIELDS.find(f => f.key === genField) || null;
  if(!isStatic && !field) genField = 'currentLocation';
  const entries = isStatic ? [] : gs.timeline[genField];

  const pendingTotal = TIMELINE_FIELDS.reduce((n, f) => n + gs.timeline[f.key].filter(e => e.status === 'pending').length, 0);

  // chapter timeline (every chapter version of this character)
  const stops = char.snapshots.map((s, i) => {
    const sgs = findGenState(char.id, s.id);
    const done = sgs && sgs.status === 'committed';
    const locEntries = sgs ? (sgs.timeline.currentLocation || []).filter(e => e.status === 'committed') : [];
    const where = locEntries.length ? locEntries[locEntries.length - 1].text.split(',')[0] : (done ? '—' : 'draft');
    return { s, i, done, where, on: s.id === snap.id };
  });
  const pct = n => stops.length === 1 ? 50 : 6 + (n / (stops.length - 1)) * 88;
  const activeIdx = stops.findIndex(x => x.on);

  let addRow = '';
  if(!locked && !isStatic){
    if(genField === 'currentLocation'){

             <select id="genLocCountry" aria-label="Country"></select><select id="genLocCity" aria-label="City"></select>

        : `<p class="dim">&gt; no world data yet — open the Atlas once to load places</p>`;
    } else if(genField === 'currentRelationships'){

      addRow = others.length

        : `<p class="dim">&gt; no other characters in the Dossier yet</p>`;
    } else {
      addRow = `<form class="term-prompt" id="genForm"><span>&gt;</span><input id="genInput" placeholder="type a new ${escapeAttr(field.label.toLowerCase())} entry and press enter" aria-label="New entry"></form>`;
    }
  }

  container.innerHTML = `
    <div class="section-label">GENERATION — ${escapeHtml(char.name || 'Unnamed')}</div>
    <div class="gen2">
      <div class="gen2-track">
        <div class="gen2-rail">
          <div class="gen2-fill" id="gen2Fill" style="width:${pct(Math.max(0, activeIdx))}%"></div>
          ${stops.map(x => `<button type="button" class="gen2-stop${x.done ? ' done' : ''}${x.on ? ' on' : ''}" data-snap="${escapeAttr(x.s.id)}" style="left:${pct(x.i)}%" aria-label="Chapter ${escapeAttr(x.s.chapterRange || String(x.i + 1))}${x.done ? ', committed' : ''}">
            <small>${escapeHtml(x.where)}</small><i></i><span>${escapeHtml(x.s.chapterRange || 'CH ' + (x.i + 1))}</span></button>`).join('')}
        </div>
      </div>
      <div class="gen2-body">
        <div class="gen2-side" role="tablist" aria-label="Timeline fields">
          <div class="hdr">FIELDS · ${escapeHtml(snap.chapterRange || 'THIS CHAPTER')}</div>
          ${TIMELINE_FIELDS.map(f => {
            const pend = gs.timeline[f.key].filter(e => e.status === 'pending').length;
            return `<button type="button" role="tab" aria-selected="${genField === f.key}" class="${genField === f.key ? 'on' : ''}" data-field="${f.key}"><span>${escapeHtml(f.label.replace(/^Current /, '').toUpperCase())}</span><span>${pend ? pend + '!' : (gs.timeline[f.key].length || '')}</span></button>`;

          </div>

          <div class="gen2-keys">
            ${locked ? `<span>&gt; chapter locked — reopen to edit</span>` : (isStatic ? `<span>&gt; read-only</span>` : `<span><kbd>↑↓</kbd>select</span><span><kbd>Y</kbd>commit</span><span><kbd>N</kbd>reject</span><span><kbd>Del</kbd>remove</span><span><kbd>G</kbd>draft suggestion</span>`)}
          </div>
        </div>
      </div>
      <div class="gen2-foot">
        <span class="crt">${locked ? '&gt; committed · later chapters build on its confirmed entries only' : (pendingTotal ? `&gt; ${pendingTotal} pending · only committed entries carry into the next chapter` : '&gt; all reviewed · ready to commit')}</span>

          ${locked ? `<button class="slant-btn" id="genReopenBtn" type="button">Reopen to edit</button>` : `<button class="slant-btn primary" id="genCommitBtn" type="button">Commit chapter state</button>`}
        </span>
      </div>
    </div>
  `;

  const rerender = async (keepFocus) => { await persistState(); renderGenerationSection(); if(keepFocus){ const t = document.getElementById('gen2Term'); if(t) t.focus({ preventScroll: true }); } };
  container.querySelectorAll('.gen2-stop').forEach(b => b.addEventListener('click', () => { if(b.dataset.snap !== char.activeSnapshotId) switchSnapshot(char.id, b.dataset.snap); }));

        else if((e.key === 'Delete' || e.key === 'Backspace') && cur){ e.preventDefault(); list.splice(genSel, 1); await rerender(true); }

}

// Wires the Era -> Continent -> Country -> City -> Special Site dependent
// dropdowns for the Current Location field. Each change repopulates only
// the selects below it, so picking a Continent immediately narrows Country
// to real matches, same for Country -> City -> Special Site. No-ops if the
// Atlas has never been opened yet in this browser (no World Database to read).
function wireLocationCascade(gs){
  const wdb = getWorldDatabase();
  const eraSel = document.getElementById('genLocEra');
  if(!wdb || !eraSel) return;
  const contSel = document.getElementById('genLocContinent');
  const countrySel = document.getElementById('genLocCountry');
  const citySel = document.getElementById('genLocCity');
  const siteSel = document.getElementById('genLocSite');
  const addBtn = document.getElementById('genLocAdd');

  function fillSelect(sel, options, placeholder){
    sel.innerHTML = (placeholder ? `<option value="">${escapeHtml(placeholder)}</option>` : '')
      + options.map(o => `<option value="${escapeAttr(o.id)}">${escapeHtml(o.name)}</option>`).join('');
  }
  function refreshContinents(){ fillSelect(contSel, wdbContinents(wdb, eraSel.value)); refreshCountries(); }
  function refreshCountries(){ fillSelect(countrySel, wdbCountries(wdb, eraSel.value, contSel.value)); refreshCities(); }
  function refreshCities(){ fillSelect(citySel, wdbCities(wdb, eraSel.value, countrySel.value), '— None / not city-specific —'); refreshSites(); }
  function refreshSites(){ fillSelect(siteSel, wdbSpecialSites(wdb, eraSel.value, countrySel.value, citySel.value || null), '— None —'); }

  fillSelect(eraSel, wdbEras(wdb));
  refreshContinents();

  eraSel.addEventListener('change', refreshContinents);
  contSel.addEventListener('change', refreshCountries);
  countrySel.addEventListener('change', refreshCities);
  citySel.addEventListener('change', refreshSites);

  addBtn.addEventListener('click', async () => {
    if(!countrySel.value) return;
    const ref = {
      eraId: eraSel.value,
      continentId: contSel.value,
      countryId: countrySel.value,
      cityId: citySel.value || null,
      specialSiteId: siteSel.value || null
    };
    const entry = makeEntry(resolveLocationLabel(wdb, ref), 'author');
    entry.locationRef = ref;
    gs.timeline.currentLocation.push(entry);
    await persistState();
    renderGenerationSection();
  });
}

          ${external ? `<div class="gen-field-external">${escapeHtml(external)}</div>` : ''}

        ${entries.length ? entries.map(e => `
          <div class="gen-entry ${e.status}">
            <span class="gen-tag ${e.source}">${SOURCE_LABEL[e.source]}</span>
            <span class="gen-entry-text">${escapeHtml(e.text)}</span>
            ${!locked ? `<span class="gen-entry-actions">
              ${e.status === 'pending' ? `
                <button class="confirm" data-field="${key}" data-id="${e.id}" title="Confirm">✓</button>
                <button class="reject" data-field="${key}" data-id="${e.id}" title="Reject">✕</button>
              ` : `

}

const GLYPHS = [
  [/primordial|origin/i, '原初'], [/\bgod|deity|divine/i, '神'], [/demon|devil|fiend/i, '魔'],
  [/angel|seraph/i, '天使'], [/void|nothing|null/i, '虚無'], [/story|author|fate/i, '物語'],
  [/dream/i, '夢'], [/human|mortal/i, '人間']
];
function glyphFor(char){
  if(char.glyph) return char.glyph;

  const hit = GLYPHS.find(([re]) => re.test(hay));
  return hit ? hit[1] : '記録';
}
// Real moon age today (days since new moon), for the readout.
function lunarAgeToday(){
  const synodic = 29.530588853, ref = Date.UTC(2000, 0, 6, 18, 14);
  const days = (Date.now() - ref) / 86400000;
  return Math.floor(((days % synodic) + synodic) % synodic);
}
// Latest committed location for the active chapter, resolved to a name + coordinates.
function heroLocation(char){
  const snap = getActiveSnapshot(char);
  const gs = (state.generationStates || []).find(g => g.characterId === char.id && g.snapshotId === snap.id);
  const list = gs && gs.timeline ? (gs.timeline.currentLocation || []).filter(e => e && e.status === 'committed' && e.locationRef) : [];
  if(!list.length) return null;
  const ref = list[list.length - 1].locationRef, wdb = getWorldDatabase();
  if(!wdb) return { label: list[list.length - 1].text, era: ref.eraId };
  const site = ref.specialSiteId ? wdb.specialSites.find(x => x.id === ref.specialSiteId && x.era === ref.eraId) : null;
  const city = ref.cityId ? wdb.cities.find(x => x.id === ref.cityId && x.era === ref.eraId) : null;
  const country = wdb.countries.find(x => x.id === ref.countryId && x.era === ref.eraId);
  const pick = [site, city, country].find(x => x && typeof x.lat === 'number');
  const era = wdb.eras.find(e => e.id === ref.eraId);
  return { name: (site || city || country || {}).name || '', lat: pick ? pick.lat : null, lng: pick ? pick.lng : null, era: era ? era.name : ref.eraId };
}
function fmtCoord(v, pos, neg){
  const a = Math.abs(v), d = Math.floor(a), m = Math.round((a - d) * 60);
  return `${v >= 0 ? pos : neg} ${d}°${String(m).padStart(2, '0')}′`;
}
function eraNumeral(era){
  const m = String(era || '').match(/(\d+)/);
  return m ? ('ERA ' + ['0', 'I', 'II', 'III', 'IV', 'V'][+m[1]] ) : 'ERA —';
}

// Rotating sphere of digits behind the portrait (Void Archive). One loop at a time.
let heroSphere = null;
function startHeroSphere(cv, seedStr){
  if(heroSphere) heroSphere.stop();
  const ctx = cv.getContext('2d'), pts = [], N = 460;
  let h = 0; for(const ch of seedStr) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  for(let i = 0; i < N; i++){ const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), th = i * 2.39996; pts.push([Math.cos(th) * r, y, Math.sin(th) * r, (i * 7 + h) % 10]); }
  let a = 0, raf = 0, alive = true;
  function frame(){
    const w = cv.clientWidth, hh = cv.clientHeight; if(!w || !hh) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    if(cv.width !== Math.round(w * dpr)){ cv.width = Math.round(w * dpr); cv.height = Math.round(hh * dpr); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, hh);
    const R = Math.min(w, hh) * 0.38, cx = w * 0.5, cy = hh * 0.44;
    ctx.font = '10px "VT323", "Space Mono", monospace'; ctx.textAlign = 'center';
    for(const [x, y, z, d] of pts){
      const xr = x * Math.cos(a) - z * Math.sin(a), zr = x * Math.sin(a) + z * Math.cos(a);
      const yr = y * Math.cos(0.35) - zr * Math.sin(0.35), z2 = y * Math.sin(0.35) + zr * Math.cos(0.35);
      const sdepth = (z2 + 1.6) / 2.6;
      ctx.fillStyle = `rgba(255,178,56,${(0.05 + sdepth * 0.55).toFixed(2)})`;
      ctx.fillText(d, cx + xr * R, cy + yr * R);
    }
  }
  function loop(){ if(!alive) return; if(!document.hidden){ a += 0.0032; frame(); } raf = requestAnimationFrame(loop); }
  frame(); if(!REDUCED_MOTION) raf = requestAnimationFrame(loop);
  const onResize = () => frame(); window.addEventListener('resize', onResize);
  heroSphere = { stop(){ alive = false; cancelAnimationFrame(raf); window.removeEventListener('resize', onResize); } };
}
function splitChars(el){
  const text = el.textContent;
  el.innerHTML = [...text].map(c => `<span class="ch">${c === ' ' ? '&nbsp;' : escapeHtml(c)}</span>`).join('');
  return el.querySelectorAll('.ch');
}
let lastHeroCharId = null;
function playHeroIntro(char){
  const wrap = document.querySelector('.sig-hero'); if(!wrap) return;
  const nameEl = wrap.querySelector('.sig-name');
  const chars = splitChars(nameEl);
  if(!HAS_GSAP || REDUCED_MOTION) return;
  const fresh = lastHeroCharId !== char.id; lastHeroCharId = char.id;
  gsap.killTweensOf('.sig-portrait');
  const tl = gsap.timeline({ defaults: { ease: 'expo.out' } });
  if(fresh){
    tl.fromTo(chars, { opacity: 0, filter: 'blur(10px)', yPercent: 30 }, { opacity: 1, filter: 'blur(0px)', yPercent: 0, duration: 1.1, stagger: { each: 0.045, from: 'center' } })
      .fromTo('.sig-portrait', { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 1 }, '<.1')
      .fromTo('.sig-vert .jp', { yPercent: -30, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.9 }, '<')
      .fromTo('.sig-meter i', { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: 'steps(12)', stagger: 0.07 }, '<.15')
      .fromTo('.sig-log p', { opacity: 0 }, { opacity: 1, duration: 0.05, stagger: 0.12 }, '<.2');
  }
  // gentle float, forever
  gsap.to('.sig-portrait', { y: -10, duration: 3.2, ease: 'sine.inOut', repeat: -1, yoyo: true, delay: fresh ? 1 : 0 });
  gsap.to('#sigHudRing', { rotation: 360, svgOrigin: '200 176', duration: 70, ease: 'none', repeat: -1 });
}

// per-character, per-side paging offsets (not persisted — resets on reload)
const GALLERY_WINDOW = 3;
let pageState = {};
// transient, not persisted — which corruption-view mode is showing per character this session
let skillViewOverride = {};

function renderGalleries(char){
  const leftList = [];
  const rightList = [];
  char.snapshots.forEach((snap, idx) => (idx % 2 === 0 ? leftList : rightList).push(snap));

  if(!pageState[char.id]) pageState[char.id] = { left: 0, right: 0 };

  renderSideGallery('left', char, leftList);
  renderSideGallery('right', char, rightList);
}

function renderSideGallery(side, char, list){
  const maxStart = Math.max(0, list.length - GALLERY_WINDOW);
  let start = pageState[char.id][side];
  if(start > maxStart) start = maxStart;
  pageState[char.id][side] = start;

  const visible = list.slice(start, start + GALLERY_WINDOW);
  const col = document.getElementById(side === 'left' ? 'galleryLeft' : 'galleryRight');
  col.innerHTML = '';

  visible.forEach(snap => {
    const thumb = document.createElement('div');
    thumb.className = 'gallery-thumb' + (snap.id === char.activeSnapshotId ? ' active' : '');
    thumb.innerHTML = `
      ${snap.portrait ? `<img src="${snap.portrait}" alt="">` : `<img src="${SILHOUETTE_SVG}" style="opacity:.35" alt="">`}
      ${snap.chapterRange ? `<div class="snap-label">${escapeHtml(snap.chapterRange)}</div>` : ''}
      ${char.snapshots.length > 1 ? `<div class="snap-delete" title="Remove this version">&times;</div>` : ''}
    `;
    thumb.addEventListener('click', (e) => {
      if(e.target.classList.contains('snap-delete')){
        confirmDeleteSnapshot(char.id, snap.id);
      }else{
        switchSnapshot(char.id, snap.id);
      }
    });
    col.appendChild(thumb);
  });

  const upBtn = document.getElementById(side === 'left' ? 'leftUp' : 'rightUp');
  const downBtn = document.getElementById(side === 'left' ? 'leftDown' : 'rightDown');
  upBtn.classList.toggle('hidden', start <= 0);
  downBtn.classList.toggle('hidden', start + GALLERY_WINDOW >= list.length);
  upBtn.onclick = () => {
    pageState[char.id][side] = Math.max(0, start - 1);
    renderSideGallery(side, char, list);
  };
  downBtn.onclick = () => {
    pageState[char.id][side] = Math.min(maxStart, start + 1);
    renderSideGallery(side, char, list);
  };
}

function renderRail(){

}

let pendingPortraitSeed = '';
function wireCharacterExtras(existingChar){
  pendingPortraitSeed = existingChar ? (existingChar.portraitSeed || '') : '';
  const prev = document.getElementById('genPrev');
  const refresh = () => {
    if(!window.EpitaphPortrait || !prev) return;
    const draft = {
      name: document.getElementById('fName').value.trim() || 'Unnamed',
      storyline: document.getElementById('fStoryline').value.trim(),
      faction: document.getElementById('fFaction').value,
      mythos: existingChar ? existingChar.mythos : '', divineStatus: existingChar ? existingChar.divineStatus : '',
      portraitFigure: document.getElementById('fFigure').value, portraitStyle: document.getElementById('fStyle').value,
      portraitSeed: pendingPortraitSeed
    };
    EpitaphPortrait.render(EpitaphPortrait.forCharacter(draft)).then(u => { prev.src = u; }).catch(() => {});
  };
  let t;
  ['fName', 'fStoryline', 'fFaction', 'fFigure', 'fStyle'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.addEventListener('input', () => { clearTimeout(t); t = setTimeout(refresh, 200); });
  });
  const rr = document.getElementById('genReroll');
  if(rr) rr.addEventListener('click', () => { pendingPortraitSeed = Math.random().toString(36).slice(2, 8); refresh(); });
  refresh();

  const picker = document.getElementById('musePicker'), guide = document.getElementById('museGuide');
  const renderGuide = () => {
    if(!picker || !guide || !window.EpitaphMuses) return;
    const list = loadMuseList();

    guide.innerHTML = ids.map(id => list.find(m => m.id === id)).filter(Boolean).map(m => `

function reviewCharacterSave(){
  const existingChar = state.characters.find(c => c.id === editingCharId) || null;
  const charId = editingCharId || ('char_' + Date.now());
  const snapId = existingChar ? existingChar.activeSnapshotId : ('snap_' + Date.now());

  const fields = {
    name: document.getElementById('fName').value.trim(),
    storyline: document.getElementById('fStoryline').value.trim(),
    faction: document.getElementById('fFaction').value,
    chapterRange: document.getElementById('fChapterRange').value.trim(),
    blurb: document.getElementById('fBlurb').value.trim(),
    backstory: document.getElementById('fBackstory').value.trim(),
    portrait: pendingPortrait,
    museIds: [...document.querySelectorAll('#musePicker input:checked')].map(i => i.value),
    portraitFigure: (document.getElementById('fFigure') || {}).value || '',
    portraitStyle: (document.getElementById('fStyle') || {}).value || '',
    glyph: ((document.getElementById('fGlyph') || {}).value || '').trim()
  };

  const draftChar = migrateCharacter({
    ...(existingChar || {}),
    id: charId,
    name: fields.name, storyline: fields.storyline, faction: fields.faction,
    museIds: fields.museIds, portraitFigure: fields.portraitFigure, portraitStyle: fields.portraitStyle,
    portraitSeed: pendingPortraitSeed, glyph: fields.glyph,
    activeSnapshotId: snapId,
    snapshots: existingChar
      ? existingChar.snapshots.map(s => s.id === snapId
          ? { ...s, chapterRange: fields.chapterRange, blurb: fields.blurb, backstory: fields.backstory, portrait: fields.portrait }
          : s)
      : [{ id: snapId, chapterRange: fields.chapterRange, blurb: fields.blurb, backstory: fields.backstory, portrait: fields.portrait, ...defaultSnapExtras() }]
  });

  modalContent.innerHTML = `
    <div class="confirm-box">
      <div class="display">Save this profile?</div>
      <p>${draftChar.name ? escapeHtml(draftChar.name) : 'This character'} will be added to your dossier${editingCharId ? ' with these changes' : ''}. You can edit or delete it later.</p>
      <div class="confirm-actions">
        <button class="btn ghost" id="backToEdit">Keep editing</button>
        <button class="btn primary" id="confirmSave">Save profile</button>
      </div>
    </div>
  `;

  document.getElementById('confirmSave').addEventListener('click', async () => {
    const idx = state.characters.findIndex(c => c.id === draftChar.id);
    if(idx >= 0){ state.characters[idx] = draftChar; }
    else{ state.characters.push(draftChar); }
    state.activeId = draftChar.id;
    await persistState();
    renderAll();

function reviewSnapshotSave(){
  const char = getActiveCharacter();
  if(!char) return;
  const prevSnap = char.snapshots.find(s => s.id === char.activeSnapshotId);

  const draftSnap = {
    id: 'snap_' + Date.now(),
    chapterRange: document.getElementById('fChapterRange').value.trim(),
    blurb: document.getElementById('fBlurb').value.trim(),
    backstory: document.getElementById('fBackstory').value.trim(),
    portrait: pendingPortrait,
    ...defaultSnapExtras(),
    ...(prevSnap ? {
      stats: { ...prevSnap.stats },
      inventory: (prevSnap.inventory || []).map(i => ({ ...i })),
      skills: (prevSnap.skills || []).map(s => ({ ...s })),
      titles: (prevSnap.titles || []).map(t => ({ ...t })),
      emotionalState: prevSnap.emotionalState || ''
    } : {})
  };

  modalContent.innerHTML = `
    <div class="confirm-box">
      <div class="display">Save this version?</div>
      <p>This becomes a new chapter version of ${escapeHtml(char.name || 'this character')}. You can switch between versions from the galleries, or remove it later.</p>

        <button class="btn ghost" id="backToEdit">Keep editing</button>
        <button class="btn primary" id="confirmSave">Save version</button>
      </div>
    </div>
  `;

  document.getElementById('confirmSave').addEventListener('click', async () => {
    char.snapshots.push(draftSnap);
    char.activeSnapshotId = draftSnap.id;
    await persistState();
    renderAll();
    closeModal();
  });
  document.getElementById('backToEdit').addEventListener('click', () => {
    openSnapshotForm();
    // re-populate the fields they'd already entered
    setTimeout(() => {
      document.getElementById('fChapterRange').value = draftSnap.chapterRange;
      document.getElementById('fBlurb').value = draftSnap.blurb;
      document.getElementById('fBackstory').value = draftSnap.backstory;
      pendingPortrait = draftSnap.portrait;
      if(pendingPortrait){
        document.getElementById('dropzone').innerHTML = `<img id="dzPreview" src="${pendingPortrait}"><span>Click to replace image</span>`;
      }
    }, 0);
  });
}

function confirmDeleteSnapshot(charId, snapId){
  const char = state.characters.find(c => c.id === charId);
  if(!char || char.snapshots.length <= 1) return;
  const snap = char.snapshots.find(s => s.id === snapId);

  modalContent.innerHTML = `

// ---- Inventory item editor (icon + name + description + photo, per item) ----
let pendingInventoryItems = [];
let invUploadTarget = null; // { idx, field: 'icon' | 'image' }

function syncInventoryFromDOM(){
  document.querySelectorAll('.inv-edit-row').forEach((row, idx) => {
    if(!pendingInventoryItems[idx]) return;
    const nameInput = row.querySelector('.inv-name-input');
    const descInput = row.querySelector('.inv-desc-input');
    pendingInventoryItems[idx].name = nameInput ? nameInput.value : pendingInventoryItems[idx].name;
    pendingInventoryItems[idx].desc = descInput ? descInput.value : pendingInventoryItems[idx].desc;
  });
}

function renderInventoryEditor(){
  const wrap = document.getElementById('inventoryEditorWrap');
  if(!wrap) return;
  wrap.innerHTML = `
    ${pendingInventoryItems.map((item, idx) => `
      <div class="inv-edit-row" data-idx="${idx}">
        <div class="inv-img-drop" onclick="triggerInvImageInput(${idx}, 'icon')" title="Icon image">
          ${item.icon ? `<img src="${item.icon}">` : `<span>Icon</span>`}
        </div>
        <div class="inv-edit-fields">
          <input type="text" class="inv-name-input" placeholder="Item name" value="${escapeAttr(item.name)}">
          <textarea class="inv-desc-input" placeholder="Description">${escapeHtml(item.desc || '')}</textarea>
        </div>
        <div class="inv-img-drop large" onclick="triggerInvImageInput(${idx}, 'image')" title="Photo">
          ${item.image ? `<img src="${item.image}">` : `<span>Photo</span>`}
        </div>
        <button type="button" class="inv-remove-btn" onclick="removeInventoryItem(${idx})">×</button>
      </div>
    `).join('')}
    <button type="button" class="btn ghost inv-add-btn" id="addInvItemBtn">+ Add item</button>
  `;
  document.getElementById('addInvItemBtn').addEventListener('click', addInventoryItem);
}

function addInventoryItem(){
  syncInventoryFromDOM();
  pendingInventoryItems.push({ id: 'inv_' + Math.random().toString(36).slice(2), name: '', desc: '', icon: '', image: '' });
  renderInventoryEditor();
}

function removeInventoryItem(idx){
  syncInventoryFromDOM();
  pendingInventoryItems.splice(idx, 1);
  renderInventoryEditor();
}

function triggerInvImageInput(idx, field){
  syncInventoryFromDOM();
  invUploadTarget = { idx, field };
  document.getElementById('invFileInput').click();
}

function handleInventoryFileInput(e){
  const file = e.target.files[0];
  if(!file || !invUploadTarget) return;
  const { idx, field } = invUploadTarget;
  const reader = new FileReader();
  reader.onerror = () => showToast('Could not read that image file — try a different photo.');
  reader.onload = (ev) => {
    const img = new Image();
    img.onerror = () => showToast('That image could not be opened — try a JPEG or PNG instead.');
    img.onload = () => {
      try{
        const maxDim = field === 'icon' ? 200 : 700;
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        if(pendingInventoryItems[idx]){
          pendingInventoryItems[idx][field] = encodeCanvasImage(canvas, 0.85);
        }
        e.target.value = '';
        renderInventoryEditor();
      }catch(err){
        showToast('Could not process that image — try a smaller photo.');
      }
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function reviewSystemSave(charId, snapId){
  const char = state.characters.find(c => c.id === charId);
  const snap = char.snapshots.find(s => s.id === snapId);
  if(!char || !snap) return;

  const stats = {};
  document.querySelectorAll('.statInput').forEach(inp => {
    const v = parseFloat(inp.value);
    stats[inp.dataset.label] = isNaN(v) ? 0 : Math.max(0, Math.min(100, v));
  });
  syncInventoryFromDOM();
  const inventory = pendingInventoryItems
    .filter(it => it.name.trim() || it.desc.trim() || it.icon || it.image)
    .map(it => ({ id: it.id, name: it.name.trim(), desc: it.desc.trim(), icon: it.icon || '', image: it.image || '' }));
  const skills = document.getElementById('sysSkills').value.split('\n').map(s => s.trim()).filter(Boolean).map(line => {
    const parts = line.split('|').map(p => p.trim());
    const lvl = parseFloat(parts[1]);
    const corrupted = /^(yes|true|1)$/i.test(parts[2] || '');
    return { name: parts[0] || '', level: isNaN(lvl) ? 0 : Math.max(0, Math.min(100, lvl)), corrupted, desc: parts[3] || '', parent: parts[4] || '' };
  });
  const titles = document.getElementById('sysTitles').value.split('\n').map(s => s.trim()).filter(Boolean).map(line => {
    const parts = line.split('|').map(p => p.trim());
    const tier = parseInt(parts[1]);
    return { name: parts[0] || '', rankTier: isNaN(tier) ? 0 : Math.max(0, Math.min(7, tier)), blurb: parts[2] || '' };
  });
  const relationships = parseRelationshipLines(document.getElementById('sysRelationships').value, char.id);
  const mythos = document.getElementById('sysMythos').value;
  const emotionalState = document.getElementById('sysEmotional').value.trim();
  const storyArc = readArcFields('sys');
  const knowledgeAndSecrets = readKnowledgeFields('sys');
  const divineStatus = document.getElementById('sysDivineStatus').value;
  const authority = document.getElementById('sysAuthority').value.trim();

  modalContent.innerHTML = `
    <div class="confirm-box">
      <div class="display">Save this system sheet?</div>
      <p>Updates stats, inventory, skills, and titles for this chapter version, plus mythos, relationships, story arc, and knowledge &amp; secrets for ${escapeHtml(char.name || 'this character')} overall.</p>
      <div class="confirm-actions">
        <button class="btn ghost" id="backToSysEdit">Keep editing</button>
        <button class="btn primary" id="confirmSysSave">Save</button>
      </div>
    </div>
  `;

  document.getElementById('confirmSysSave').addEventListener('click', async () => {
    snap.stats = stats;
    snap.inventory = inventory;
    snap.skills = skills;
    snap.titles = titles;
    snap.emotionalState = emotionalState;
    char.mythos = mythos;
    char.relationships = relationships;
    char.storyArc = storyArc;
    char.knowledge = knowledgeAndSecrets.knowledge;
    char.secrets = knowledgeAndSecrets.secrets;
    char.divineStatus = divineStatus;
    char.authority = authority;
    await persistState();
    renderAll();
    closeModal();
  });
  document.getElementById('backToSysEdit').addEventListener('click', () => openSystemForm(char, snap));
}

// ---- Drag-to-reposition: shared by the poster portrait and avatar modals ----
function wireAdjustDrag(previewEl, imgEl, getPos, setPos){
  let dragging = false, startX = 0, startY = 0, startPos = { x: 50, y: 50 };

  function down(e){
    dragging = true;
    previewEl.classList.add('dragging');
    const pt = e.touches ? e.touches[0] : e;
    startX = pt.clientX; startY = pt.clientY;
    startPos = { ...getPos() };
    e.preventDefault();
  }
  function move(e){
    if(!dragging) return;
    const pt = e.touches ? e.touches[0] : e;
    const rect = previewEl.getBoundingClientRect();
    const dx = pt.clientX - startX;
    const dy = pt.clientY - startY;
    const newX = Math.max(0, Math.min(100, startPos.x - (dx / rect.width) * 100));
    const newY = Math.max(0, Math.min(100, startPos.y - (dy / rect.height) * 100));
    setPos({ x: newX, y: newY });
    imgEl.style.objectPosition = `${newX}% ${newY}%`;
  }
  function up(){
    dragging = false;
    previewEl.classList.remove('dragging');
  }

  previewEl.addEventListener('mousedown', down);
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
  previewEl.addEventListener('touchstart', down, { passive: false });
  window.addEventListener('touchmove', move, { passive: false });
  window.addEventListener('touchend', up);

  return () => {
    window.removeEventListener('mousemove', move);
    window.removeEventListener('mouseup', up);
    window.removeEventListener('touchmove', move);
    window.removeEventListener('touchend', up);
  };
}

// ---- Avatar (system section): optional separate image + its own position ----
function openAvatarImageModal(char, snap){
  let pos = { ...(snap.systemPortraitPosition || { x: 50, y: 50 }) };
  let newSystemPortrait = snap.systemPortrait || null; // null = "use main portrait"
  const startSrc = snap.systemPortrait || snap.portrait || SILHOUETTE_SVG;

  modalContent.innerHTML = `
    <h2>System picture</h2>
    <p class="sub">Optional — upload a different image for this section, or leave it using the main portrait. Drag to adjust framing.</p>
    <div class="field">
      <label class="dropzone" id="avatarDropzone" for="avatarFileInput"><span>Click to upload a different image</span></label>
      <input type="file" id="avatarFileInput" accept="image/*" class="visually-hidden-input">
    </div>
    <div class="adjust-preview rect" id="adjustPreview">
      <img id="adjustImg" src="${startSrc}" style="object-position:${pos.x}% ${pos.y}%;">
    </div>
    <p class="adjust-hint">Click and drag inside the frame</p>
    <div class="modal-actions">
      <button class="btn ghost" id="useMainPortraitBtn">Use main portrait instead</button>
      <button class="btn primary" id="saveAvatarImgBtn">Save</button>
    </div>
    <div class="modal-actions" style="border-top:none; margin-top:8px; padding-top:0; justify-content:flex-end;">
      <button class="btn ghost" id="cancelAvatarImgBtn">Cancel</button>
    </div>
  `;

  const preview = document.getElementById('adjustPreview');
  const img = document.getElementById('adjustImg');
  const cleanup = wireAdjustDrag(preview, img, () => pos, (p) => { pos = p; });

  document.getElementById('avatarFileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onerror = () => showToast('Could not read that image file — try a different photo.');
    reader.onload = (ev) => {
      const im = new Image();
      im.onerror = () => showToast('That image could not be opened — try a JPEG or PNG instead.');
      im.onload = () => {
        try{
          const maxDim = 900;
          let { width, height } = im;
          if(width > maxDim || height > maxDim){
            const scale = maxDim / Math.max(width, height);
            width = Math.round(width * scale);
            height = Math.round(height * scale);
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(im, 0, 0, width, height);
          newSystemPortrait = encodeCanvasImage(canvas, 0.88);
          img.src = newSystemPortrait;
        }catch(err){
          showToast('Could not process that image — try a smaller photo.');
        }
      };
      im.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('useMainPortraitBtn').addEventListener('click', () => {
    newSystemPortrait = null;
    img.src = snap.portrait || SILHOUETTE_SVG;
  });

  document.getElementById('saveAvatarImgBtn').addEventListener('click', async () => {
    snap.systemPortrait = newSystemPortrait || '';
    snap.systemPortraitPosition = pos;
    cleanup();
    await persistState();
    renderAll();
    closeModal();
  });
  document.getElementById('cancelAvatarImgBtn').addEventListener('click', () => { cleanup(); closeModal(); });
  openModal();
}

function handleFileInput(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onerror = () => showToast('Could not read that image file — try a different photo.');
  reader.onload = (ev) => {
    const img = new Image();
    img.onerror = () => showToast('That image could not be opened — try a JPEG or PNG instead.');
    img.onload = () => {
      try{
        // downscale to keep storage light
        const maxDim = 900;
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        pendingPortrait = encodeCanvasImage(canvas, 0.88);

        const dz = document.getElementById('dropzone');
        dz.innerHTML = `<img id="dzPreview" src="${pendingPortrait}"><span>Click to replace image</span>`;
      }catch(err){
        showToast('Could not process that image — try a smaller photo.');
      }
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ---- Backup: export / import the whole Dossier state ----
// Export writes everything under the 'epitaph-character-profiles' key as-is.
// Import replaces it after a warning; the state shape is never changed.
document.getElementById('exportBtn').addEventListener('click', () => {
  try{
    const d = new Date();
    const stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `epitaph-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    const n = state.characters.length;
    showToast(`Exported ${n} character${n === 1 ? '' : 's'}.`);
  }catch(e){
    console.error('Export failed', e);
    showToast('Could not export your data. Please try again.', { duration: 5500 });
  }
});

document.getElementById('importFileInput').addEventListener('change', (e) => {
  const input = e.target;
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onerror = () => showToast('Could not read that file. Pick an Epitaph backup (.json).', { duration: 5500 });
  reader.onload = (ev) => {
    let incoming;
    try{
      incoming = JSON.parse(ev.target.result);
    }catch(err){
      showToast('That file is not valid JSON. Pick an Epitaph backup (.json).', { duration: 5500 });
      return;
    }
    if(!incoming || typeof incoming !== 'object' || !Array.isArray(incoming.characters)){
      showToast('That file is not an Epitaph backup: it has no characters list.', { duration: 5500 });
      return;
    }
    const count = incoming.characters.length;
    const current = state.characters.length;
    modalContent.innerHTML = `
      <div class="confirm-box">
        <div class="display">Replace everything with this backup?</div>
        <p>${escapeHtml(file.name)} holds ${count} character${count === 1 ? '' : 's'}. Importing replaces all ${current} character${current === 1 ? '' : 's'} currently saved in this browser, including their chapters and Generation data. This can't be undone, so export first if you want to keep what's here.</p>
        <div class="confirm-actions">
          <button class="btn ghost" id="cancelImport">Cancel</button>
          <button class="btn primary" id="confirmImport" style="background:var(--ember);border-color:var(--ember);">Replace and import</button>
        </div>
      </div>
    `;
    openModal();
    document.getElementById('cancelImport').addEventListener('click', closeModal);
    document.getElementById('confirmImport').addEventListener('click', async () => {
      try{
        const characters = incoming.characters.filter(c => c && typeof c === 'object').map(migrateCharacter);
        const generationStates = Array.isArray(incoming.generationStates) ? incoming.generationStates : [];
        const activeId = characters.some(c => c.id === incoming.activeId) ? incoming.activeId : (characters[0] ? characters[0].id : null);
        state = { ...incoming, characters, generationStates, activeId };
        await persistState();
        renderAll();
        closeModal();
        showToast(`Imported ${characters.length} character${characters.length === 1 ? '' : 's'}.`);
      }catch(err){
        console.error('Import failed', err);
        closeModal();
        showToast('Import failed. Your existing data was not changed.', { duration: 5500 });
      }
    });
  };
  reader.readAsText(file);
});

// ============================================================
// STORYBOOK — type "open" anywhere on the page to trigger it
// ============================================================
let openBuffer = '';
document.addEventListener('keydown', (e) => {
  const tag = document.activeElement.tagName;
  if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if(document.getElementById('bookStage').classList.contains('active')) return;
  if(document.getElementById('loadingPopup').classList.contains('visible')) return;
  if(e.key.length === 1){
    openBuffer = (openBuffer + e.key).slice(-10).toLowerCase();
    if(openBuffer.endsWith('open')){
      openBuffer = '';
      startStoryBookSequence();
    }
  }
});

function startStoryBookSequence(){
  const popup = document.getElementById('loadingPopup');
  const fill = document.getElementById('loadingBarFill');
  const pct = document.getElementById('loadingPct');
  fill.style.width = '0%';
  pct.textContent = '0%';
  popup.classList.add('visible');

  let p = 0;
  const iv = setInterval(() => {
    p += Math.random() * 18 + 7;
    if(p >= 100){
      p = 100;
      clearInterval(iv);
      fill.style.width = '100%';
      pct.textContent = '100%';
      setTimeout(() => {
        popup.classList.remove('visible');
        openTheBook();
      }, 400);
      return;
    }
    fill.style.width = p + '%';
    pct.textContent = Math.floor(p) + '%';
  }, 220);
}

function openTheBook(){
  document.getElementById('bookBackdrop').classList.add('active');
  const stage = document.getElementById('bookStage');
  stage.classList.add('active');
  const book = document.getElementById('theBook');
  requestAnimationFrame(() => {
    book.classList.add('dropped');
    setTimeout(() => {
      book.classList.add('open');
      initTerminal();
    }, 900);
  });
}

function closeTheBook(){
  const book = document.getElementById('theBook');
  book.classList.remove('open');
  setTimeout(() => {
    book.classList.remove('dropped');
    setTimeout(() => {
      document.getElementById('bookBackdrop').classList.remove('active');
      document.getElementById('bookStage').classList.remove('active');
    }, 700);
  }, 500);
}

document.getElementById('bookCloseBtn').addEventListener('click', closeTheBook);
document.getElementById('loadingCloseX').addEventListener('click', () => {
  document.getElementById('loadingPopup').classList.remove('visible');
});

function initTerminal(){
  const input = document.getElementById('terminalInput');
  const log = document.getElementById('terminalLog');
  if(!input.dataset.wired){
    input.dataset.wired = 'true';
    log.innerHTML = '<div>Storybook terminal ready. Type "help" for commands.</div>';
    input.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if(e.key === 'Enter'){
        const cmd = input.value.trim();
        if(cmd){
          log.innerHTML += `<div class="term-cmd">&gt; ${escapeHtml(cmd)}</div>`;
          log.innerHTML += `<div>${runStorybookCommand(cmd)}</div>`;
          log.scrollTop = log.scrollHeight;
        }
        input.value = '';
      }
    });
  }
  setTimeout(() => input.focus(), 50);
}

function runStorybookCommand(cmd){
  const lower = cmd.toLowerCase();
  if(lower === 'help') return 'Available commands: help, clear, open lib (opl). More can be added on request.';
  if(lower === 'clear'){
    setTimeout(() => { document.getElementById('terminalLog').innerHTML = ''; }, 0);
    return '';
  }
  if(lower === 'open lib' || lower === 'opl'){
    renderLibraryPage();
    return 'Opening the library...';
  }
  return `Unrecognized command: "${escapeHtml(cmd)}" — tell Claude what this should do.`;
}

// ---- Library page: shows the active character's Generation timeline data
// (from generationStates) as text on the book's left page. Each entry can be
// deleted directly from here, regardless of whether its chapter is committed.
const LEFT_PAGE_DEFAULT_HTML = `
        <h3>Storybook</h3>
        <ul class="book-links">
          <li><a href="epitaph-character-dossier.html">Character Dossier</a></li>
          <li><a href="atlas.html">World Map</a></li>
          <li><a href="epitaph-hub.html">Hub</a></li>
        </ul>
        <p class="book-hint">Placeholder links for now — tell Claude where these should actually point.</p>
      `;

function restoreLeftPage(){
  document.querySelector('.book-page.left-page').innerHTML = LEFT_PAGE_DEFAULT_HTML;
}

function renderLibraryPage(){
  const leftPage = document.querySelector('.book-page.left-page');
  const char = getActiveCharacter();
  if(!char){
    leftPage.innerHTML = `<div class="lib-page-header">No active character.</div><span class="lib-back" id="libBackBtn">← back</span>`;
    document.getElementById('libBackBtn').addEventListener('click', restoreLeftPage);
    return;
  }
  const snap = getActiveSnapshot(char);
  const gs = findGenState(char.id, snap.id);
  const timeline = gs ? gs.timeline : emptyTimeline();

  leftPage.innerHTML = `
    <div class="lib-page-header"><strong>${escapeHtml(char.name || 'Unnamed')}</strong> | ${escapeHtml(snap.chapterRange || 'Untitled chapter')}</div>
    ${TIMELINE_FIELDS.map(f => `
      <div class="lib-field">
        <div class="lib-field-label">${escapeHtml(f.label)}</div>
        ${(timeline[f.key] && timeline[f.key].length) ? timeline[f.key].map(e => `
          <div class="lib-entry">
            <span>${escapeHtml(e.text)}${e.status !== 'committed' ? `<span class="lib-entry-meta">(${escapeHtml(e.status)})</span>` : ''}</span>
            <button class="lib-del" data-field="${f.key}" data-id="${e.id}" title="Delete">×</button>
          </div>
        `).join('') : `<div class="lib-empty">Nothing recorded.</div>`}
      </div>
    `).join('')}
    <span class="lib-back" id="libBackBtn">← back to storybook</span>
  `;

  leftPage.querySelectorAll('.lib-del').forEach(btn => {
    btn.addEventListener('click', async () => {
      const { field, id } = btn.dataset;
      if(gs){
        gs.timeline[field] = gs.timeline[field].filter(e => e.id !== id);
        await persistState();
      }
      renderLibraryPage();
      renderGenerationSection();
    });
  });
  document.getElementById('libBackBtn').addEventListener('click', restoreLeftPage);
}
