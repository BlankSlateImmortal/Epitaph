<script>
  // Old links to the Dossier used the site's root (index.html?char=…, ?place=…, ?creature=…): send them on to dossier.html.
  (function () {
    var q = new URLSearchParams(location.search);
    if (['char', 'ch', 'snap', 'place', 'tab', 'creature', 'book'].some(function (k) { return q.has(k); }))
      location.replace('dossier.html' + location.search + location.hash);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Serif+JP:wght@500;900&family=VT323&family=Space+Mono:wght@400;700&family=Source+Serif+4&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/epitaph-theme.css?v=33">
<style>
  /* The front door as a desktop (docs/plans/book-redesign.md Phase 2; the user's references "Homepage new2" (a 1-bit retro desktop) and
     "Homepage new3" (a chunky UI kit), chosen 2026-11-23 over an editorial layout). Icons for the doors, windows for the story, a status bar. */
  *{ box-sizing:border-box; }
  html, body{ margin:0; min-height:100%; background:#070503; color:var(--bone); font-family:var(--f-mono); }
  body{ min-height:100vh; padding:22px; display:flex; }
  body::after{ content:''; position:fixed; inset:0; pointer-events:none; z-index:50; background:repeating-linear-gradient(0deg, rgba(0,0,0,.2) 0 1px, transparent 1px 3px); }
  a{ color:inherit; text-decoration:none; }
  .fd-skip{ position:absolute; left:-999px; top:0; background:var(--amber); color:#080603; padding:8px 12px; z-index:100; font:12px var(--f-mono); }
  .fd-skip:focus{ left:8px; top:8px; }
  html:not(.is-author) .author-only{ display:none !important; }

  .desk{ position:relative; flex:1; display:grid; grid-template-columns:auto minmax(0, 1fr); grid-template-rows:1fr auto; gap:0; min-height:calc(100vh - 44px);
    border:2px solid var(--amber-dim); background:#0b0805; box-shadow:inset 0 0 0 6px #070503, inset 0 0 0 8px rgba(255,178,56,.25); }
  .desk::before{ content:''; position:absolute; inset:8px; pointer-events:none; background:conic-gradient(from 90deg at 2px 2px, transparent 25%, rgba(255,178,56,.05) 0) 0 0 / 4px 4px; }
  /* the icons: the doors */
  .fd-nav{ position:relative; display:flex; flex-direction:column; gap:20px; padding:30px 22px; }
  .fd-ic{ display:grid; justify-items:center; gap:5px; width:84px; font:400 17px var(--f-crt); letter-spacing:.08em; color:var(--amber); text-transform:uppercase; }
  .fd-ic i{ width:54px; height:54px; display:grid; place-items:center; border:2px solid var(--amber); background:#0b0805; box-shadow:3px 3px 0 var(--amber-dim);
    font:900 24px 'Noto Serif JP', serif; font-style:normal; transition:transform .12s, box-shadow .12s, background .12s; }
  .fd-ic:hover i, .fd-ic:focus-visible i{ background:var(--amber); color:var(--ink); transform:translate(-1px, -1px); box-shadow:4px 4px 0 var(--amber-dim); }
  .fd-ic:focus-visible{ outline:none; } .fd-ic:focus-visible span{ text-decoration:underline; }
  /* the windows */
  .fd-main{ position:relative; display:grid; grid-template-columns:minmax(0, 1.25fr) minmax(0, 1fr); grid-template-rows:auto auto; gap:28px 30px; padding:30px 34px 26px 6px; align-content:center; align-items:start; max-width:1320px; }
  .win{ position:relative; background:#120d07; border:2px solid var(--amber); box-shadow:6px 6px 0 #000, 6px 6px 0 2px var(--amber-dim); min-width:0; }
  .win-tb{ display:flex; align-items:center; gap:10px; padding:6px 10px; border-bottom:2px solid var(--amber); background:repeating-linear-gradient(90deg, rgba(255,178,56,.12) 0 2px, transparent 2px 4px); }
  .win-tb h2{ margin:0; font:400 26px/1 var(--f-crt); letter-spacing:.12em; color:var(--amber); background:#120d07; padding:0 8px; }
  .win-tb .sp{ flex:1; }
  .dots{ display:flex; gap:6px; } .dots i{ width:14px; height:14px; border:2px solid var(--amber); border-radius:50%; } .dots i:first-child{ background:var(--amber); }
  .win-x{ width:22px; height:22px; display:grid; place-items:center; border:2px solid var(--amber); font:16px/1 var(--f-crt); color:var(--amber); background:#120d07; }
  .win-body{ padding:18px 22px 22px; }
  .fd-hero h1{ margin:0; font:400 clamp(56px, 7vw, 96px)/.9 Anton, sans-serif; letter-spacing:.02em; color:var(--bone); }
  .fd-hero h1:focus{ outline:none; }
  .fd-hero h1 .cur{ color:var(--amber); animation:fdBlink 1.1s steps(1) infinite; }
  @keyframes fdBlink{ 50%{ opacity:0; } }
  .fd-pitch{ margin:12px 0 0; max-width:52ch; font:15px/1.6 'Source Serif 4', serif; color:var(--dust); }
  .fd-pitch.todo{ color:#e0907c; }
  fieldset.fd-opts{ border:0; padding:0; margin:18px 0 20px; display:grid; gap:10px; }
  .fd-opts legend{ font:400 16px var(--f-crt); letter-spacing:.16em; color:var(--amber-dim); margin-bottom:6px; padding:0; }
  .fd-opt{ display:flex; align-items:center; gap:12px; font:13px var(--f-mono); color:var(--bone); cursor:pointer; }
  .fd-opt input{ appearance:none; width:18px; height:18px; margin:0; border:2px solid var(--amber); border-radius:50%; display:grid; place-items:center; cursor:pointer; flex:none; }
  .fd-opt input:checked::after{ content:''; width:8px; height:8px; border-radius:50%; background:var(--amber); }
  .fd-opt input:focus-visible{ outline:2px solid var(--amber-hi); outline-offset:2px; }
  .fd-opt input:disabled{ border-color:var(--amber-dim); cursor:default; } .fd-opt:has(input:disabled){ color:var(--dust); opacity:.6; cursor:default; }
  .fd-opt small{ color:var(--dust); }
  .fd-btns{ display:flex; flex-wrap:wrap; gap:14px; }
  .fd-b{ font:400 20px Anton, sans-serif; letter-spacing:.06em; padding:10px 26px; border:2px solid var(--amber); color:var(--amber); background:#120d07; box-shadow:4px 4px 0 var(--amber-dim); cursor:pointer; transition:transform .1s, box-shadow .1s; }
  .fd-b.p{ background:var(--amber); color:var(--ink); }
  .fd-b:hover, .fd-b:focus-visible{ transform:translate(-1px, -1px); box-shadow:5px 5px 0 var(--amber-dim); outline:none; }
  .fd-b:active{ transform:translate(3px, 3px); box-shadow:1px 1px 0 var(--amber-dim); }
  /* the chapters window */
  .fd-list{ list-style:none; margin:0; padding:4px 0; }
  .fd-list a, .fd-list .soon{ display:grid; grid-template-columns:40px 1fr auto; gap:12px; align-items:center; padding:9px 14px; border-bottom:2px solid rgba(255,178,56,.2); font:400 21px/1.1 var(--f-crt); letter-spacing:.05em; color:var(--bone); }
  .fd-list li:last-child a, .fd-list li:last-child .soon{ border-bottom:0; }
  .fd-list i{ width:36px; height:36px; display:grid; place-items:center; border:2px solid var(--amber); font:900 16px 'Noto Serif JP', serif; font-style:normal; color:var(--amber); }
  .fd-list small{ font:11px var(--f-mono); color:var(--dust); letter-spacing:.06em; }
  .fd-list a:hover, .fd-list a:focus-visible{ background:rgba(255,178,56,.12); outline:none; }
  .fd-list a.next{ background:rgba(255,178,56,.1); }
  .fd-list .tag{ background:var(--amber); color:var(--ink); font:400 14px var(--f-crt); padding:0 6px; letter-spacing:.08em; }
  .fd-all{ display:block; padding:8px 14px 10px; font:11px var(--f-mono); letter-spacing:.1em; color:var(--amber); text-align:right; border-top:2px solid rgba(255,178,56,.2); }
  .fd-all:hover, .fd-all:focus-visible{ color:var(--amber-hi); outline:none; text-decoration:underline; }
  /* the dialog */
  .fd-dlg{ grid-column:1 / -1; justify-self:center; align-self:start; width:min(640px, 100%); background:#0b0805; border:2px solid var(--bone); border-radius:10px; padding:16px 22px; box-shadow:6px 6px 0 #000; }
  .fd-dlg b{ display:block; font:400 30px/1.1 var(--f-crt); letter-spacing:.08em; color:var(--bone); font-weight:400; }
  .fd-dlg span{ font:400 22px/1.2 var(--f-crt); color:var(--dust); }
  /* the status bar */
  .fd-status{ grid-column:1 / -1; display:flex; flex-wrap:wrap; align-items:center; gap:6px 18px; padding:6px 14px; border-top:2px solid var(--amber-dim); background:#120d07; font:400 21px var(--f-crt); color:var(--amber); }
  .fd-status .pill{ background:var(--amber); color:var(--ink); padding:0 12px; }
  .fd-status .sp{ flex:1; }
  @media (max-width: 900px){
    body{ padding:10px; }
    .desk{ grid-template-columns:1fr; min-height:calc(100vh - 20px); }
    .fd-nav{ flex-direction:row; flex-wrap:wrap; justify-content:center; gap:12px; padding:18px 10px 4px; }
    .fd-ic{ width:62px; font-size:14px; } .fd-ic i{ width:44px; height:44px; font-size:20px; }
    .fd-main{ grid-template-columns:1fr; padding:16px 16px 20px; gap:22px; }
  }
  @media (prefers-reduced-motion: reduce){ .fd-hero h1 .cur{ animation:none; } .fd-ic i, .fd-b{ transition:none; } }
</style>
<script src="assets/epitaph-mode.js?v=6"></script>
</head>
<body>
<a class="fd-skip" href="#fdTitle">Skip to content</a>
<div class="desk">
  <nav class="fd-nav" aria-label="Site">
    <a class="fd-ic" href="read.html"><i aria-hidden="true">読</i><span>Read</span></a>
    <a class="fd-ic" href="dossier.html"><i aria-hidden="true">録</i><span>Dossier</span></a>
    <a class="fd-ic" href="atlas-3d.html"><i aria-hidden="true">図</i><span>Map</span></a>
    <a class="fd-ic" href="dossier.html?book=1"><i aria-hidden="true">書</i><span>Book</span></a>
    <a class="fd-ic" href="powers.html"><i aria-hidden="true">力</i><span>Powers</span></a>
    <a class="fd-ic author-only" href="muses.html"><i aria-hidden="true">霊</i><span>Muses</span></a>
  </nav>

  <main class="fd-main">
    <section class="win fd-hero" aria-labelledby="fdTitle">
      <div class="win-tb"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><h2 aria-hidden="true">EPITAPH.EXE</h2><span class="sp"></span><span class="win-x" aria-hidden="true">×</span></div>
      <div class="win-body">
        <h1 id="fdTitle" tabindex="-1">EPITAPH<span class="cur" aria-hidden="true">_</span></h1>
        <p class="fd-pitch" id="fdPitch" hidden></p>
        <div id="fdGo">
          <fieldset class="fd-opts"><legend>WHERE TO START</legend><div id="fdOpts"></div></fieldset>
          <div class="fd-btns"><button type="button" class="fd-b p" id="fdGoBtn">GO ▶</button><a class="fd-b" href="atlas-3d.html">MAP</a></div>
        </div>
      </div>
    </section>

    <section class="win" aria-labelledby="fdChTitle">
      <div class="win-tb"><h2 id="fdChTitle">CHAPTERS</h2><span class="sp"></span><span class="win-x" aria-hidden="true">×</span></div>
      <ul class="fd-list" id="fdList"><li><span class="soon"><i aria-hidden="true">壱</i><span>CH 01 · COMING SOON</span><small>soon</small></span></li></ul>
      <a class="fd-all" href="read.html">ALL CHAPTERS ▸</a>
    </section>

    <div class="fd-dlg" role="status" id="fdDlg"><b>THE FIRST PAGE IS BLANK</b><span>Chapter one has not been published yet. You can look around the map.</span></div>
  </main>

  <footer class="fd-status">
    <span class="pill" id="fdPill">CH 00</span><span id="fdCount">▣ 0 CHAPTERS</span><span>LUNAR AGE <span id="fdLunar">—</span></span>
    <span class="sp"></span><span id="fdMode">READING</span><span id="fdClock" aria-label="Local time">--:--</span>
  </footer>
</div>

<script>
(function () {
  'use strict';
  // ---- THE PITCH: write it here, in your own words (one short paragraph). Empty = readers see none; you see a reminder. ----
  const PITCH = '';

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const pad2 = n => String(n).padStart(2, '0');
  const KANJI = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
  const FORMAL = ['', '壱', '弐', '参'];      // the formal numerals for 1-3, as on a ledger
  function kanji(n) {
    if (n >= 1 && n <= 3) return FORMAL[n];
    if (!(n > 0 && n < 1000)) return String(n);
    const h = Math.floor(n / 100), t = Math.floor(n % 100 / 10), o = n % 10;
    return (h ? (h > 1 ? KANJI[h] : '') + '百' : '') + (t ? (t > 1 ? KANJI[t] : '') + '十' : '') + KANJI[o];
  }
  const isAuthor = () => !!(window.EpitaphMode && EpitaphMode.isAuthor());

  // the pitch
  const pitch = $('fdPitch');
  if (PITCH.trim()) { pitch.textContent = PITCH.trim(); pitch.hidden = false; }
  else if (isAuthor()) { pitch.innerHTML = '<b>Your pitch is empty.</b> Write it in <code>index.html</code> (the <code>PITCH</code> line). Readers see nothing here until you do.'; pitch.classList.add('todo'); pitch.hidden = false; }

  // the status bar: lunar age, who is reading, the clock
  const synodic = 29.530588853, ref = Date.UTC(2000, 0, 6, 18, 14), days = (Date.now() - ref) / 86400000;
  $('fdLunar').textContent = Math.floor(((days % synodic) + synodic) % synodic);
  $('fdMode').textContent = isAuthor() ? 'AUTHOR' : 'READING';
  const tick = () => { const d = new Date(); $('fdClock').textContent = pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
  tick(); setInterval(tick, 20000);

  // where to start: the choices follow what is published and where this reader stopped
  function options(chs, last) {
    const newest = chs[chs.length - 1], next = Number.isInteger(last) ? chs.find(c => c.chapter > last) : null;
    const o = [];
    o.push({ v: 'start', label: 'Start at chapter 1', sub: chs.length ? (chs[0].title || '') : 'soon', href: chs.length ? 'read.html#ch-' + chs[0].chapter : '', off: !chs.length });
    if (Number.isInteger(last) && chs.length) o.push({ v: 'continue', label: next ? 'Continue where I stopped' : 'Read the last one again', sub: 'chapter ' + (next ? next.chapter : newest.chapter), href: 'read.html#ch-' + (next ? next.chapter : newest.chapter) });
    if (chs.length > 1) o.push({ v: 'latest', label: 'The latest chapter', sub: 'chapter ' + newest.chapter, href: 'read.html#ch-' + newest.chapter });
    o.push({ v: 'map', label: 'Look around the world first', sub: 'the map', href: 'atlas-3d.html' });
    const pick = o.find(x => x.v === 'continue') || o.find(x => !x.off) || o[o.length - 1];
    return { o, pick };
  }
  function draw(chs) {
    let last = null; try { last = parseInt(localStorage.getItem('epitaph-reader-last'), 10); } catch (e) { /* no storage */ }
    if (!Number.isInteger(last)) last = null;
    const { o, pick } = options(chs, last);
    $('fdOpts').innerHTML = o.map(x => `<label class="fd-opt"><input type="radio" name="fdStart" value="${x.v}" data-href="${esc(x.href)}"${x === pick ? ' checked' : ''}${x.off ? ' disabled' : ''}> <span>${esc(x.label)}${x.sub ? ` <small>· ${esc(x.sub)}</small>` : ''}</span></label>`).join('');
    $('fdGoBtn').onclick = () => { const c = document.querySelector('input[name=fdStart]:checked'); if (c && c.dataset.href) location.href = c.dataset.href; };
    $('fdPill').textContent = 'CH ' + pad2(chs.length ? chs[chs.length - 1].chapter : 0);
    $('fdCount').textContent = '▣ ' + chs.length + ' CHAPTER' + (chs.length === 1 ? '' : 'S');
    if (!chs.length) return;
    const nextUnread = last != null ? chs.find(c => c.chapter > last) : chs[0];
    const shown = chs.slice(-5).reverse();
    $('fdList').innerHTML = shown.map(c => `<li><a href="read.html#ch-${c.chapter}"${nextUnread && c.chapter === nextUnread.chapter ? ' class="next"' : ''}><i aria-hidden="true">${esc(kanji(c.chapter))}</i><span>CH ${pad2(c.chapter)} · ${esc((c.title || 'Untitled').toUpperCase())}</span>${nextUnread && c.chapter === nextUnread.chapter ? '<span class="tag">NEXT</span>' : `<small>${c.arc ? esc(c.arc) : ''}</small>`}</a></li>`).join('');
    const newest = chs[chs.length - 1];
    $('fdDlg').innerHTML = nextUnread
      ? `<b>${last == null ? 'START HERE' : 'WELCOME BACK'}</b><span>${last == null ? 'Chapter ' + nextUnread.chapter + ', “' + esc(nextUnread.title || 'Untitled') + '”, is the first page.' : 'Chapter ' + nextUnread.chapter + ', “' + esc(nextUnread.title || 'Untitled') + '”, is waiting.'}</span>`
      : `<b>YOU ARE UP TO DATE</b><span>Chapter ${newest.chapter}, “${esc(newest.title || 'Untitled')}”, is the latest. The next one is coming.</span>`;
  }
  draw([]);
  fetch('chapters/index.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : []).catch(() => []).then(list => {
    const chs = (Array.isArray(list) ? list : []).filter(c => c && Number.isInteger(c.chapter)).sort((a, b) => a.chapter - b.chapter);
    draw(chs);
  });
})();
</script>
</body>
