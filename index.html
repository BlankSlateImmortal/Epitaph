<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Epitaph — Dossier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Noto+Serif+JP:wght@500;900&family=VT323&family=Space+Mono:wght@400;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0c0b09;
    --ink-deep:#060504;
    --bone:#ece6d8;
    --dust:#9c927e;
    --ember:#b3492e;
    --ember-soft: rgba(179,73,46,0.16);
    --verdigris:#5b7a72;
    --verdigris-soft: rgba(91,122,114,0.18);
    --gold:#b9975b;
    --line: rgba(236,230,216,0.12);
    --panel:#141210;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background: var(--ink);
    color: var(--bone);
    font-family:'Source Serif 4', serif;
    min-height:100vh;
    position:relative;
  }
  .grain{
    position:fixed; inset:0; pointer-events:none; z-index:100;
    opacity:0.09; mix-blend-mode: screen;
  }
  .display{
    font-family:'Bebas Neue', sans-serif;
    letter-spacing: 0.03em;
  }

  /* ============ LAYOUT SHELL ============ */
  .app{ max-width:min(1600px, 94vw); margin:0 auto; padding: 28px 32px 0; min-height:100vh; display:flex; flex-direction:column; position:relative; z-index:1; }

  .top-nav{
    display:flex; justify-content:space-between; align-items:center;
    padding-bottom:16px; border-bottom:1px solid var(--line);
  }
  .top-nav .brand{
    font-family:'Bebas Neue', sans-serif;
    font-size:20px; letter-spacing:0.08em; color: var(--dust);
  }
  .top-nav .actions{ display:flex; gap:10px; }
  .btn{
    font-family:'Source Serif 4', serif;
    font-size:14px; color: var(--bone);
    background:transparent; border:1px solid var(--line);
    padding:8px 16px; cursor:pointer; border-radius:2px;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .btn:hover{ border-color: var(--dust); }
  .btn.primary{
    background: var(--ember); border-color: var(--ember); color: var(--bone);
  }
  .btn.primary:hover{ background:#c2532f; }
  .btn.ghost{ color: var(--dust); border-color: transparent; }
  .btn.ghost:hover{ color: var(--bone); }
  .btn.danger{ color:#c96a54; border-color: transparent; }
  .btn.danger:hover{ color:#e2846a; }

  /* ============ POSTER VIEW ============ */
  .poster-wrap{ flex:1; position:relative; }
  .poster{
    position:relative;
    min-height: 660px;
    padding: 36px 0 20px;
    display:flex; flex-direction:column;
  }

  .portrait-stage{
    position:relative;
    flex:1;
    display:flex; align-items:center; justify-content:center;
    min-height: 300px;
    margin: -20px 0;
    padding-top: 60px;
    overflow:hidden;
  }
  .portrait-stage::after{
    content:'';
    position:absolute; left:0; right:0; bottom:0; height:48%;
    background: linear-gradient(to bottom, transparent, var(--ink) 85%);
    z-index:2;
    pointer-events:none;
  }
  .chapter-overlay{
    position:absolute;
    top:2px; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    z-index:4;
    width:100%;
    pointer-events:none;
  }
  .chapter-overlay .name{
    font-size: clamp(32px, 5vw, 54px);
    line-height:0.95;
    max-width:55%;
  }

  .side-gallery{
    position:absolute;
    top:50%; transform: translateY(-50%);
    display:flex; flex-direction:column; align-items:center; gap:8px;
    z-index:4;
    pointer-events:auto;
  }
  .side-gallery.left{ left:12px; }
  .side-gallery.right{ right:12px; }
  .gallery-col{ display:flex; flex-direction:column; gap:8px; }
  .page-arrow{
    background:transparent; border:none; color: var(--dust);
    cursor:pointer; padding:4px;
    display:flex; align-items:center; justify-content:center;
    transition: color 0.15s ease;
  }
  .page-arrow:hover{ color: var(--bone); }
  .page-arrow.hidden{ visibility:hidden; }
  .page-arrow svg{ display:block; }
  .page-arrow.up svg{ transform: rotate(-90deg); }
  .page-arrow.down svg{ transform: rotate(90deg); }

  .gallery-thumb{
    flex:0 0 auto;
    width:78px; height:78px;
    border:1px solid var(--line);
    background: var(--panel);
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition: border-color 0.2s ease;
    border-radius: 30%;
  }
  .gallery-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .gallery-thumb.active{ border-color: var(--ember); }
  .gallery-thumb .snap-label{
    position:absolute; bottom:0; left:0; right:0;
    font-size:9px; text-align:center; padding:1px;
    background: rgba(6,5,4,0.7); color: var(--dust);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .gallery-thumb .snap-delete{
    position:absolute; top:2px; right:2px;
    width:16px; height:16px; border-radius:50%;
    background: rgba(6,5,4,0.8); color: var(--bone);
    font-size:11px; line-height:16px; text-align:center;
    opacity:0; transition:opacity 0.15s ease;
  }
  .gallery-thumb:hover .snap-delete{ opacity:1; }
  .ghost-type{
    position:absolute;
    top:46%; left:50%; transform: translate(-50%,-50%);
    font-family:'Anton', sans-serif;
    font-size: clamp(140px, 48vh, 340px);
    line-height:0.85;
    color: var(--bone);
    opacity: 0.13;
    white-space:nowrap;
    z-index:1;
    letter-spacing:0.01em;
    user-select:none;
    pointer-events:none;
    -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 88%);
    mask-image: linear-gradient(to bottom, black 50%, transparent 88%);
  }
  .portrait{
    position:relative; z-index:2;
    height: 420px;
    max-height: 52vh;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .portrait img{
    max-height:100%; max-width:100%;
    object-fit:contain;
    filter: drop-shadow(0 20px 40px rgba(0,0,0,0.6));
    -webkit-mask-image: linear-gradient(to bottom, black 66%, transparent 94%);
    mask-image: linear-gradient(to bottom, black 66%, transparent 94%);
  }
  .portrait .silhouette{
    height:100%; opacity:0.35;
    -webkit-mask-image: linear-gradient(to bottom, black 66%, transparent 94%);
    mask-image: linear-gradient(to bottom, black 66%, transparent 94%);
  }

  .poster-footer{
    position:relative; z-index:3;
    display:flex; flex-direction:column; align-items:center;
    gap:14px;
    padding-top:10px;
    margin-top:-100px;
    text-align:center;
  }
  .faction-word{
    font-size: clamp(64px, 10vw, 120px);
    line-height:0.85;
    white-space:nowrap;
  }
  .faction-word.ember{ color: var(--ember); }
  .faction-word.verdigris{ color: var(--verdigris); }
  .faction-word.neutral{ color: var(--bone); }

  .lore-text{
    max-width: 480px;
    margin: 0 auto;
    padding-bottom:10px;
  }
  .lore-text .blurb{
    font-style:italic;
    font-size:14px;
    color: var(--bone);
    margin:0 0 8px;
    line-height:1.5;
  }
  .lore-text .backstory{
    font-size:13px;
    color: var(--dust);
    line-height:1.65;
    margin:0;
  }

  .poster-controls{
    position:absolute; top:0; right:0; z-index:4;
    display:flex; gap:8px;
    opacity:0; transition: opacity 0.2s ease;
  }
  .poster-wrap:hover .poster-controls{ opacity:1; }

  /* ============ THUMBNAIL RAIL ============ */
  .rail{
    display:flex; gap:10px; align-items:center;
    padding: 18px 0 28px;
    border-top:1px solid var(--line);
    overflow-x:auto;
  }
  .thumb{
    flex: 0 0 auto;
    width:56px; height:56px;
    border:1px solid var(--line);
    cursor:pointer;
    overflow:hidden;
    position:relative;
    background: var(--panel);
    transition: border-color 0.2s ease, transform 0.15s ease;
  }
  .thumb img{ width:100%; height:100%; object-fit:cover; }
  .thumb.active{ border-color: var(--ember); }
  .thumb:hover{ transform: translateY(-2px); }
  .thumb .initial{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    font-family:'Bebas Neue', sans-serif; font-size:20px; color: var(--dust);
  }
  .thumb-add{
    flex:0 0 auto; width:56px; height:56px;
    border:1px dashed var(--line);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color: var(--dust);
    font-size:22px;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .thumb-add:hover{ border-color: var(--dust); color: var(--bone); }

  /* ============ EMPTY STATE ============ */
  .empty-state{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:18px; padding: 60px 20px;
  }
  .empty-state .display{ font-size: clamp(32px,5vw,48px); color: var(--dust); }
  .empty-state p{ color: var(--dust); font-size:15px; max-width:440px; line-height:1.6; margin:0; }

  /* ============ SYSTEM SHEET (section 2) ============ */
  .system-section{
    border-top:1px solid var(--line);
    margin-top:14px;
    padding-top:40px;
  }
  .system-section .section-label{
    font-family:'Bebas Neue', sans-serif;
    letter-spacing:0.1em;
    font-size:14px;
    color: var(--dust);
    margin-bottom:22px;
  }
  /* ---- Terminal banner: analog system-record identity strip ---- */
  .terminal-banner{
    --accent: var(--gold);
    position:relative;
    border:1px solid var(--line);
    background: rgba(20,18,16,0.55);
    margin-bottom:32px;
    isolation:isolate;
  }
  .tb-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 14px;
    border-bottom:1px solid var(--line);
    position:relative;
  }
  .tb-head::after{
    /* second hairline for the "double-line border" accent, header only */
    content:''; position:absolute; left:14px; right:14px; bottom:-4px;
    height:1px; background:var(--line);
  }
  .tb-record{
    font-family:'Space Mono', monospace; font-size:10.5px; letter-spacing:0.12em;
    color: var(--dust); text-transform:uppercase;
  }
  .tb-status{
    font-family:'Space Mono', monospace; font-size:10.5px; letter-spacing:0.1em;
    color: var(--accent); text-transform:uppercase;
  }
  .tb-body{
    display:flex; gap:24px; align-items:flex-start;
    padding:20px 14px 18px;
  }
  .avatar-wrap{
    flex:0 0 auto;
    width:132px; height:176px;
    border-radius:2px;
    cursor:pointer;
    position:relative;
    overflow:visible;
    transition: width 0.3s ease, height 0.3s ease;
  }
  .avatar-clip{
    width:100%; height:100%;
    border-radius:inherit;
    overflow:hidden;
    border:1px solid var(--line);
    position:relative;
    transition: border-color 0.2s ease;
    background: var(--ink);
  }
  .avatar-wrap:hover .avatar-clip{ border-color: var(--dust); }
  .avatar-clip img{ width:100%; height:100%; object-fit:cover; display:block; filter:grayscale(0.15) contrast(1.04); }
  .avatar-wrap.expanded{ width:280px; height:373px; }
  .avatar-clip .expand-hint{
    position:absolute; bottom:0; left:0; right:0; text-align:center;
    font-size:9px; letter-spacing:0.06em; color: var(--bone);
    font-family:'Space Mono', monospace;
    background: rgba(6,5,4,0.65); padding:4px 0;
    opacity:0; transition:opacity 0.2s ease;
  }
  .avatar-wrap:hover .expand-hint{ opacity:1; }
  .tb-portrait-label{
    position:absolute; top:6px; left:6px; z-index:5;
    font-family:'Space Mono', monospace; font-size:8.5px; letter-spacing:0.12em;
    color: var(--bone); background: rgba(6,5,4,0.6); padding:2px 5px;
    pointer-events:none;
  }
  .tb-corner-marks{ position:absolute; inset:-1px; pointer-events:none; z-index:4; }

  .reposition-btn{
    position:absolute; z-index:6;
    background: rgba(6,5,4,0.78); color: var(--bone);
    border:1px solid var(--line); border-radius:50%;
    width:24px; height:24px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:12px; line-height:1;
    opacity:0; transition: opacity 0.2s ease, border-color 0.2s ease;
  }
  .reposition-btn:hover{ border-color: var(--dust); }
  .portrait:hover .reposition-btn{ opacity:1; }
  #repositionPortraitBtn{ bottom:8px; right:8px; }
  .avatar-edit-btn{ top:6px; right:6px; }
  .avatar-wrap:hover .avatar-edit-btn{ opacity:1; }

  .adjust-preview{
    position:relative; width:100%; max-width:260px; margin:0 auto;
    overflow:hidden; border:1px solid var(--line); background: var(--ink);
    cursor: grab; user-select:none; touch-action:none;
  }
  .adjust-preview.dragging{ cursor: grabbing; }
  .adjust-preview.circle{ border-radius:30%; aspect-ratio:1/1; }
  .adjust-preview.rect{ aspect-ratio:3/4; }
  .adjust-preview img{
    width:100%; height:100%; object-fit:cover; display:block; pointer-events:none;
  }
  .adjust-hint{
    text-align:center; font-size:11px; color: var(--dust);
    margin:10px 0 0; font-style:italic;
  }

  .tb-identity{ flex:1; min-width:0; padding-top:2px; container-type: inline-size; }
  .tb-name{
    font-family:'Bebas Neue', sans-serif;
    letter-spacing:0.02em;
    font-size: clamp(24px, 3.2vw, 34px);
    color: var(--bone);
    margin-bottom:4px;
  }
  .tb-titles-inline{
    font-family:'Space Mono', monospace; font-size:10.5px; letter-spacing:0.03em;
    color: var(--dust); margin-bottom:14px; line-height:1.6;
  }

  .titles-row{ display:flex; flex-direction:column; margin-top:6px; border-top:1px solid var(--line); }
  .title-chip{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    font-family:'Space Mono', monospace;
    font-size:11px; letter-spacing:0.02em;
    color: var(--dust);
    padding:7px 2px;
    border-bottom:1px dotted var(--line);
  }
  .title-chip .chip-label{ color: var(--bone); }
  .title-chip.rank-chip .chip-tier{
    font-size:9px; letter-spacing:0.1em; color: var(--dust); white-space:nowrap;
  }
  .tick-bar{ display:flex; gap:2px; flex:0 0 auto; }
  .tick-bar .tick{ width:4px; height:9px; background: var(--line); }
  .tick-bar .tick.on{ background: var(--accent); }

  .tb-strip{
    display:flex; flex-wrap:wrap;
    border-top:1px solid var(--line);
  }
  .tb-field{
    flex:1 1 180px; min-width:150px;
    padding:10px 14px;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }
  .tb-field:last-child{ border-right:none; }
  .tb-field-label{
    display:block; font-family:'Space Mono', monospace; font-size:9px; letter-spacing:0.12em;
    color: var(--dust); margin-bottom:4px;
  }
  .tb-field-value{ font-size:13.5px; color: var(--bone); }
  .tb-field-value.empty{ color: var(--dust); font-style:italic; }

  .tb-divine-strip{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:9px 14px;
    border-top:1px solid var(--line);
  }
  .tb-divine-label{
    font-family:'Space Mono', monospace; font-size:9px; letter-spacing:0.12em; color: var(--dust);
  }
  .tb-divine-marks{ display:flex; gap:14px; flex-wrap:wrap; }
  .tb-divine-mark{
    font-family:'Space Mono', monospace; font-size:10.5px; letter-spacing:0.06em;
    color: var(--dust);
  }
  .tb-divine-mark.active{ color: var(--accent); }

  .system-grid{
    column-count: 2;
    column-gap: 18px;
  }
  @media (min-width: 1400px){
    .system-grid{ column-count: 3; }
  }
  .sys-panel{
    border:2px solid var(--line);
    background: var(--panel);
    padding:0;
    overflow:hidden;
    width: 100%;
    position:relative;
  }
  .sys-panel .panel-titlebar{
    display:flex; justify-content:space-between; align-items:center;
    background: var(--bone); color: var(--ink);
    padding:7px 12px;
    font-family:'Space Mono', monospace;
    font-size:12px; font-weight:700; letter-spacing:0.06em;
  }
  .sys-panel .panel-titlebar .x{
    width:14px; height:14px;
    border:1.3px solid var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-size:10px; line-height:1;
  }
  .sys-panel .panel-body{ padding:18px 20px; }
  .radar-wrap{ display:flex; justify-content:center; margin-bottom:16px; }

  .stat-bars{ display:flex; flex-direction:column; gap:9px; }
  .stat-bar-row{ display:flex; align-items:center; gap:8px; }
  .stat-bar-row .stat-label{
    width:64px; flex:0 0 auto;
    font-size:10.5px; color: var(--dust);
    text-transform:uppercase; letter-spacing:0.04em;
    font-family:'Space Mono', monospace;
  }
  .lv-tag{
    width:30px; flex:0 0 auto;
    font-size:10.5px; color: var(--bone);
    font-family:'Space Mono', monospace;
  }
  .bar-track{
    flex:1; height:6px;
    background: rgba(240,237,228,0.1);
    position:relative; overflow:hidden;
  }
  .bar-fill{
    position:absolute; top:0; left:0; bottom:0;
    background: var(--ember);
  }

  .skill-list, .relationship-list{
    list-style:none; margin:0; padding:0;
    display:flex; flex-direction:column; gap:12px;
  }
  .skill-list li, .relationship-list li{
    border-bottom:1px solid var(--line); padding-bottom:10px;
  }
  .skill-list li:last-child, .relationship-list li:last-child{ border-bottom:none; padding-bottom:0; }
  .sk-name, .rel-name{ font-size:14px; color: var(--bone); margin-bottom:4px; display:flex; align-items:center; gap:8px; }
  .sk-desc, .rel-note{ font-size:12.5px; color: var(--dust); line-height:1.5; margin-top:5px; }
  .rel-tag{ font-size:10.5px; color: var(--ember); letter-spacing:0.04em; margin-left:auto; }
  /* Linked relationships: the name is a button that opens that character's dossier. */
  .rel-link{
    font:inherit; color: var(--bone); background:none; border:0; padding:0; cursor:pointer;
    text-align:left; border-bottom:1px dotted var(--dust);
  }
  .rel-link:hover, .rel-link:focus-visible{ color: var(--ember); border-bottom-color: var(--ember); outline:none; }
  /* Inferred back-references: shown after the hand-authored list, never merged into it. */
  .relationship-list.inferred{ margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); }
  .relationship-list.inferred .rel-name{ color: var(--dust); }
  .rel-inferred-mark{
    font-family:'Space Mono', monospace; font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase;
    color: var(--dust); border:1px solid var(--line); padding:1px 5px;
  }

  /* ---- Inventory (archive-style rows: icon | title+desc | photo) ---- */
  .archive-list{ display:flex; flex-direction:column; }
  .archive-item{
    display:flex; align-items:center; gap:16px;
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .archive-item:last-child{ border-bottom:none; }
  .archive-icon{
    width:52px; height:52px; flex:0 0 auto;
    border:1px solid var(--line);
    background: var(--ink);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; color: var(--dust); font-size:20px;
  }
  .archive-icon img{ width:100%; height:100%; object-fit:cover; display:block; }
  .archive-body{ flex:1; min-width:0; }
  .archive-title{
    font-family:'Bebas Neue', sans-serif;
    letter-spacing:0.04em; font-size:17px;
    color: var(--bone); margin-bottom:4px;
  }
  .archive-desc{ font-size:12.5px; color: var(--dust); line-height:1.5; }
  .archive-photo{
    width:68px; height:68px; flex:0 0 auto;
    border:1px solid var(--line);
    overflow:hidden; background: var(--ink);
  }
  .archive-photo img{ width:100%; height:100%; object-fit:cover; display:block; }

  /* ---- Inventory editor (inside modal) ---- */
  .inv-editor-wrap{ display:flex; flex-direction:column; gap:10px; }
  .inv-edit-row{
    display:flex; align-items:flex-start; gap:10px;
    border:1px solid var(--line); padding:12px; position:relative;
  }
  .inv-img-drop{
    width:52px; height:52px; flex:0 0 auto;
    border:1px dashed var(--line);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; overflow:hidden; background: var(--ink);
    font-size:9.5px; color: var(--dust); text-align:center; line-height:1.3;
    transition: border-color 0.2s ease;
  }
  .inv-img-drop:hover{ border-color: var(--dust); }
  .inv-img-drop.large{ width:68px; height:68px; }
  .inv-img-drop img{ width:100%; height:100%; object-fit:cover; }
  .inv-edit-fields{ flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
  .inv-edit-fields input[type=text], .inv-edit-fields textarea{
    width:100%; background: var(--ink); border:1px solid var(--line);
    color: var(--bone); font-family:'Source Serif 4', serif; font-size:13.5px;
    padding:8px 10px; border-radius:2px;
  }
  .inv-edit-fields input[type=text]:focus, .inv-edit-fields textarea:focus{
    outline:none; border-color: var(--dust);
  }
  .inv-edit-fields textarea{ resize:vertical; min-height:44px; line-height:1.4; }
  .inv-remove-btn{
    position:absolute; top:8px; right:8px;
    background:transparent; border:none; color: var(--dust);
    font-size:17px; line-height:1; cursor:pointer; padding:2px 4px;
  }
  .inv-remove-btn:hover{ color: var(--ember); }
  /* ---- Mini system windows (fast single-field edit shortcuts, stacked on originals) ---- */
  .sys-panel-wrap{

    display:inline-block;
    width:100%;
    break-inside:avoid;
    margin-bottom:18px;
    vertical-align:top;
  }
  .sys-panel-wrap.full{ column-span: all; display:block; width:100%; }

  @keyframes mwPopIn{
    0%{ opacity:0; transform: translateY(10px) scale(0.9) rotate(-0.6deg); }
    100%{ opacity:1; transform: translateY(0) scale(1) rotate(-0.6deg); }
  }
  @keyframes mwPopInHeader{
    0%{ opacity:0; transform: translateY(-10px) scale(0.9) rotate(0.5deg); }
    100%{ opacity:1; transform: translateY(0) scale(1) rotate(0.5deg); }

  .skill-tree-wrap{ display:flex; justify-content:center; }
  .skill-tree-svg text{
    font-family:'Space Mono', monospace;
    font-size:12px;
    pointer-events:none;
  }

    cursor:pointer;

  }
  .skill-node:hover .node-visual{
    transform: scale(1.16);
  }

  #skillRotateGroup{
    transition: transform 0.65s ease-in-out;
  }
  #skillRotateGroup.spinning{
    transform: rotate(360deg);
  }

  .corruption-toggle-row{
    display:flex; align-items:center; gap:10px;
    margin-bottom:16px;
    padding-bottom:14px;
    border-bottom:1px dotted var(--line);
    flex-wrap:wrap;
  }
  .corruption-toggle-row .toggle-label{
    font-family:'Space Mono', monospace;
    font-size:10.5px; color: var(--dust); letter-spacing:0.06em;
  }
  .toggle-btn{
    font-family:'Space Mono', monospace;
    font-size:10.5px; letter-spacing:0.05em;
    background:transparent; border:1px solid var(--line);
    color: var(--dust); padding:5px 12px; cursor:pointer;
    transition: all 0.15s ease;
  }
  .toggle-btn.active{ background: var(--bone); color: var(--ink); border-color: var(--bone); }
  .toggle-btn:not(.active):hover{ color: var(--bone); border-color: var(--dust); }
  .color-picker-input{
    width:26px; height:26px;
    border:1px solid var(--line);
    background:transparent;
    cursor:pointer;
    padding:0;
  }

  .skill-tooltip{
    position:fixed; z-index:300;
    pointer-events:none;
    background: var(--panel);
    border:1px solid var(--line);
    padding:10px 14px;
    max-width:240px;
    font-family:'Source Serif 4', serif;
    font-size:12.5px; line-height:1.55;

  }
  .skill-tooltip strong{
    display:block;
    font-family:'Space Mono', monospace;
    font-size:11.5px; letter-spacing:0.04em;

    margin-bottom:5px;
  }
  .skill-tooltip.visible{ opacity:1; }
  .sys-empty{ color: var(--dust); font-size:13px; font-style:italic; }

  /* ---- Story Arc: structured fields ---- */

  /* ---- Knowledge & Secrets ---- */
  .know-sec-block{ margin-bottom:20px; }
  .know-sec-block:last-child{ margin-bottom:0; }
  .knowledge-list, .secrets-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px; }
  .knowledge-list li{
    font-size:13.5px; line-height:1.6; color: var(--bone);
    border-bottom:1px solid var(--line); padding-bottom:10px;
  }
  .knowledge-list li:last-child{ border-bottom:none; padding-bottom:0; }
  .secrets-list li{ border-bottom:1px solid var(--line); padding-bottom:10px; }
  .secrets-list li:last-child{ border-bottom:none; padding-bottom:0; }
  .secret-text{ font-size:14px; color: var(--bone); margin-bottom:4px; }
  .secret-meta{ font-size:11.5px; color: var(--dust); letter-spacing:0.02em; }
  .secret-meta.known{ color: var(--ember); }

  @container (max-width: 640px){
    .system-grid{ column-count: 1; }
  }

  @media (max-width: 640px){
    .app{ max-width:100%; padding: 20px 16px 0; }
    .system-grid{ column-count: 1; }

  }

  @media (max-width: 420px){
    .tb-body{ flex-direction:column; gap:16px; }
    .avatar-wrap{ width:120px; height:160px; }
  }

  @media (max-width: 480px){
    .top-nav{ flex-direction:column; align-items:flex-start; gap:10px; }
    .top-nav .brand{ font-size:17px; }
    .top-nav .actions{ width:100%; flex-wrap:wrap; }
  }

  /* ============ MODAL (form + confirm) ============ */
  .modal-backdrop{
    position:fixed; inset:0; background: rgba(6,5,4,0.78);
    display:flex; align-items:center; justify-content:center;
    z-index:200; padding:24px;
    opacity:0; pointer-events:none;
    transition: opacity 0.2s ease;
  }
  .modal-backdrop.visible{ opacity:1; pointer-events:auto; }
  .modal{
    background: var(--panel);
    border:1px solid var(--line);
    width:100%; max-width:640px;
    max-height:86vh; overflow-y:auto;
    padding: 30px 32px 28px;
    opacity:0;
    transform: scale(0.94) translateY(14px);
    transition: opacity 0.22s cubic-bezier(.16,1,.3,1), transform 0.22s cubic-bezier(.16,1,.3,1);
  }
  .modal-backdrop.visible .modal{
    opacity:1;
    transform: scale(1) translateY(0);
  }
  .modal h2{
    font-family:'Bebas Neue', sans-serif;
    font-size:26px; letter-spacing:0.03em;
    margin:0 0 4px;
  }
  .modal .sub{ color: var(--dust); font-size:13.5px; margin:0 0 22px; }

  .field{ margin-bottom:16px; }
  .field label{
    display:block; font-size:12.5px; color: var(--dust);
    margin-bottom:6px;
  }
  .field input[type=text], .field select, .field textarea{
    width:100%;
    background: var(--ink);
    border:1px solid var(--line);
    color: var(--bone);
    font-family:'Source Serif 4', serif;
    font-size:14.5px;
    padding:10px 12px;
    border-radius:2px;
  }
  .field input[type=text]:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color: var(--dust);
  }
  .field textarea{ resize:vertical; min-height:70px; line-height:1.5; }
  .field-row{ display:flex; gap:14px; }
  .field-row .field{ flex:1; }

  .dropzone{
    border:1px dashed var(--line);
    padding:16px; text-align:center;
    cursor:pointer; color: var(--dust); font-size:13px;
    display:flex; align-items:center; justify-content:center; gap:12px;
  }
  .dropzone:hover{ border-color: var(--dust); }
  .dropzone img{ max-height:60px; }

  /* Visually hidden but still real/clickable — display:none file inputs are
     unreliable to trigger programmatically on some mobile browsers (notably
     iOS Safari and in-app browsers like Instagram/Facebook's WebView). */
  .visually-hidden-input{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  .modal-actions{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:24px; padding-top:18px; border-top:1px solid var(--line);
  }

  /* confirm step */
  .confirm-box{ text-align:center; padding: 10px 0 4px; }
  .confirm-box .display{ font-size:24px; color:var(--bone); margin-bottom:8px; }
  .confirm-box p{ color: var(--dust); font-size:14px; margin:0 0 22px; }
  .confirm-actions{ display:flex; gap:10px; justify-content:center; }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); }
  /* ============ STORYBOOK (type "open" anywhere to trigger) ============ */
  .loading-popup{
    position:fixed; inset:0; z-index:500;
    display:flex; align-items:center; justify-content:center;
    background: rgba(6,5,4,0.6);
    opacity:0; pointer-events:none;
    transition: opacity 0.2s ease;
  }
  .loading-popup.visible{ opacity:1; pointer-events:auto; }

  /* ---- Lightweight toast notifications (upload/save failures, etc.) ---- */
  .toast-stack{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    z-index:700; display:flex; flex-direction:column; gap:8px; align-items:center;
    pointer-events:none; width:min(92vw, 420px);
  }
  .toast{
    font-family:'Space Mono', monospace; font-size:12px; letter-spacing:0.02em; line-height:1.5;
    background: var(--ink); border:1px solid var(--ember); color: var(--bone);
    padding:10px 16px; border-radius:2px; box-shadow:0 6px 20px rgba(0,0,0,0.4);
    opacity:0; transform:translateY(8px); transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events:auto; text-align:center;
  }
  .toast.visible{ opacity:1; transform:translateY(0); }
  .loading-window{
    width:320px;
    border:2px solid var(--bone);
    background: var(--ink);
  }
  .loading-titlebar{
    display:flex; justify-content:space-between; align-items:center;
    background: var(--bone); color: var(--ink);
    padding:6px 10px;
    font-family:'Space Mono', monospace; font-size:12px; font-weight:700; letter-spacing:0.06em;
  }
  .loading-titlebar .x{
    cursor:pointer; width:16px; height:16px;
    border:1.5px solid var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-size:11px;
  }
  .loading-body{ padding:22px 20px; text-align:center; }
  .loading-text{
    font-family:'Space Mono', monospace; font-size:12px; letter-spacing:0.04em;
    color: var(--bone); margin-bottom:14px;
  }
  .loading-bar-track{
    position:relative; height:22px;
    border:1.5px solid var(--bone);
    background: var(--panel);
  }
  .loading-bar-fill{
    position:absolute; top:0; left:0; bottom:0; width:0%;
    background: var(--ember);
    transition: width 0.2s ease;
  }
  .loading-pct{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Space Mono', monospace; font-size:11px; color: var(--bone); letter-spacing:0.05em;
    mix-blend-mode: difference;
  }

  .book-backdrop{
    position:fixed; inset:0; z-index:400;
    background: rgba(4,3,2,0.86);
    opacity:0; pointer-events:none;
    transition: opacity 0.5s ease;
  }
  .book-backdrop.active{ opacity:1; pointer-events:auto; }

  .book-stage{
    position:fixed; inset:0; z-index:410;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
    perspective: 1600px;
  }
  .book-stage.active{ pointer-events:auto; }

  .book{
    position:relative;
    width:560px; max-width:90vw; height:380px;
    transform: translateY(-160vh) rotate(-4deg);
    opacity:0;
    transition: transform 1s cubic-bezier(.22,.68,.29,1.15), opacity 0.4s ease;
  }
  .book.dropped{ transform: translateY(0) rotate(0deg); opacity:1; }

  .book-pages-wrap{
    position:absolute; inset:0;
    display:flex;
    background: var(--panel);
    border:2px solid var(--bone);
    box-shadow: 0 30px 60px rgba(0,0,0,0.6);
  }
  .book-page{ flex:1; padding:24px; overflow-y:auto; }
  .book-page.left-page{ border-right:1px dashed var(--line); }
  .book-page h3{
    font-family:'Bebas Neue', sans-serif; letter-spacing:0.06em;
    margin:0 0 14px; color: var(--bone); font-size:20px;
  }
  .book-links{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .book-links a{
    color: var(--dust); text-decoration:none; font-size:14px;
    border-bottom:1px dotted var(--line); padding-bottom:4px; display:inline-block;
  }
  .book-links a:hover{ color: var(--bone); border-color: var(--dust); }
  .book-hint{ font-size:11px; color: var(--dust); margin-top:18px; font-style:italic; }

  .book-cover{
    position:absolute; inset:0;
    background: var(--ink);
    border:2px solid var(--bone);
    transform-origin: left center;
    transform: rotateY(0deg);
    transition: transform 1s ease;
    z-index:5;
    display:flex; align-items:center; justify-content:center;
    backface-visibility:hidden;
  }
  .book-cover span{
    font-family:'Bebas Neue', sans-serif;
    font-size:28px; letter-spacing:0.1em; color: var(--bone);
  }
  .book.open .book-cover{ transform: rotateY(-165deg); }

  .book-close{
    position:absolute; top:-14px; right:-14px; z-index:20;
    width:30px; height:30px; border-radius:50%;
    background: var(--bone); color: var(--ink); border:none; cursor:pointer;
    font-size:16px; display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 0.3s ease;
  }
  .book.open .book-close{ opacity:1; pointer-events:auto; }

  @media (max-width: 640px){
    .book{ width:92vw; height:min(82vh, 640px); }
    .book-pages-wrap{ flex-direction:column; }
    .book-page{ padding:16px; }
    .book-page.left-page{ border-right:none; border-bottom:1px dashed var(--line); flex:0 0 42%; }
    .book-page.right-page{ flex:1; min-height:0; }
    .terminal{ font-size:11.5px; }
  }

  .terminal{
    background: var(--ink); border:1px solid var(--line);
    height:100%; display:flex; flex-direction:column;
    font-family:'Space Mono', monospace; font-size:12px;
  }
  .terminal-log{ flex:1; overflow-y:auto; padding:10px; color: var(--dust); line-height:1.6; }
  .terminal-log .term-cmd{ color: var(--bone); }
  .terminal-input-row{ display:flex; align-items:center; gap:6px; border-top:1px solid var(--line); padding:8px 10px; }
  .terminal-prompt{ color: var(--ember); }
  .terminal-input-row input{
    flex:1; background:transparent; border:none; outline:none;
    color: var(--bone); font-family:'Space Mono', monospace; font-size:12px;
  }

  /* ---- Library page (rendered on the book's left page via "open lib" / "opl") ---- */
  .lib-page-header{
    font-family:'Space Mono', monospace; font-size:11px; letter-spacing:0.08em;
    color: var(--dust); text-transform:uppercase;
    padding-bottom:10px; margin-bottom:14px; border-bottom:1px solid var(--line);
  }
  .lib-page-header strong{ color: var(--bone); font-style:normal; }
  .lib-field{ margin-bottom:14px; }
  .lib-field-label{
    font-family:'Space Mono', monospace; font-size:10px; letter-spacing:0.1em;
    color: var(--dust); text-transform:uppercase; margin-bottom:5px;
  }
  .lib-entry{
    display:flex; align-items:flex-start; justify-content:space-between; gap:8px;
    font-size:13px; color: var(--bone); line-height:1.5;
    padding:3px 0; border-bottom:1px dotted var(--line);
  }
  .lib-entry:last-child{ border-bottom:none; }
  .lib-entry button{
    flex:0 0 auto; background:none; border:none; color: var(--dust);
    cursor:pointer; font-size:13px; padding:0 2px; line-height:1.5;
  }
  .lib-entry button:hover{ color: var(--ember); }
  .lib-empty{ color: var(--dust); font-size:12px; font-style:italic; }
  .lib-back{
    display:inline-block; margin-top:6px; font-size:11px; color: var(--dust);
    cursor:pointer; border-bottom:1px dotted var(--line);
  }
  .lib-back:hover{ color: var(--bone); }

  /* ============ GENERATION SECTION ============ */
  .generation-section{ margin-top:44px; padding-bottom:60px; }
  .generation-section .section-label{ margin-bottom:14px; }
  .gen-status-pill{
    font-family:'Space Mono', monospace; font-size:10px; letter-spacing:0.08em;
    padding:3px 9px; border:1px solid var(--line); text-transform:uppercase;
  }
  .gen-status-pill.draft{ color: var(--gold); border-color: var(--gold); }
  .gen-status-pill.committed{ color: var(--verdigris); border-color: var(--verdigris); }
  .inv-edit-row{ flex-wrap:wrap; }
  .inv-marks{ flex:1 1 100%; border-top:1px dashed var(--line); padding-top:8px; }
  .inv-marks summary{ cursor:pointer; min-height:44px; display:flex; align-items:center; color:var(--amber); font-size:13px; letter-spacing:.08em; text-transform:uppercase; }
  .inv-bound-label{ display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--dust); margin:6px 0 10px; }
  .marks-editor{ display:flex; flex-direction:column; gap:10px; }
  .mark-edit{ display:flex; flex-direction:column; gap:6px; border:1px solid var(--line); border-left:3px solid var(--gold); padding:10px; }
  .mark-edit.kind-curse{ border-left-color:var(--ember); }
  .mark-edit.kind-binding{ border-left-color:var(--verdigris); }
  .mark-edit-top{ display:flex; gap:6px; flex-wrap:wrap; }
  .mark-edit-top select{ flex:0 0 auto; }
  .mark-edit-top input{ flex:1 1 140px; min-width:0; }
  .mark-edit input, .mark-edit select, .mark-edit textarea, .inv-bound-label input{ width:100%; background:var(--ink); border:1px solid var(--line); color:var(--bone); padding:8px 10px; font:inherit; font-size:14px; min-height:40px; }
  .mark-edit-top select, .mark-edit-top input{ width:auto; }
  .mark-edit textarea{ min-height:56px; resize:vertical; }
  .mark-remove, .mark-add{ align-self:flex-start; min-height:40px; }
  .mark-tag{ display:inline-block; font-family:var(--f-crt, monospace); font-size:12px; letter-spacing:.14em; padding:0 5px; border:1px solid var(--gold); color:var(--gold); vertical-align:middle; }
  .mark-tag.curse{ border-color:var(--ember); color:var(--ember); }
  .mark-tag.binding{ border-color:var(--verdigris); color:var(--verdigris); }
  .mark-lines{ display:flex; flex-direction:column; gap:12px; }
  .mark-line{ border-left:2px solid var(--gold); padding:2px 0 2px 12px; }
  .mark-line.kind-curse{ border-left-color:var(--ember); }
  .mark-line.kind-binding{ border-left-color:var(--verdigris); }
  .mark-line b{ font-weight:400; color:var(--bone); font-size:17px; }
  .mark-line p{ margin:4px 0; font-size:15px; }
  .mark-line small{ display:block; font-size:13px; color:var(--dust); }
  .mark-line small.cost{ color:var(--amber); }
  .mark-sep{ font-family:var(--f-crt, monospace); color:var(--amber-dim); letter-spacing:.2em; margin:18px 0 8px; }
  .mark-item{ margin-bottom:14px; }
  .mark-item > b{ font-weight:400; color:var(--bone); font-size:18px; }
  .mark-item .mark-lines{ margin-top:6px; }
  .bound-tag{ display:inline-block; font-family:var(--f-crt, monospace); font-size:12px; letter-spacing:.12em; color:var(--verdigris); border:1px dashed var(--verdigris); padding:0 5px; margin:2px 0 6px; }
  .slot-marks{ display:flex; gap:3px; flex-wrap:wrap; justify-content:center; }
  .slot-marks .mk{ font-style:normal; font-size:10px; line-height:1.3; padding:0 3px; border:1px solid var(--gold); color:var(--gold); text-shadow:none; }
  .slot-marks .mk.curse{ border-color:var(--ember); color:var(--ember); }
  .slot-marks .mk.binding, .slot-marks .mk.bound{ border-color:var(--verdigris); color:var(--verdigris); }
  .locked-note{ font-family:var(--f-crt, monospace); font-size:14px; letter-spacing:.12em; color:var(--verdigris); border:1px dashed var(--verdigris); padding:6px 10px; align-self:center; }
  .brief-body{ padding:18px 22px; display:flex; flex-direction:column; gap:10px; background:#070502; }
  .brief-title{ color:var(--amber-hi); letter-spacing:.06em; margin:0 0 6px; }
  .brief-row{ display:grid; grid-template-columns:170px minmax(0,1fr); gap:12px; border-top:1px dashed rgba(255,178,56,.18); padding-top:8px; }
  .brief-k{ color:var(--amber-dim); letter-spacing:.08em; }
  .brief-v p{ margin:0 0 4px; overflow-wrap:anywhere; }
  .chg-tag.ended{ color:var(--dust); border-color:var(--dust); }
  .brief .gen2-actions{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .brief .gen2-actions .slant-btn{ min-height:44px; }
  @media (max-width:600px){
    .brief-body{ padding:14px 12px; font-size:17px; }
    .brief-row{ grid-template-columns:1fr; gap:2px; }
    .brief .gen2-foot{ flex-direction:column; align-items:flex-start; gap:10px; }
  }
  .chapters-editor{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .chapter-row{ display:grid; grid-template-columns:84px minmax(0,1fr) 44px; gap:6px; align-items:center; }
  .chapter-row input{ min-height:44px; background:var(--ink); border:1px solid var(--line); color:var(--bone); padding:8px 10px; font:inherit; min-width:0; }
  .chapter-row button{ min-height:44px; padding:0; }
  .chapter-row small{ grid-column:1 / -1; color:var(--dust); font-size:12px; }
  .flag{ color:var(--ember); }
  .presence-dead{ color:var(--dust); }
  .presence-missing{ color:var(--ember); }
  .arc-reason{ display:block; font-style:normal; font-size:13px; color:var(--bone); opacity:.8; margin-top:4px; max-width:28ch; }
  .check-label{ display:flex; align-items:center; gap:8px; cursor:pointer; min-height:44px; }

<script>
// ============================================================
// DATA MODEL
// Stored in localStorage (same-origin, shared across every page on this
// site — that's what lets other pages, e.g. a future World Map, read the
// same character/generation data without a backend).
// key: 'epitaph-character-profiles'
// value: {
//   characters: [
//     { id, name, faction, primordial, activeSnapshotId,   (schema v4: archetype etc. live on each snapshot)
//       snapshots: [ {id, chapterRange, blurb, backstory, portrait}, ... ] }
//   ],
//   activeId,
//   schemaVersion,          // see migrateStateV2..V5
//   legacyGenerationStates, // retired Generation ledger, kept as data only
// }
// ============================================================
const STORAGE_KEY = 'epitaph-character-profiles';
const WORLD_DB_STORAGE_KEY = 'epitaph-world-database';
let state = { characters: [], chapters: [], activeId: null }; // schemaVersion is stamped on save

// Reads the Atlas's World Database (Era -> Continent -> Country -> City ->
// Special Site) — the single shared source of geography. Never duplicated
// here; read live so the Dossier's location field can't drift from the
// Atlas's actual data. Returns null if the Atlas has never been opened yet
// in this browser (nothing has seeded the database into storage).
function getWorldDatabase(){
  try{
    const raw = localStorage.getItem(WORLD_DB_STORAGE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){
    return null;
  }
}
function wdbEras(wdb){ return wdb.eras; }
function wdbContinents(wdb, eraId){ return wdb.continents.filter(c => c.era === eraId); }
function wdbCountries(wdb, eraId, continentId){ return wdb.countries.filter(c => c.era === eraId && c.continentId === continentId); }
function wdbCities(wdb, eraId, countryId){ return wdb.cities.filter(c => c.era === eraId && c.countryId === countryId); }
function wdbSpecialSites(wdb, eraId, countryId, cityId){
  return wdb.specialSites.filter(s => s.era === eraId && s.countryId === countryId && (s.cityId === cityId || !s.cityId));
}
// Builds a readable label like "Temple of the Voided, Aurelia, United States,
// North America (Era 1)" from a {eraId,continentId,countryId,cityId,
// specialSiteId} reference — used as the entry's display text, while the
// reference itself is kept on the entry too so the location stays an
// addressable ID, not just a string (per the World Database spec).
function resolveLocationLabel(wdb, ref){
  const era = wdb.eras.find(e => e.id === ref.eraId);
  const continent = wdb.continents.find(c => c.id === ref.continentId && c.era === ref.eraId);
  const country = wdb.countries.find(c => c.id === ref.countryId && c.era === ref.eraId);
  const city = ref.cityId ? wdb.cities.find(c => c.id === ref.cityId && c.era === ref.eraId) : null;
  const site = ref.specialSiteId ? wdb.specialSites.find(s => s.id === ref.specialSiteId) : null;
  const parts = [site, city, country, continent].filter(Boolean).map(x => x.name);
  return parts.join(', ') + (era ? ` (${era.name})` : '');
}

// ---- Lightweight toast notifications — used whenever something fails silently
// otherwise (image can't be read/decoded, save can't be persisted, etc.) ----
function showToast(message, opts = {}){
  let stack = document.getElementById('toastStack');
  if(!stack){
    stack = document.createElement('div');
    stack.id = 'toastStack';
    stack.className = 'toast-stack';
    document.body.appendChild(stack);
  }
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = message;
  stack.appendChild(el);
  requestAnimationFrame(() => el.classList.add('visible'));
  const duration = opts.duration || 4500;
  setTimeout(() => {
    el.classList.remove('visible');
    setTimeout(() => el.remove(), 300);
  }, duration);
}

const FACTIONS = ['Storyborn', 'Voided', 'Humanity', 'Unaffiliated'];
const FACTION_ABBR = { 'Storyborn':'STRY', 'Voided':'VOID', 'Humanity':'HUMN', 'Unaffiliated':'UNAF' };
function factionClass(f){
  if(f === 'Storyborn' || f === 'Humanity') return 'ember';
  if(f === 'Voided') return 'verdigris';
  return 'neutral';
}
function factionLabel(f){
  return FACTION_ABBR[f] || (f || '').toUpperCase();
}

const SILHOUETTE_SVG = `data:image/svg+xml;utf8,${encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 420">
  <rect width="200" height="420" fill="none"/>
  <ellipse cx="100" cy="90" rx="46" ry="54" fill="#ece6d8"/>
  <path d="M30 420 C30 300 45 240 100 240 C155 240 170 300 170 420 Z" fill="#ece6d8"/>
</svg>
`)}`;

function migrateCharacter(c){
  let result = c;
  if(!result.snapshots){
    // old flat-record shape -> wrap into a single snapshot
    const snap = {
      id: 'snap_' + (c.id || Date.now()) + '_0',
      chapterRange: c.chapterRange || '',
      blurb: c.blurb || '',
      backstory: c.backstory || '',
      portrait: c.portrait || null
    };
    result = {
      id: c.id, name: c.name, storyline: c.storyline, faction: c.faction,
      snapshots: [snap], activeSnapshotId: snap.id
    };
  }
  // character-level system-sheet fields
  if(typeof result.primordial !== 'boolean') result.primordial = false;
  if(result.corruptionColor === undefined) result.corruptionColor = '';
  if(result.authority === undefined) result.authority = '';
  if(result.divineStatus === undefined) result.divineStatus = '';
  // muses (reference characters) + generated-portrait settings + vertical glyph
  if(!Array.isArray(result.museIds)) result.museIds = [];
  if(typeof result.portraitFigure !== 'string') result.portraitFigure = '';
  if(typeof result.portraitStyle !== 'string') result.portraitStyle = '';
  if(typeof result.portraitSeed !== 'string') result.portraitSeed = '';
  if(typeof result.glyph !== 'string') result.glyph = '';
  // snapshot-level system-sheet fields
  result.snapshots = result.snapshots.map(s => ({
    ...s,
    stats: s.stats || {},
    inventory: (s.inventory || []).map(it => {
      if(typeof it === 'string'){
        return { id: 'inv_' + Math.random().toString(36).slice(2), name: it, desc: '', icon: '', image: '' };
      }
      return {
        id: it.id || ('inv_' + Math.random().toString(36).slice(2)),
        name: it.name || '', desc: it.desc || '', icon: it.icon || '', image: it.image || '',
        marks: Array.isArray(it.marks) ? it.marks.map(normalizeMark) : [],
        boundTo: typeof it.boundTo === 'string' ? it.boundTo : ''
      };
    }),
    skills: (s.skills || []).map(sk => ({ name: sk.name, desc: sk.desc || '', level: sk.level != null ? sk.level : 0, corrupted: !!sk.corrupted, parent: sk.parent || '' })),
    titles: (s.titles || []).map(t => {
      if(typeof t === 'string') return { name: t, rankTier: 0, blurb: '' };
      return { name: t.name || '', rankTier: t.rankTier || 0, blurb: t.blurb || '' };
    }),
    emotionalState: s.emotionalState || '',
    portraitPosition: s.portraitPosition || { x: 50, y: 50 },
    systemPortrait: s.systemPortrait || '',
    systemPortraitPosition: s.systemPortraitPosition || { x: 50, y: 50 },
    // per-chapter state (schema v2) — see migrateStateV2
    archetype: typeof s.archetype === 'string' ? s.archetype : '',
    location: s.location && typeof s.location === 'object' && s.location.countryId ? s.location : null,
    objective: typeof s.objective === 'string' ? s.objective : '',
    relationships: Array.isArray(s.relationships) ? s.relationships.map(normalizeRelationship) : [],
    knowledge: Array.isArray(s.knowledge) ? s.knowledge.filter(k => typeof k === 'string') : [],
    secrets: Array.isArray(s.secrets) ? s.secrets.map(normalizeSecret) : [],
    condition: Array.isArray(s.condition) ? s.condition.filter(k => typeof k === 'string') : [],
    marks: Array.isArray(s.marks) ? s.marks.map(normalizeMark) : [],
    notes: typeof s.notes === 'string' ? s.notes : '',
    headingToward: typeof s.headingToward === 'string' ? s.headingToward : '',
    // generated-portrait settings live on the chapter so re-rolling one chapter
    // never changes another
    portraitFigure: typeof s.portraitFigure === 'string' ? s.portraitFigure : '',
    portraitStyle: typeof s.portraitStyle === 'string' ? s.portraitStyle : '',
    portraitSeed: typeof s.portraitSeed === 'string' ? s.portraitSeed : '',
    copiedFrom: typeof s.copiedFrom === 'string' ? s.copiedFrom : '',
    // canon chapters are read-only until reopened
    locked: !!s.locked,
    // schema v6: the state applies from this chapter number until the next version starts
    startChapter: Number.isInteger(s.startChapter) && s.startChapter > 0 ? s.startChapter : null,
    presence: PRESENCE.includes(s.presence) ? s.presence : 'alive',
    archetypeReason: typeof s.archetypeReason === 'string' ? s.archetypeReason : ''
  }));
  return result;
}

// ---- Shape helpers for per-chapter lists ----
function newId(prefix){ return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8); }
function normalizeRelationship(r){
  return { name: (r && r.name) || '', relation: (r && r.relation) || '', note: (r && r.note) || '', charId: (r && r.charId) || null };
}
function normalizeSecret(sc){
  if(typeof sc === 'string') return { text: sc, characterKnows: false, knownBy: '' };
  return { text: (sc && sc.text) || '', characterKnows: !!(sc && sc.characterKnows), knownBy: (sc && sc.knownBy) || '' };
}
const MARK_KINDS = ['blessing', 'curse', 'binding'];
function normalizeMark(m){
  m = m || {};
  return {
    id: m.id || newId('mark'),
    kind: MARK_KINDS.includes(m.kind) ? m.kind : 'blessing',
    name: m.name || '', source: m.source || '', effect: m.effect || '', cost: m.cost || '', ends: m.ends || ''
  };
}

// ---- Archetypes ----
// Gods / primordials (divine status, or the God / primordial box) use the
// divine list and share one archetype across every chapter.
function isDivineChar(c){ return !!(c && (c.divineStatus || c.primordial)); }
function archetypeGroups(divine){
  const A = window.EpitaphArchetypes;
  return A ? (divine ? A.DIVINE : A.MORTAL) : [];
}
function archetypeLabel(snap){ return (snap && snap.archetype) || 'UNASSIGNED'; }
// Divine lock: every chapter takes the active chapter's archetype (or the
// latest one that is set).
function applyDivineLock(c){
  // canon chapters win, so locking never rewrites them
  const canon = c.snapshots.find(s => s.locked && s.archetype);
  if(canon){ c.snapshots.forEach(s => { s.archetype = canon.archetype; }); return; }
  const active = c.snapshots.find(s => s.id === c.activeSnapshotId);
  const value = (active && active.archetype) || ([...c.snapshots].reverse().find(s => s.archetype) || {}).archetype || '';
  c.snapshots.forEach(s => { s.archetype = value; });
}
function setArchetype(c, snap, value){
  if(isLocked(snap)) return;
  if(isDivineChar(c)){
    // one archetype for every chapter: canon chapters would change too
    if(value !== snap.archetype && c.snapshots.some(s => isLocked(s))){
      showToast('A god keeps one archetype across chapters, and some chapters are locked as canon. Reopen them to change it.', { duration: 6500 });
      return;
    }
    c.snapshots.forEach(s => { s.archetype = value; });
  } else snap.archetype = value;
}
function archetypeOptionsHtml(divine, current){
  const groups = archetypeGroups(divine);
  const inList = groups.some(g => g.items.includes(current));
  return `<option value="">— unassigned —</option>`
    + groups.map(g => `<optgroup label="${escapeAttr(g.group)}">${g.items.map(n => `<option value="${escapeAttr(n)}"${n === current ? ' selected' : ''}>${escapeHtml(n)}</option>`).join('')}</optgroup>`).join('')
    + `<option value="__custom"${current && !inList ? ' selected' : ''}>Write your own…</option>`;
}
function archetypeFieldHtml(prefix, char, current){
  const divine = isDivineChar(char);
  const inList = archetypeGroups(divine).some(g => g.items.includes(current));
  const custom = !!current && !inList;
  return `<div class="field">
    <label id="${prefix}ArchLabel">${divine ? 'Archetype — locked: one archetype for every chapter' : 'Archetype (this chapter)'}</label>
    <select id="${prefix}Arch">${archetypeOptionsHtml(divine, current)}</select>
    <input type="text" id="${prefix}ArchCustom" value="${custom ? escapeAttr(current) : ''}" placeholder="Write your own archetype"${custom ? '' : ' hidden'} style="margin-top:8px;">
  </div>`;
}
// isDivineNow: optional fn reading the form's divine inputs, so the list
// switches between mortal and divine while the form is open.
function wireArchetypeField(prefix, isDivineNow){
  const sel = document.getElementById(prefix + 'Arch');
  const custom = document.getElementById(prefix + 'ArchCustom');
  if(!sel) return;
  const sync = () => { custom.hidden = sel.value !== '__custom'; if(!custom.hidden) custom.focus(); };
  sel.addEventListener('change', sync);
  if(isDivineNow) return () => {
    const cur = readArchetypeField(prefix), divine = isDivineNow();
    sel.innerHTML = archetypeOptionsHtml(divine, cur);
    const inList = archetypeGroups(divine).some(g => g.items.includes(cur));
    if(cur && !inList){ sel.value = '__custom'; custom.value = cur; }
    custom.hidden = sel.value !== '__custom';
    document.getElementById(prefix + 'ArchLabel').textContent = divine ? 'Archetype — locked: one archetype for every chapter' : 'Archetype (this chapter)';
  };
}
function readArchetypeField(prefix){
  const sel = document.getElementById(prefix + 'Arch');
  if(!sel) return undefined;
  return sel.value === '__custom' ? document.getElementById(prefix + 'ArchCustom').value.trim() : sel.value;
}
// Archetype timeline: consecutive chapters with the same archetype form one step.
function archetypeTimeline(char){
  const steps = [];
  char.snapshots.forEach(s => {
    const name = archetypeLabel(s), last = steps[steps.length - 1];
    if(last && last.name === name){ last.to = s; last.ids.push(s.id); }
    else steps.push({ name, from: s, to: s, ids: [s.id] });
  });
  return steps.map(st => ({ ...st, range: st.from === st.to ? (st.from.chapterRange || '—') : `${st.from.chapterRange || '—'} – ${st.to.chapterRange || '—'}` }));
}

// ---- Marks summary (replaces Blessed / Cursed) ----
function markSummary(snap){
  const marks = (snap && snap.marks) || [];
  const n = k => marks.filter(m => m.kind === k).length;
  const b = n('blessing'), c = n('curse'), d = n('binding');
  const parts = [b && `${b} blessing${b === 1 ? '' : 's'}`, c && `${c} curse${c === 1 ? '' : 's'}`, d && `${d} binding${d === 1 ? '' : 's'}`].filter(Boolean);
  return {
    blessings: b, curses: c, bindings: d,
    accent: c ? 'var(--ember)' : (b ? 'var(--gold)' : 'var(--dust)'),
    label: c ? 'CURSED' : (b ? 'BLESSED' : (d ? 'BOUND' : 'UNMARKED')),
    text: parts.join(' · ')
  };
}
function tierLabel(tier){ return tier ? 'TIER ' + tier : ''; }

// ---- Shared chapter list, start chapters, presence ----
const PRESENCE = ['alive', 'dead', 'missing'];
const PRESENCE_LABEL = { alive: 'Alive', dead: 'Dead', missing: 'Missing' };
// "CH 6–10" → 6, "Chapter 12" → 12, "3–5" → 3. A number after CH/Chapter wins
// ("Book 2, CH 3" → 3); otherwise only a leading number counts. Else null.
function parseStartChapter(text){
  const t = String(text || '');
  const m = t.match(/\b(?:ch|chap|chapter)\.?\s*(\d+)/i) || t.match(/^\s*(\d+)/);
  return m ? parseInt(m[1], 10) : null;
}
function chapterList(){ return (state.chapters || []).slice().sort((a, b) => a.number - b.number); }
function chapterByNumber(n){ return (state.chapters || []).find(c => c.number === n) || null; }
function chapterLabel(n){
  if(!Number.isInteger(n)) return '';
  const c = chapterByNumber(n);
  return 'CH ' + n + (c && c.title ? ' · ' + c.title : '');
}
// The chapter version in effect at chapter n: highest startChapter ≤ n.
function stateAtChapter(character, n){
  let best = null;
  (character.snapshots || []).forEach(s => {
    if(Number.isInteger(s.startChapter) && s.startChapter <= n && (!best || s.startChapter > best.startChapter)) best = s;
  });
  return best;
}

// ---- Changed since last chapter ----
// The previous chapter is the one this chapter was copied from, else the one
// before it in the list. Lists are compared by content (ids are fresh per
// chapter), so an entry is "new" when nothing equal existed before.
function previousSnapshot(char, snap){
  if(!char || !snap) return null;
  const from = snap.copiedFrom && char.snapshots.find(s => s.id === snap.copiedFrom);
  if(from) return from;
  const i = char.snapshots.findIndex(s => s.id === snap.id);
  return i > 0 ? char.snapshots[i - 1] : null;
}
function stripIds(v){
  if(Array.isArray(v)) return v.map(stripIds);
  if(v && typeof v === 'object'){
    const o = {};
    Object.keys(v).sort().forEach(k => { if(k !== 'id') o[k] = stripIds(v[k]); });
    return o;
  }
  return v;
}
// stats: a missing stat and 0 are the same value
function comparable(snap, f){
  if(f === 'stats'){ const st = snap.stats || {}; return STAT_LABELS.map(l => Number(st[l]) || 0); }
  return snap[f] ?? null;
}
const sameContent = (a, b) => JSON.stringify(stripIds(a)) === JSON.stringify(stripIds(b));
const CHANGE_SECTIONS = {
  chapter: ['objective', 'location', 'condition', 'notes', 'presence'], marks: ['marks'],
  stats: ['stats'], skills: ['skills'], inventory: ['inventory'],
  ties: ['relationships'], knowledge: ['knowledge', 'secrets'], arc: ['archetype', 'headingToward']
};
function changesFor(char, snap){
  const prev = previousSnapshot(char, snap);
  const section = {};
  Object.keys(CHANGE_SECTIONS).forEach(k => {
    section[k] = !!prev && CHANGE_SECTIONS[k].some(f => !sameContent(comparable(snap, f), comparable(prev, f)));
  });
  return {
    prev, section,
    // true when this list entry has no equal in the previous chapter
    isNew(field, item){
      if(!prev) return false;
      const before = (prev[field] || []).map(x => JSON.stringify(stripIds(x)));
      return !before.includes(JSON.stringify(stripIds(item)));
    }
  };
}

// Fills the selects, pre-selecting `ref`. Country "— not set —" means no location.
function wireLocationPicker(prefix, ref){

  const countrySel = document.getElementById(prefix + 'LocCountry');

  const refreshCountries = (want) => { fill(countrySel, wdbCountries(wdb, eraSel.value, contSel.value), '— location not set —', want && want.countryId); refreshCities(want); };

// ---- One-time state migration to per-chapter state (schema v2) ----
// Additive only: every replaced value is copied to a legacy* property and the
// original fields stay in place until the UI stops reading them.
const STATE_SCHEMA_VERSION = 6;
const BACKUP_STORAGE_KEY = 'epitaph-character-profiles-backup-v1';    // before the chapter-state upgrade
const BACKUP_STORAGE_KEY_V2 = 'epitaph-character-profiles-backup-v2'; // before the atlas-tracker upgrade
const GEN_NOTE_FIELDS = ['currentAffiliations', 'recentEvents', 'characterDevelopment', 'politicalSocialStatus', 'possessions', 'currentRelationships', 'currentKnowledge', 'knownSecrets'];
function migrateStateV2(st){
  if((st.schemaVersion || 1) >= 2) return st;
  const gens = Array.isArray(st.generationStates) ? st.generationStates : [];
  st.characters.forEach(c => {
    const snaps = c.snapshots;
    const last = snaps[snaps.length - 1];
    if(c.storyArc && typeof c.storyArc === 'string') c.storyArc = { currentArc: c.storyArc };
    // relationships / knowledge / secrets: whole-character -> every chapter
    snaps.forEach(s => {
      s.relationships = (Array.isArray(c.relationships) ? c.relationships : []).map(normalizeRelationship);
      s.knowledge = (Array.isArray(c.knowledge) ? c.knowledge : []).filter(k => typeof k === 'string');
      s.secrets = (Array.isArray(c.secrets) ? c.secrets : []).map(normalizeSecret);
    });
    // story arc
    if(c.legacyStoryArc === undefined) c.legacyStoryArc = JSON.parse(JSON.stringify(c.storyArc || {}));
    if(last && c.storyArc && c.storyArc.currentObjective) last.objective = c.storyArc.currentObjective;
    // mythos -> a mark on every chapter
    if(c.legacyMythos === undefined) c.legacyMythos = c.mythos || '';
    if(c.mythos === 'Blessed' || c.mythos === 'Cursed'){
      snaps.forEach(s => s.marks.push(normalizeMark({
        kind: c.mythos === 'Blessed' ? 'blessing' : 'curse',
        name: c.mythos + ' (migrated)'
      })));
    }
    // storyline -> archetype only on an exact list match
    if(c.legacyStoryline === undefined) c.legacyStoryline = c.storyline || '';
    const arch = window.EpitaphArchetypes ? EpitaphArchetypes.match(c.storyline) : '';
    if(arch) snaps.forEach(s => { if(!s.archetype) s.archetype = arch; });
    // generated-portrait settings -> every chapter
    ['portraitFigure', 'portraitStyle', 'portraitSeed'].forEach(k => {
      const legacyKey = 'legacy' + k[0].toUpperCase() + k.slice(1);
      if(c[legacyKey] === undefined) c[legacyKey] = c[k] || '';
      snaps.forEach(s => { if(!s[k]) s[k] = c[k] || ''; });
    });
    // committed Generation entries -> chapter state
    snaps.forEach(s => {
      const gs = gens.find(g => g.characterId === c.id && g.snapshotId === s.id);
      if(!gs || !gs.timeline) return;
      const committed = key => (Array.isArray(gs.timeline[key]) ? gs.timeline[key] : []).filter(e => e && e.status === 'committed');
      const locs = committed('currentLocation').filter(e => e.locationRef && e.locationRef.countryId);
      if(locs.length && !s.location) s.location = { ...locs[locs.length - 1].locationRef };
      const earlierLocs = locs.slice(0, -1);
      const objs = committed('currentObjectives');
      if(objs.length && !s.objective) s.objective = objs[objs.length - 1].text || '';
      committed('injuries').forEach(e => { if(e.text) s.condition.push(e.text); });
      const lines = [];
      // location entries without a map reference would otherwise be dropped
      // earlier stops in the chapter and location entries without a map reference
      earlierLocs.concat(committed('currentLocation').filter(e => !(e.locationRef && e.locationRef.countryId)))
        .forEach(e => { if(e.text) lines.push(`[from Generation: currentLocation] ${e.text}`); });
      GEN_NOTE_FIELDS.forEach(key => committed(key).forEach(e => { if(e.text) lines.push(`[from Generation: ${key}] ${e.text}`); }));
      if(lines.length) s.notes = [s.notes, lines.join('\n')].filter(Boolean).join('\n');
    });
  });
  if(st.legacyGenerationStates === undefined) st.legacyGenerationStates = JSON.parse(JSON.stringify(gens));
  st.schemaVersion = 2;
  return st;
}
// v3: relationships / knowledge / secrets are edited per chapter only, so the
// whole-character copies move to legacy* (kept, not shown).
function migrateStateV3(st){
  if((st.schemaVersion || 1) >= 3) return st;
  st.characters.forEach(c => {
    ['relationships', 'knowledge', 'secrets'].forEach(k => {
      if(c[k] === undefined) return;
      const legacyKey = 'legacy' + k[0].toUpperCase() + k.slice(1);
      if(c[legacyKey] === undefined) c[legacyKey] = c[k];
      delete c[k];
    });
  });
  st.schemaVersion = 3;
  return st;
}
// v4: storyline, mythos and the story arc leave the character. Archetype is
// per chapter, marks replace mythos, and headingToward replaces the arc.
// A value edited after the v2 migration is kept as legacy*Latest.
function migrateStateV4(st){
  if((st.schemaVersion || 1) >= 4) return st;
  st.characters.forEach(c => {
    const moveOut = (key, legacyKey) => {
      if(!(key in c)) return;
      if(c[legacyKey] === undefined) c[legacyKey] = c[key];
      else if(JSON.stringify(c[legacyKey]) !== JSON.stringify(c[key])) c[legacyKey + 'Latest'] = c[key];
      delete c[key];
    };
    // storyline edited since v2: try the archetype list again for empty chapters
    const arch = window.EpitaphArchetypes ? EpitaphArchetypes.match(c.storyline) : '';
    if(arch) c.snapshots.forEach(s => { if(!s.archetype) s.archetype = arch; });
    // mythos set since v2 that never became a mark
    if((c.mythos === 'Blessed' || c.mythos === 'Cursed') && !c.snapshots.some(s => (s.marks || []).some(m => m.name === c.mythos + ' (migrated)'))){
      c.snapshots.forEach(s => s.marks.push(normalizeMark({ kind: c.mythos === 'Blessed' ? 'blessing' : 'curse', name: c.mythos + ' (migrated)' })));
    }
    moveOut('storyline', 'legacyStoryline');
    moveOut('mythos', 'legacyMythos');
    moveOut('storyArc', 'legacyStoryArc');
    if(isDivineChar(c)) applyDivineLock(c);
  });
  st.schemaVersion = 4;
  return st;
}
// v5: the Generation ledger is retired. A committed Generation chapter
// becomes a locked (canon) chapter; the ledger itself is kept as legacy data.
function migrateStateV5(st){
  if((st.schemaVersion || 1) >= 5) return st;
  const gens = Array.isArray(st.generationStates) ? st.generationStates : [];
  st.characters.forEach(c => c.snapshots.forEach(s => {
    const gs = gens.find(g => g.characterId === c.id && g.snapshotId === s.id);
    if(gs && gs.status === 'committed') s.locked = true;
    delete s.genSyncIds;
  }));
  if('generationStates' in st){
    if(JSON.stringify(gens) !== JSON.stringify(st.legacyGenerationStates || [])) st.legacyGenerationStatesLatest = gens;
    delete st.generationStates;
  }
  st.schemaVersion = 5;
  return st;
}
// v6: one shared chapter list, and a start chapter on every chapter version
// (parsed from its chapter range; unreadable ranges stay empty and are flagged).
function migrateStateV6(st){
  if((st.schemaVersion || 1) >= 6) return st;
  const numbers = new Set();
  st.characters.forEach(c => c.snapshots.forEach(s => {
    if(!Number.isInteger(s.startChapter)) s.startChapter = parseStartChapter(s.chapterRange);
    if(Number.isInteger(s.startChapter)) numbers.add(s.startChapter);
  }));
  if(!Array.isArray(st.chapters)) st.chapters = [];
  numbers.forEach(n => { if(!st.chapters.some(c => c.number === n)) st.chapters.push({ id: newId('ch'), number: n, title: '' }); });
  st.chapters.sort((a, b) => a.number - b.number);
  st.schemaVersion = 6;
  return st;
}
function migrateState(st){ return migrateStateV6(migrateStateV5(migrateStateV4(migrateStateV3(migrateStateV2(st))))); }

// ---- Relationships ----
// Stored as {name, relation, note, charId}. charId links to another Dossier
// character (null for people not profiled yet). The displayed name is resolved
// live from charId so a rename never leaves a stale label.
function findCharacterById(id){
  return id ? state.characters.find(c => c.id === id) || null : null;
}
function relationshipDisplayName(r){
  const target = findCharacterById(r.charId);
  return target ? (target.name || r.name || 'Unnamed') : (r.name || '');
}
// One shared parser for every "Name | Relation | Note" textarea.
// A name that matches another character (case-insensitive, not self) is linked.
function parseRelationshipLines(text, selfId){
  return String(text || '').split('\n').map(s => s.trim()).filter(Boolean).map(line => {
    const parts = line.split('|').map(p => p.trim());
    const name = parts[0] || '';
    const key = name.toLowerCase();
    const match = key ? state.characters.find(c => c.id !== selfId && (c.name || '').trim().toLowerCase() === key) : null;
    return { name: match ? (match.name || name) : name, relation: parts[1] || '', note: parts[2] || '', charId: match ? match.id : null };
  });
}
// Pre-fills the textarea with live names, so a renamed character
// doesn't silently unlink on the next save.
function relationshipLines(list){
  return (list || []).map(r => `${relationshipDisplayName(r)} | ${r.relation || ''} | ${r.note || ''}`).join('\n');
}
// Characters who list `char` but whom `char` hasn't linked back.
// A's `relation` describes `char` from A's side, so it's shown as
// "lists you as: X" rather than as if it were char's own view.
function inferredRelationships(char){
  const own = (getActiveSnapshot(char) || {}).relationships || [];
  const linked = new Set(own.map(r => r.charId).filter(Boolean));
  const out = [];
  state.characters.forEach(other => {
    if(other.id === char.id || linked.has(other.id)) return;
    const back = ((getActiveSnapshot(other) || {}).relationships || []).find(r => r.charId === char.id);
    if(back) out.push({ charId: other.id, name: other.name || 'Unnamed', relation: back.relation || '', note: back.note || '' });
  });
  return out;
}

// ---- Image encoding ----
// JPEG is smaller but drops transparency. Scan the alpha channel: any pixel
// below 255 keeps the image as PNG; fully opaque images are saved as JPEG.
// If the scan fails (e.g. a tainted canvas), fall back to PNG.
function encodeCanvasImage(canvas, jpegQuality){
  try{
    const data = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data;
    for(let i = 3; i < data.length; i += 4){
      if(data[i] < 255) return canvas.toDataURL('image/png');
    }
    return canvas.toDataURL('image/jpeg', jpegQuality);
  }catch(e){
    return canvas.toDataURL('image/png');
  }
}

async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      const needsMigration = (parsed.schemaVersion || 1) < STATE_SCHEMA_VERSION;
      if(needsMigration) backupBeforeMigration(raw, parsed.schemaVersion || 1);
      parsed.characters = (parsed.characters || []).map(migrateCharacter);
      state = migrateState(parsed);
      if(needsMigration){
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ console.error('Could not save migrated profiles', e); }
      }
    }
  }catch(e){
    state = { characters: [], chapters: [], activeId: null, schemaVersion: STATE_SCHEMA_VERSION };
  }
}

// Saves the untouched pre-migration data under its own key, once. If the
// browser has no room for a second copy, the migration still runs (it only
// adds fields) and the user is told to Export a file backup.
function backupBeforeMigration(raw, fromVersion){
  const key = fromVersion < 2 ? BACKUP_STORAGE_KEY : BACKUP_STORAGE_KEY_V2;
  try{
    if(localStorage.getItem(key)) return;
    localStorage.setItem(key, raw);
  }catch(e){
    console.error('Could not store the pre-migration backup', e);
    setTimeout(() => showToast('Your data was upgraded, but there was no room to keep a backup copy in the browser. Use Export to save a backup file.', { duration: 9000 }), 800);
  }
}

async function persistState(){
  state.schemaVersion = STATE_SCHEMA_VERSION;
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('Could not save profiles', e);
    if(e && (e.name === 'QuotaExceededError' || e.code === 22)){
      showToast('Storage is full — try removing an old portrait, item image, or chapter to free up space.', { duration: 6500 });
    } else {
      showToast('Could not save your changes. Please try again.', { duration: 5500 });
    }
  }
}

// ---- Level/progress derived from a 0-100 value (5 levels, 20 points each) ----
function levelInfo(value){
  const span = 20;
  const v = Math.max(0, Math.min(100, value || 0));
  const lvl = Math.min(5, Math.floor(v / span) + 1);
  const pct = v >= 100 ? 100 : ((v % span) / span) * 100;
  return { lvl, pct };
}

function rankSpikes(count, x0, x1, yBase, dir, len){
  // dir: 1 = spikes point downward (from a top edge), -1 = point upward (from a bottom edge)
  let out = '';
  const step = (x1 - x0) / (count + 1);
  for(let i = 1; i <= count; i++){
    const x = x0 + step * i;
    const w = step * 0.5;
    out += `<polygon points="${x - w / 2},${yBase} ${x + w / 2},${yBase} ${x},${yBase + len * dir}" />`;
  }
  return out;
}

const STAT_LABELS = ['Power', 'Will', 'Cunning', 'Faith', 'Corruption', 'Renown'];
// Shared defaults for a brand-new snapshot's non-identity fields (stats/inventory/etc.),
// used both for a character's very first snapshot and as a fallback when a chapter

  return {

function renderRadar(stats){
  const size = 220, center = size / 2, radius = size / 2 - 30;
  const angleStep = (Math.PI * 2) / STAT_LABELS.length;

  function pointAt(i, frac){
    const angle = -Math.PI / 2 + i * angleStep;
    return {
      x: center + radius * frac * Math.cos(angle),
      y: center + radius * frac * Math.sin(angle)
    };
  }

  let gridPolys = '';
  [0.25, 0.5, 0.75, 1].forEach(l => {
    const pts = STAT_LABELS.map((_, i) => { const p = pointAt(i, l); return `${p.x},${p.y}`; }).join(' ');
    gridPolys += `<polygon points="${pts}" fill="none" style="stroke:var(--line)" stroke-width="1"/>`;
  });

  let axisLines = '', labels = '';
  STAT_LABELS.forEach((label, i) => {
    const p = pointAt(i, 1);
    axisLines += `<line x1="${center}" y1="${center}" x2="${p.x}" y2="${p.y}" style="stroke:var(--line)" stroke-width="1"/>`;
    const lp = pointAt(i, 1.18);
    labels += `<text x="${lp.x}" y="${lp.y}" font-size="9.5" style="fill:var(--dust)" text-anchor="middle" dominant-baseline="middle" font-family="Space Mono, monospace">${label.toUpperCase()}</text>`;
  });

  const dataPts = STAT_LABELS.map((label, i) => {
    const val = (stats && stats[label] != null) ? stats[label] : 0;
    const p = pointAt(i, Math.max(0, Math.min(100, val)) / 100);
    return `${p.x},${p.y}`;
  }).join(' ');

  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    ${gridPolys}${axisLines}
    <polygon points="${dataPts}" style="fill:var(--ember-soft); stroke:var(--ember)" stroke-width="2"/>
    ${labels}
  </svg>`;
}

// ---- Skill tree (radial node graph, Rise-of-the-Shield-Hero style) ----
const DEFAULT_CORRUPTION_COLOR = '#b3492e';

// mode: null = use each skill's own corrupted flag; 'corrupted' = force all to corruptionColor; 'normal' = force all to bone
function renderSkillTree(skills, corruptionColor, mode){
  if(!skills.length) return '';
  const size = 340;
  const cx = size / 2, cy = size / 2;
  const outer = skills.slice(1);
  const outerRadius = outer.length ? Math.min(140, 90 + outer.length * 4) : 0;
  const nodeR = 30, centerR = 36;
  const cColor = corruptionColor || DEFAULT_CORRUPTION_COLOR;

  function colorFor(skill){
    if(mode === 'corrupted') return cColor;
    if(mode === 'normal') return 'var(--bone)';
    return skill.corrupted ? cColor : 'var(--bone)';
  }

  function spikes(x, y, r, col){
    let out = '';
    for(let i = 0; i < 8; i++){
      const a = i * (Math.PI / 4);
      const x1 = x + Math.cos(a) * (r + 2), y1 = y + Math.sin(a) * (r + 2);
      const x2 = x + Math.cos(a) * (r + 7), y2 = y + Math.sin(a) * (r + 7);
      out += `<line class="spike-line" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${col}" stroke-width="1.5" opacity="0.55"/>`;
    }
    return out;
  }

  function nodeGroup(idx, x, y, r, skill, dx, dy){
    const c = colorFor(skill);
    return `<g class="skill-node" data-idx="${idx}" style="transform-origin:${x}px ${y}px; --dx:${dx}px; --dy:${dy}px;">
      <g class="node-visual" style="transform-origin:${x}px ${y}px;">
        ${spikes(x, y, r, c)}
        <circle class="ring-outer" cx="${x}" cy="${y}" r="${r}" fill="var(--ink)" style="stroke:${c}; color:${c};" stroke-width="2"/>
        <circle class="ring-inner" cx="${x}" cy="${y}" r="${r - 6}" fill="none" style="stroke:${c}" stroke-width="1" opacity="0.5"/>
        <text class="node-label" x="${x}" y="${y + 4}" text-anchor="middle" style="fill:${c}">LV${levelInfo(skill.level).lvl}</text>
      </g>
    </g>`;
  }

  let lines = '', nodes = nodeGroup(0, cx, cy, centerR, skills[0], 0, 0);

  outer.forEach((s, i) => {
    const angle = -Math.PI / 2 + i * (Math.PI * 2 / outer.length);
    const x = cx + outerRadius * Math.cos(angle);
    const y = cy + outerRadius * Math.sin(angle);
    lines += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" style="stroke:var(--line)" stroke-width="1.5"/>`;
    nodes += nodeGroup(i + 1, x, y, nodeR, s, cx - x, cy - y);
  });

  return `<svg class="skill-tree-svg" width="100%" height="${size}" viewBox="0 0 ${size} ${size}">
    <g id="skillRotateGroup" style="transform-origin:${cx}px ${cy}px;">${lines}${nodes}</g>
  </svg>`;
}

function wireSkillTooltips(skills){
  const tooltip = document.getElementById('skillTooltip');
  document.querySelectorAll('.skill-node').forEach(node => {
    const skill = skills[parseInt(node.dataset.idx)];
    node.addEventListener('mouseenter', () => {
      const lvl = levelInfo(skill.level).lvl;
      tooltip.innerHTML = `<strong>${escapeHtml(skill.name)} — LV${lvl}${skill.corrupted ? ' · CORRUPTED' : ''}</strong>${escapeHtml(skill.desc || '')}`;
      tooltip.classList.add('visible');
    });
    node.addEventListener('mousemove', (e) => {
      let x = e.clientX + 16, y = e.clientY + 16;
      if(x + 240 > window.innerWidth) x = e.clientX - 240 - 16;
      tooltip.style.left = x + 'px';
      tooltip.style.top = y + 'px';
    });
    node.addEventListener('mouseleave', () => tooltip.classList.remove('visible'));
  });
}

  const tier = t.rankTier || 0;
  if(tier > 0){
    const ticks = Array.from({ length: 7 }, (_, i) => `<i class="tick${i < tier ? ' on' : ''}"></i>`).join('');
    return `<div class="title-chip rank-chip" data-tier="${tier}" data-title-idx="${idx}">
      <span class="chip-label">${escapeHtml(t.name)}</span>
      <span class="chip-tier">${escapeHtml(tierLabel(tier))}</span>
      <span class="tick-bar">${ticks}</span>
    </div>`;
  }
  return `<div class="title-chip" data-title-idx="${idx}"><span class="chip-label">${escapeHtml(t.name)}</span></div>`;
}

// ---- Corruption view toggle: merge to center, spin, diverge back out recolored ----
function toggleCorruptionView(charId, mode){
  const char = state.characters.find(c => c.id === charId);
  if(!char || skillViewOverride[charId] === mode) return;

  const wrap = document.querySelector('.skill-tree-wrap');
  const rotateGroup = document.getElementById('skillRotateGroup');
  if(!wrap || !rotateGroup){
    skillViewOverride[charId] = mode;
    renderSystemSection();
    return;
  }

  const targetColor = mode === 'corrupted' ? (char.corruptionColor || DEFAULT_CORRUPTION_COLOR) : 'var(--bone)';
  const nodes = wrap.querySelectorAll('.skill-node');

  // phase 1: converge outer nodes toward the center node
  nodes.forEach(n => { if(n.dataset.idx !== '0') n.classList.add('converge'); });

  setTimeout(() => {
    // phase 2: spin the merged cluster
    rotateGroup.classList.add('spinning');

    setTimeout(() => {
      // phase 3: recolor every node, then let them diverge back to position
      nodes.forEach(n => {
        n.querySelectorAll('.ring-outer, .ring-inner, .spike-line').forEach(el => { el.style.stroke = targetColor; el.style.color = targetColor; });
        n.querySelectorAll('.node-label').forEach(el => { el.style.fill = targetColor; });
      });
      rotateGroup.classList.remove('spinning');
      nodes.forEach(n => n.classList.remove('converge'));

      setTimeout(() => {
        skillViewOverride[charId] = mode;
        renderSystemSection();
      }, 600);
    }, 650);
  }, 550);
}

async function setCorruptionColor(charId, colorValue){
  const char = state.characters.find(c => c.id === charId);
  if(!char) return;
  char.corruptionColor = colorValue;
  await persistState();
  renderSystemSection();
}

let sysTab = 'chapter';
