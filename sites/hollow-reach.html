<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Epitaph — The Hollow Reach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ color-scheme:dark; --bg:#07060b; --panel:rgba(10,8,16,.86); --ink:#ece8f6; --dim:#8f88a6; --accent:#a796ff; --line:rgba(167,150,255,.24); --lbl-bg:#07060b; --lbl-fg:#ece8f6; }
  body.paper{ color-scheme:light; --bg:#f1ece4; --panel:rgba(252,249,243,.92); --ink:#141a2c; --dim:#6a6478; --accent:#5b49c8; --line:rgba(20,26,44,.18); --lbl-bg:#141a2c; --lbl-fg:#f1ece4; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font-family:'Space Mono',monospace; }
  #stage{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  header{ position:fixed; top:env(safe-area-inset-top,0px); left:0; right:0; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel); z-index:3; }
  header h1{ margin:0; font-family:'Bebas Neue',sans-serif; font-weight:400; font-size:22px; letter-spacing:.12em; color:var(--accent); }
  header h1 span{ color:var(--ink); opacity:.55; }
  header h1 a.back{ font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.1em; color:var(--dim); text-decoration:none; border:1px solid var(--line); padding:4px 8px; margin-right:10px; vertical-align:3px; }
  header h1 a.back:hover{ color:var(--accent); border-color:var(--accent); }
  .ctrls{ display:flex; gap:8px; flex-wrap:wrap; }
  .seg{ display:flex; border:1px solid var(--line); }
  .seg button{ font-family:'Bebas Neue',sans-serif; letter-spacing:.1em; font-size:14px; padding:6px 12px 5px; background:none; border:0; color:var(--dim); cursor:pointer; }
  .seg button + button{ border-left:1px solid var(--line); }
  .seg button.on{ background:var(--accent); color:var(--bg); }
  .seg button.walk{ color:var(--ink); }
  #labels{ position:fixed; inset:0; pointer-events:none; z-index:2; }
  .lbl{ position:absolute; left:0; top:0; white-space:nowrap; font-family:'Bebas Neue',sans-serif; letter-spacing:.08em; font-size:13px; line-height:1; padding:3px 6px 2px; background:var(--lbl-bg); color:var(--lbl-fg); border-left:3px solid var(--accent); transition:opacity .3s; will-change:transform; }
  #note{ position:fixed; left:16px; bottom:16px; width:min(380px, calc(100% - 32px)); padding:12px 14px; background:var(--panel); border:1px solid var(--line); font-size:11px; line-height:1.6; color:var(--dim); z-index:3; }
  #note h2{ margin:0 0 4px; font-family:'Bebas Neue',sans-serif; font-weight:400; letter-spacing:.1em; font-size:18px; color:var(--ink); }
  #note b{ color:var(--ink); }
  .hint{ position:fixed; right:16px; bottom:16px; font-size:10px; letter-spacing:.12em; color:var(--dim); text-transform:uppercase; z-index:3; }
  #boot{ position:fixed; inset:0; display:grid; place-items:center; color:var(--accent); letter-spacing:.2em; font-size:12px; background:var(--bg); z-index:9; }
  #fade{ position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .35s; z-index:8; display:grid; place-items:center; }
  #fade b{ font-family:'Bebas Neue',sans-serif; font-weight:400; letter-spacing:.3em; font-size:30px; color:var(--accent); text-align:center; padding:0 16px; }
  #fp{ display:none; }
  body.walking #fp{ display:block; }
  body.walking #labels, body.walking #note, body.walking .hint{ display:none; }
  body.walking #stage{ cursor:grab; }
  #fpChap{ position:fixed; top:66px; left:16px; display:flex; border:1px solid var(--line); background:var(--panel); z-index:3; }
  #fpChap button{ font-family:'Bebas Neue',sans-serif; letter-spacing:.1em; font-size:14px; padding:6px 12px 5px; background:none; border:0; color:var(--dim); cursor:pointer; }
  #fpChap button + button{ border-left:1px solid var(--line); }
  #fpChap button.on{ background:var(--accent); color:var(--bg); }
  #fpCard{ position:fixed; left:50%; bottom:72px; transform:translateX(-50%); width:min(480px, calc(100% - 32px)); padding:12px 14px; background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent); font-size:12px; line-height:1.6; color:var(--dim); opacity:0; transition:opacity .35s; z-index:3; pointer-events:none; }
  #fpCard.on{ opacity:1; }
  #fpCard h3{ margin:0 0 4px; font-family:'Bebas Neue',sans-serif; font-weight:400; letter-spacing:.1em; font-size:19px; color:var(--ink); }
  #fpCard p{ margin:0; }
  #fpBar{ position:fixed; left:16px; right:16px; bottom:16px; display:flex; gap:8px; align-items:center; z-index:3; }
  #fpBar button{ font-family:'Bebas Neue',sans-serif; letter-spacing:.1em; font-size:15px; padding:7px 14px 6px; background:var(--panel); border:1px solid var(--line); color:var(--ink); cursor:pointer; }
  #fpBar button:hover{ border-color:var(--accent); color:var(--accent); }
  #fpTrack{ position:relative; flex:1; height:4px; background:var(--line); }
  #fpFill{ position:absolute; left:0; top:0; bottom:0; background:var(--accent); width:0; }
  #fpTrack .tick{ position:absolute; top:-4px; width:2px; height:12px; margin-left:-1px; background:var(--ink); opacity:.55; }
  #fpHint{ position:fixed; right:16px; top:66px; font-size:10px; letter-spacing:.12em; color:var(--dim); text-transform:uppercase; z-index:3; text-align:right; line-height:1.7; }
  @media (max-width:640px){ #fpHint{ display:none; } #fpCard{ font-size:11px; bottom:104px; } #fpChap{ top:auto; bottom:60px; left:16px; } .hint{ display:none; } #note{ font-size:10px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="stage"></canvas>
<div id="labels"></div>
<header>
  <h1><a href="../atlas-3d.html?view=earth&amp;era=1" class="back" title="Back to the map">← Map</a> Epitaph <span>//</span> The Hollow Reach</h1>
  <div class="ctrls">
    <div class="seg" id="styleSeg"><button data-v="model" class="on">Model</button><button data-v="blocks">Blocks</button></div>
    <div class="seg" id="themeSeg"><button data-v="crt" class="on">Signal</button><button data-v="paper">Paper</button></div>
    <div class="seg"><button id="walkBtn" class="walk">Walk inside</button></div>
    <div class="seg" id="tagSeg"><button data-v="on" class="on">Names</button><button data-v="off">Off</button></div>
  </div>
</header>
<aside id="note"></aside>
<div id="fade"><b></b></div>
<div id="fp">
  <nav id="fpChap"></nav>
  <span id="fpHint">drag to look<br>scroll or W / S to walk<br>space / → next stop · ← back<br>esc to leave</span>
  <div id="fpCard"><h3></h3><p></p></div>
  <div id="fpBar"><button id="fpPrev">‹ Back</button><div id="fpTrack"><i id="fpFill"></i></div><button id="fpNext">Next ›</button><button id="fpExit">Leave</button></div>
</div>
<span class="hint">drag to turn · scroll to zoom · walk inside: top right</span>
<div id="boot">OPENING THE HOLLOW…</div>
<script type="module" src="../assets/sites/hollow-reach.js?v=1"></script>
</body>
</html>
