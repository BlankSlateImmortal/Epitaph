<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Epitaph — Aurelia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#080603; --panel:rgba(12,9,5,.86); --ink:#f1e6cf; --dim:#9a8a6c; --accent:#ffb238; --line:rgba(255,178,56,.22); --ember:#d4452b; --lbl-bg:#080603; --lbl-fg:#f1e6cf; }
  body.paper{ --bg:#f6eddd; --panel:rgba(255,250,241,.92); --ink:#141a2c; --dim:#6e6553; --accent:#c4561e; --line:rgba(20,26,44,.18); --lbl-bg:#141a2c; --lbl-fg:#f6eddd; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font-family:'Space Mono',monospace; }
  #stage{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  header{ position:fixed; top:0; left:0; right:0; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel); z-index:3; }
  header h1{ margin:0; font-family:'Bebas Neue',sans-serif; font-weight:400; font-size:22px; letter-spacing:.12em; color:var(--accent); }
  header h1 span{ color:var(--ink); opacity:.55; }
  header h1 a.back{ font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.1em; color:var(--dim); text-decoration:none; border:1px solid var(--line); padding:4px 8px; margin-right:10px; vertical-align:3px; }
  header h1 a.back:hover{ color:var(--accent); border-color:var(--accent); }
  .ctrls{ display:flex; gap:8px; flex-wrap:wrap; }
  .seg{ display:flex; border:1px solid var(--line); }
  .seg button{ font-family:'Bebas Neue',sans-serif; letter-spacing:.1em; font-size:14px; padding:6px 12px 5px; background:none; border:0; color:var(--dim); cursor:pointer; }
  .seg button + button{ border-left:1px solid var(--line); }
  .seg button.on{ background:var(--accent); color:var(--bg); }
  .seg button.after.on{ background:var(--ember); color:#f1e6cf; }
  #labels{ position:fixed; inset:0; pointer-events:none; z-index:2; }
  .lbl{ position:absolute; left:0; top:0; white-space:nowrap; font-family:'Bebas Neue',sans-serif; letter-spacing:.08em; font-size:13px; line-height:1; padding:3px 6px 2px; background:var(--lbl-bg); color:var(--lbl-fg); border-left:3px solid var(--accent); transition:opacity .3s; will-change:transform; }
  .lbl.ember{ border-left-color:var(--ember); }
  #note{ position:fixed; left:16px; bottom:16px; width:min(360px, calc(100% - 32px)); padding:12px 14px; background:var(--panel); border:1px solid var(--line); font-size:11px; line-height:1.6; color:var(--dim); z-index:3; }
  #note h2{ margin:0 0 4px; font-family:'Bebas Neue',sans-serif; font-weight:400; letter-spacing:.1em; font-size:18px; color:var(--ink); }
  #note b{ color:var(--ink); }
  .hint{ position:fixed; right:16px; bottom:16px; font-size:10px; letter-spacing:.12em; color:var(--dim); text-transform:uppercase; z-index:3; }
  #boot{ position:fixed; inset:0; display:grid; place-items:center; color:var(--accent); letter-spacing:.2em; font-size:12px; background:var(--bg); z-index:9; }
  @media (max-width:640px){ .hint{ display:none; } #note{ font-size:10px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="stage"></canvas>
<div id="labels"></div>
<header>
  <h1><a href="../atlas-3d.html?view=earth&amp;era=1" class="back" title="Back to the map">← Map</a> Epitaph <span>//</span> Aurelia</h1>
  <div class="ctrls">
    <div class="seg" id="stateSeg"><button data-v="0" class="on">Before</button><button data-v="1" class="after">After the Calamity</button></div>
    <div class="seg" id="themeSeg"><button data-v="crt" class="on">Signal</button><button data-v="paper">Paper</button></div>
    <div class="seg" id="tagSeg"><button data-v="on" class="on">Names</button><button data-v="off">Off</button></div>
  </div>
</header>
<aside id="note"></aside>
<span class="hint">drag to turn · scroll to zoom</span>
<div id="boot">RAISING AURELIA…</div>
<script type="module" src="../assets/sites/aurelia.js?v=1"></script>
</body>
</html>
